<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f1512">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>宠物养成 - 妙搭小站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root{ --bg:#0f0d08; --panel:#16130c; --txt:#e8dcc8; --sub:#9a8868; --gold:#d4a84b; --c:#46c39a; }
  html,body{background:var(--bg);}
  body { min-height:100vh; font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:var(--txt);
    display:flex; flex-direction:column; align-items:center; padding:24px 12px 40px;
    background: radial-gradient(ellipse at 18% 0%, rgba(70,195,154,.10) 0%, transparent 52%),
      radial-gradient(ellipse at 82% 100%, rgba(255,111,165,.07) 0%, transparent 50%), var(--bg); }
  .wrap{width:100%;max-width:640px;display:flex;flex-direction:column;}
  .top{width:100%;display:flex;align-items:center;margin-bottom:12px;}
  .back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;text-decoration:none;
    background:rgba(212,168,75,.08);border:1px solid rgba(212,168,75,.3);color:var(--sub);font-size:13px;transition:.2s;}
  .back:hover{color:var(--gold);border-color:var(--gold);}
  .head{text-align:center;margin:6px 0 14px;}
  .head h1{font-family:"STKaiti","KaiTi","楷体",serif;font-size:28px;letter-spacing:6px;
    background:linear-gradient(135deg,#7fe8c3,#46c39a 45%,#a8f0d8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .head p{color:var(--sub);font-size:11px;letter-spacing:4px;margin-top:6px;}
  .panel{background:var(--panel);border:1px solid rgba(212,168,75,.18);border-radius:14px;padding:14px;margin-bottom:12px;}
  .stageName{font-family:"STKaiti","KaiTi",serif;font-size:22px;color:var(--c);text-align:center;letter-spacing:3px;}
  .stageSub{font-size:11px;color:var(--sub);text-align:center;letter-spacing:2px;margin-top:4px;}
  .petbox{position:relative;width:100%;margin:10px auto 4px;}
  canvas#pet{display:block;width:100%;height:auto;image-rendering:pixel-image;}
  #bubble{position:absolute;top:-6px;left:50%;transform:translate(-50%,-100%);background:#241c10;
    border:1px solid rgba(212,168,75,.4);color:var(--txt);font-size:13px;padding:6px 12px;border-radius:12px;
    white-space:nowrap;opacity:0;transition:.25s;pointer-events:none;}
  #bubble.show{opacity:1;}
  .barRow{display:flex;align-items:center;gap:8px;margin:8px 0;}
  .barRow .n{width:44px;font-size:12.5px;color:var(--sub);}
  .barRow .track{flex:1;height:12px;background:#0b0a06;border-radius:6px;overflow:hidden;min-width:0;}
  .barRow .fill{height:100%;border-radius:6px;transition:width .4s;}
  .barRow .v{width:38px;font-size:12px;text-align:right;color:var(--txt);font-variant-numeric:tabular-nums;}
  .acts{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;margin-top:4px;}
  .acts button{font-family:inherit;color:var(--txt);background:rgba(70,195,154,.10);border:1px solid rgba(70,195,154,.4);
    border-radius:10px;min-height:48px;font-size:15px;cursor:pointer;transition:.15s;}
  .acts button:hover:not(:disabled){background:rgba(70,195,154,.22);}
  .acts button:disabled{opacity:.45;cursor:not:not-allowed;}
  .row{display:flex;flex-wrap:wrap;gap:8px;align-items:center;}
  .btn{font-family:inherit;color:var(--txt);background:rgba(212,168,75,.08);border:1px solid rgba(212,168,75,.3);
    border-radius:8px;min-height:44px;padding:0 14px;font-size:14px;cursor:pointer;transition:.15s;}
  .btn:hover:not(:disabled){border-color:var(--gold);color:var(--gold);}
  .btn:disabled{opacity:.45;cursor:not-allowed;}
  input[type=text]{width:100%;min-height:44px;font-size:16px;font-family:inherit;color:var(--txt);
    background:#0b0a06;border:1px solid rgba(212,168,75,.3);border-radius:8px;padding:0 12px;outline:none;}
  input[type=text]:focus{border-color:var(--c);}
  .kv{display:flex;justify-content:space-between;font-size:13px;color:var(--sub);line-height:2;}
  .kv b{color:var(--txt);font-weight:normal;}
  .tip{font-size:12px;color:var(--sub);line-height:1.7;text-align:center;}
  #toast{position:fixed;left:50%;bottom:28px;transform:translateX(-50%);background:#241c10;border:1px solid var(--gold);
    color:var(--txt);padding:10px 18px;border-radius:20px;font-size:13px;opacity:0;pointer-events:none;transition:.25s;z-index:99;}
  #toast.show{opacity:1;}
  @media (min-width:768px){
    body{padding:36px 20px 50px;}
    .head h1{font-size:36px;}
    .petbox{max-width:300px;}
    .acts{grid-template-columns:repeat(4,1fr);}
  }
</style>
</head>
<body>
<div class="wrap">
  <div class="top"><a class="back" href="create-hub.html">← 返回养成</a></div>
  <div class="head">
    <h1>宠物养成</h1>
    <p>PET CARE · 像素伙伴</p>
  </div>

  <div class="panel">
    <div class="stageName" id="petName">小团</div>
    <div class="stageSub" id="stageLabel">幼年</div>
    <div class="petbox">
      <div id="bubble"></div>
      <canvas id="pet"></canvas>
    </div>
    <div class="kv" style="margin-top:6px;">
      <span>成长经验</span><b id="expText">0 / 40</b>
    </div>
  </div>

  <div class="panel">
    <div class="barRow"><span class="n">饱食</span><div class="track"><div class="fill" id="barFull" style="background:#e0794a;"></div></div><span class="v" id="vFull">100</span></div>
    <div class="barRow"><span class="n">快乐</span><div class="track"><div class="fill" id="barHap" style="background:#ff6fa5;"></div></div><span class="v" id="vHap">100</span></div>
    <div class="barRow"><span class="n">清洁</span><div class="track"><div class="fill" id="barClean" style="background:#5b9bf5;"></div></div><span class="v" id="vClean">100</span></div>
    <div class="barRow"><span class="n">精力</span><div class="track"><div class="fill" id="barEnergy" style="background:#46c39a;"></div></div><span class="v" id="vEnergy">100</span></div>
  </div>

  <div class="panel">
    <div class="acts">
      <button id="actFeed">喂食</button>
      <button id="actPlay">玩耍</button>
      <button id="actClean">清洁</button>
      <button id="actRest">休息</button>
    </div>
  </div>

  <div class="panel">
    <div class="row" style="margin-bottom:10px;">
      <input type="text" id="nameInput" maxlength="10" placeholder="给宠物起个名字">
      <button class="btn" id="renameBtn">改名</button>
    </div>
    <div class="kv"><span>连续签到</span><b id="checkText">0 天</b></div>
    <div class="row" style="margin-top:10px;">
      <button class="btn" id="checkBtn">每日签到</button>
      <button class="btn" id="resetBtn" style="border-color:rgba(232,69,60,.5);color:#e88b86;">重置存档</button>
    </div>
  </div>

  <div class="tip">与你桌宠项目同款的像素伙伴。属性会随时间自然消耗，关掉页面也会按时间结算，记得常回来看看。</div>
</div>

<div id="toast"></div>

<script>
(function(){
'use strict';
/* ====== 像素 sprite：四阶段 ====== */
var SPRITES=[
 // 0 幼年
 [
  "....KKKK....",
  "..KKPPPPKK..",
  ".KPPPPPPPPK.",
  ".KPEPPPPEPK.",
  ".KPPPPPPPPK.",
  ".KPPBBBBPPK.",
  "..KPPPPPPK..",
  "...KKKKKK..."
 ],
 // 1 少年（长出耳朵）
 [
  ".K......K.",
  "KPK....KPK",
  "KPPK..KPPK",
  ".KPPPPPPPPK",
  "KPEPPPPPEPK",
  "KPPPPPPPPPPK",
  "KPPBBBBBBPPK",
  "KPPPPPPPPPPK",
  ".KPPPPPPPPK.",
  "..KKKKKKKK.."
 ],
 // 2 成年
 [
  "...K....K...",
  "..KPK..KPK..",
  "..KPPKKPPK..",
  ".KPPPPPPPPPK.",
  "KPEPPPPPPPPEK",
  "KPPPPPPPPPPPK",
  "KPPBBBBBBBBPK",
  "KPPPPPPPPPPPK",
  ".KPPPPPPPPPK.",
  ".KPPKPPKPPK.",
  "..KPP..PPK..",
  "..KKK..KKK.."
 ],
 // 3 进化（金角与高光）
 [
  "..H......H..",
  "..KH....HK..",
  "..KPK..KPK..",
  ".KPPPPPPPPPK.",
  "KPEPPPPPPPPEK",
  "KPPPPHHPPPPPK",
  "KPPBBBBBBBBPK",
  "KPPPPPPPPPPPK",
  ".KPPPKPPKPPK.",
  ".KPPPPPPPPPK.",
  "..KPPKPPKPP..",
  "..KKK..KKK..."
 ]
];
var COLORS={K:'#2a1f14',P:'#ff9ec3',B:'#ffe3ef',E:'#2a1f14',H:'#d4a84b'};
var STAGE_NAMES=['幼年','少年','成年','进化'];
var STAGE_EXP=[0,40,120,260];
var DECAY_PER_SEC=100/(40*3600);  // 满值约 40 小时见底

/* ====== 存档 ====== */
var KEY='miaodaPet';
var pet={ name:'小团', stage:0, exp:0,
  full:80, hap:80, clean:80, energy:80,
  checkStreak:0, lastCheck:'', lastTs:Date.now() };
function load(){
  try{
    var raw=localStorage.getItem(KEY);
    if(!raw)return false;
    var s=JSON.parse(raw);
    pet.name=s.name||'小团'; pet.stage=s.stage||0; pet.exp=s.exp||0;
    pet.full=+s.full||0; pet.hap=+s.hap||0; pet.clean=+s.clean||0; pet.energy=+s.energy||0;
    pet.checkStreak=s.checkStreak||0; pet.lastCheck=s.lastCheck||'';
    pet.lastTs=+s.lastTs||Date.now();
    return true;
  }catch(e){ return false; }
}
function save(){
  pet.lastTs=Date.now();
  try{ localStorage.setItem(KEY,JSON.stringify(pet)); }catch(e){}
}
function clamp(v){ return Math.max(0,Math.min(100,v)); }

/* ====== 离线衰减结算（时间戳差） ====== */
function settle(){
  var now=Date.now();
  var dt=(now-pet.lastTs)/1000;
  if(dt>0){
    var loss=dt*DECAY_PER_SEC;
    pet.full=clamp(pet.full-loss);
    pet.hap=clamp(pet.hap-loss*0.8);
    pet.clean=clamp(pet.clean-loss*0.9);
    pet.energy=clamp(pet.energy-loss*0.7);
  }
  pet.lastTs=now;
}

/* ====== Canvas 绘制 ====== */
var cv=document.getElementById('pet'), ctx=cv.getContext('2d');
var DPR=Math.min(2,window.devicePixelRatio||1);
cv.width=288*DPR; cv.height=288*DPR;
var blinkT=0, breathing=true;
function drawSprite(time){
  var map=SPRITES[pet.stage];
  var rows=map.length;
  var cols=Math.max.apply(null,map.map(function(r){return r.length;}));
  for(var i=0;i<rows;i++){ if(map[i].length<cols){ map[i]=map[i]+new Array(cols-map[i].length+1).join('.'); } }
  var cell=Math.floor(26*DPR);
  var offX=Math.floor((cv.width-cols*cell)/2);
  var bob=Math.round(Math.sin(time/500)*2*DPR);
  ctx.clearRect(0,0,cv.width,cv.height);
  var closed=((time%3200)<180);
  for(var y=0;y<rows;y++){
    for(var x=0;x<cols;x++){
      var ch=map[y][x]||'.';
      if(ch==='.')continue;
      if(ch==='E' && closed) ch='P';
      ctx.fillStyle=COLORS[ch]||'#f00';
      ctx.fillRect(offX+x*cell, y*cell+bob, cell, cell);
    }
  }
}
function loop(t){ drawSprite(t||0); requestAnimationFrame(loop); }

/* ====== UI 渲染 ====== */
function setBar(barId,valId,v){
  v=Math.round(v);
  document.getElementById(barId).style.width=v+'%';
  document.getElementById(valId).textContent=v;
}
function stageOf(exp){
  var s=0;
  for(var i=0;i<STAGE_EXP.length;i++){ if(exp>=STAGE_EXP[i])s=i; }
  return s;
}
function renderUI(){
  document.getElementById('petName').textContent=pet.name;
  document.getElementById('stageLabel').textContent=STAGE_NAMES[pet.stage]+' · 阶段 '+(pet.stage+1)+'/4';
  var next=STAGE_EXP[pet.stage+1];
  document.getElementById('expText').textContent= next!==undefined ? (pet.exp+' / '+next) : (pet.exp+'（已满阶）');
  setBar('barFull','vFull',pet.full);
  setBar('barHap','vHap',pet.hap);
  setBar('barClean','vClean',pet.clean);
  setBar('barEnergy','vEnergy',pet.energy);
  document.getElementById('checkText').textContent=pet.checkStreak+' 天';
  // 气泡
  var low=[];
  if(pet.full<30)low.push('好饿…');
  if(pet.hap<30)low.push('陪我玩玩…');
  if(pet.clean<30)low.push('想洗澡了…');
  if(pet.energy<30)low.push('好困…');
  var b=document.getElementById('bubble');
  if(low.length){ b.textContent=low[0]; b.classList.add('show'); }
  else b.classList.remove('show');
}

/* ====== 互动 ====== */
var CDS=8;
var timers={};
function lockBtn(id,fn){
  var btn=document.getElementById(id);
  btn.disabled=true;
  var left=CDS;
  btn.textContent=btn.dataset.label+' ('+left+')';
  timers[id]=setInterval(function(){
    left--;
    if(left<=0){
      clearInterval(timers[id]); timers[id]=null;
      btn.disabled=false; btn.textContent=btn.dataset.label;
    }else{
      btn.textContent=btn.dataset.label+' ('+left+')';
    }
  },1000);
}
function addExp(n){
  pet.exp+=n;
  var ns=stageOf(pet.exp);
  if(ns>pet.stage){
    pet.stage=ns;
    toast('进化！'+pet.name+' 成长为「'+STAGE_NAMES[ns]+'」');
    if(window.SFX&&SFX.level)SFX.level();
  }
}
function act(id,label,change,sfxName){
  document.getElementById(id).addEventListener('click',function(){
    Object.keys(change).forEach(function(k){ pet[k]=clamp(pet[k]+change[k]); });
    addExp(6);
    if(window.SFX&&SFX[sfxName])SFX[sfxName]();
    save(); renderUI();
    lockBtn(id);
  });
}
document.getElementById('actFeed').dataset.label='喂食';
document.getElementById('actPlay').dataset.label='玩耍';
document.getElementById('actClean').dataset.label='清洁';
document.getElementById('actRest').dataset.label='休息';
act('actFeed','喂食',{full:15,energy:-3},'eat');
act('actPlay','玩耍',{hap:12,energy:-8,full:-5},'pop');
act('actClean','清洁',{clean:15,hap:3},'flip');
act('actRest','休息',{energy:18},'move');

/* ====== 签到 / 改名 / 重置 ====== */
function todayStr(){ var d=new Date(); function p(v){return(v<10?'0':'')+v;} return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
function yesterdayStr(){ var d=new Date(Date.now()-86400000); function p(v){return(v<10?'0':'')+v;} return d.getFullYear()+'-'+p(d.getMonth()+1)+'-'+p(d.getDate()); }
document.getElementById('checkBtn').addEventListener('click',function(){
  var t=todayStr();
  if(pet.lastCheck===t){ toast('今天已经签过到啦'); return; }
  pet.checkStreak=(pet.lastCheck===yesterdayStr())?pet.checkStreak+1:1;
  pet.lastCheck=t;
  addExp(10);
  if(window.SFX&&SFX.coin)SFX.coin();
  save(); renderUI();
  toast('签到成功！连续 '+pet.checkStreak+' 天');
});
document.getElementById('renameBtn').addEventListener('click',function(){
  var v=document.getElementById('nameInput').value.trim();
  if(!v){ toast('请输入名字'); return; }
  pet.name=v.slice(0,10);
  save(); renderUI();
  if(window.SFX&&SFX.pop)SFX.pop();
  toast('改名成功：'+pet.name);
});
document.getElementById('resetBtn').addEventListener('click',function(){
  if(!window.confirm('确定要重置宠物存档吗？所有成长数据将被清空。'))return;
  try{localStorage.removeItem(KEY);}catch(e){}
  location.reload();
});

/* ====== toast ====== */
var toastTimer=null;
function toast(msg){
  var t=document.getElementById('toast');
  t.textContent=msg; t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer=setTimeout(function(){t.classList.remove('show');},1800);
}

/* ====== 在线衰减 + 在线时长经验 ====== */
setInterval(function(){
  var loss=DECAY_PER_SEC;
  pet.full=clamp(pet.full-loss);
  pet.hap=clamp(pet.hap-loss*0.8);
  pet.clean=clamp(pet.clean-loss*0.9);
  pet.energy=clamp(pet.energy-loss*0.7);
  renderUI();
},1000);
var onlineSec=0;
setInterval(function(){
  onlineSec+=60;
  if(onlineSec>=60){ addExp(1); onlineSec=0; }
},60000);
setInterval(save,10000);
window.addEventListener('beforeunload',save);

/* ====== init ====== */
var existed=load();
settle();
pet.stage=stageOf(pet.exp);
save();
renderUI();
requestAnimationFrame(loop);
if(!existed){ toast('欢迎领养 '+pet.name+'！'); }
})();
</script>

<script>
// 源码保护
(function(){
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    var key = e.key.toLowerCase();
    if (key === 'f12') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 'u') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 's') { e.preventDefault(); return; }
  });
  document.addEventListener('selectstart', function(e){
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
<script src="sounds.js"></script>
</body>
</html>
