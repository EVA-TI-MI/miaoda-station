<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#0f0d08; --paper:#16130c; --txt:#e8dcc8; --sub:#9a8868; --gold:#d4a84b; }
  html,body{background:var(--bg);}
  body{ min-height:100vh; font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:var(--txt);
    display:flex; flex-direction:column; align-items:center; padding:12px 10px 24px;
    background:radial-gradient(ellipse at 18% 0%,rgba(212,168,75,.12) 0%,transparent 52%),var(--bg); }
  .top{width:100%;max-width:560px;display:flex;justify-content:space-between;align-items:center;margin-bottom:8px;}
  .back{display:inline-flex;align-items:center;padding:7px 12px;border-radius:8px;text-decoration:none;
    background:rgba(212,168,75,.08);border:1px solid rgba(212,168,75,.3);color:var(--sub);font-size:12.5px;transition:.2s;}
  .back:hover{color:var(--gold);border-color:var(--gold);}
  .ttl{font-family:"STKaiti","KaiTi",serif;font-size:20px;letter-spacing:4px;color:var(--gold);}
  .status{width:100%;max-width:560px;display:flex;gap:8px;margin-bottom:8px;font-size:11.5px;color:var(--sub);flex-wrap:wrap;}
  .status b{color:var(--txt);font-weight:600;}
  .pill{padding:4px 10px;border-radius:99px;background:rgba(212,168,75,.08);border:1px solid rgba(212,168,75,.22);}
  .board{width:100%;max-width:560px;display:flex;flex-direction:column;gap:8px;flex:1;}
  .opp{background:rgba(255,255,255,.03);border:1px solid rgba(212,168,75,.16);border-radius:12px;padding:8px 10px;}
  .opp-h{display:flex;justify-content:space-between;align-items:center;font-size:12.5px;color:var(--sub);}
  .opp-h b{color:var(--txt);letter-spacing:1px;}
  .opp-mid{display:flex;align-items:center;gap:8px;margin-top:6px;min-height:34px;}
  .opp-river{display:flex;flex-wrap:wrap;gap:3px;margin-top:6px;min-height:24px;}
  .river-lbl{font-size:10px;color:#6a5a3e;margin-right:2px;align-self:center;}
  .tile{width:26px;height:34px;border-radius:4px;background:#f4ecd8;color:#2a2015;font-size:11px;font-weight:700;
    display:inline-flex;align-items:center;justify-content:center;flex-direction:column;line-height:1.05;
    box-shadow:0 2px 4px rgba(0,0,0,.35);position:relative;flex:none;}
  .tile .s{font-size:8px;opacity:.85;}
  .tile.m{color:#c03a2b;} .tile.p{color:#1d5fa8;} .tile.s{color:#2c8a3c;}
  .tile.back{background:#3a5c88;color:transparent;background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.08) 0 2px,transparent 2px 4px);}
  .tile.dim{opacity:.5;}
  .hand-wrap{position:sticky;bottom:0;background:linear-gradient(180deg,rgba(15,13,8,.85),#0f0d08 22%);padding:10px 0 8px;border-radius:14px;}
  .hand{display:flex;gap:3px;overflow-x:auto;padding:4px 2px 6px;max-width:100%;}
  .hand .tile{width:30px;height:40px;font-size:12px;cursor:pointer;transition:transform .12s;border:1px solid transparent;}
  .hand .tile .s{font-size:9px;}
  .hand .tile:hover{transform:translateY(-4px);}
  .hand .tile.sel{border-color:var(--gold);transform:translateY(-6px);box-shadow:0 0 10px rgba(212,168,75,.5);}
  .hand .tile.hintable{outline:2px dashed rgba(212,168,75,.7);outline-offset:-2px;}
  .hand::-webkit-scrollbar{height:4px;} .hand::-webkit-scrollbar-thumb{background:#3a2f1c;border-radius:2px;}
  .opbar{display:flex;gap:8px;margin-top:8px;flex-wrap:wrap;justify-content:center;}
  .obtn{display:none;padding:9px 20px;border-radius:8px;font-size:14px;letter-spacing:2px;border:1px solid var(--gold);
    color:var(--gold);background:rgba(212,168,75,.12);cursor:pointer;transition:.18s;}
  .obtn.on{display:inline-block;}
  .obtn:active{transform:scale(.96);}
  .obtn.hu{background:var(--gold);color:#14110b;}
  .obtn.gang{color:#ff7a59;border-color:#ff7a59;background:rgba(255,122,89,.12);}
  .foot{margin-top:16px;color:#6a5a3e;font-size:11px;letter-spacing:2px;text-align:center;}
  .mask{position:fixed;inset:0;background:rgba(10,8,5,.78);display:none;align-items:center;justify-content:center;z-index:20;}
  .mask.show{display:flex;}
  .dialog{max-width:340px;width:calc(100% - 40px);background:#1b160e;border:1px solid rgba(212,168,75,.35);border-radius:16px;
    padding:26px 22px;text-align:center;}
  .dialog h2{font-family:"STKaiti","KaiTi",serif;color:var(--gold);font-size:24px;letter-spacing:3px;margin-bottom:10px;}
  .dialog p{font-size:13px;color:var(--sub);line-height:1.9;margin-bottom:16px;}
  .dbtn{padding:10px 30px;border-radius:8px;border:1px solid var(--gold);background:var(--gold);color:#14110b;font-size:14px;letter-spacing:2px;cursor:pointer;}
  .dbtn.ghost{margin-left:10px;background:transparent;color:var(--gold);}
  .toast{position:fixed;left:50%;top:14%;transform:translateX(-50%);background:rgba(20,17,11,.92);border:1px solid rgba(212,168,75,.4);
    color:var(--txt);padding:9px 18px;border-radius:99px;font-size:13px;letter-spacing:1px;z-index:30;opacity:0;transition:opacity .25s;pointer-events:none;}
  .toast.show{opacity:1;}
  .tile-anim{position:fixed;z-index:40;pointer-events:none;}
  .nbox{display:flex;gap:8px;justify-content:center;margin-top:12px;flex-wrap:wrap;}
  .nin{width:180px;padding:10px;border-radius:8px;background:#241c10;border:1px solid rgba(212,168,75,.4);color:var(--txt);font-size:15px;letter-spacing:4px;text-align:center;}
  .nbig{font-size:32px;letter-spacing:10px;color:var(--gold);font-family:"STKaiti","KaiTi",serif;margin:6px 0;}
  .nlist{margin:8px 0;font-size:12.5px;color:var(--sub);line-height:1.9;min-height:8px;}
  .nbtn{padding:9px 18px;border-radius:8px;border:1px solid var(--gold);background:rgba(212,168,75,.12);color:var(--gold);font-size:13px;letter-spacing:1px;cursor:pointer;min-height:44px;}
  .nbtn.primary{background:var(--gold);color:#14110b;}
  .nbtn.grey{border-color:#4a3d22;color:var(--sub);background:transparent;}
  .nmode{display:flex;gap:6px;justify-content:center;margin-bottom:10px;}
  .nbtn.nm{padding:6px 16px;font-size:12.5px;border-radius:99px;min-height:36px;}
  .nbtn.nm.active{background:var(--gold);color:#14110b;}
  @media (min-width:768px){ .board{max-width:560px;} body{padding-top:20px;} }
</style>

  <div class="dialog">
    <h2 id="winTitle">和牌</h2>

<div class="toast" id="toast"></div>

<script>
(function(){
"use strict";
var SUITS=[['m','万'],['p','筒'],['s','条']];
var NUM=[1,2,3,4,5,6,7,8,9];
var TILES=[]; SUITS.forEach(function(su){ NUM.forEach(function(n){ TILES.push(su[0]+n); }); });
var BEST='miaodaMahjongBestV410', stats={score:0,wins:0,loses:0};
try{ var _s=JSON.parse(localStorage.getItem(BEST)||'{}'); if(_s&&_s.score!=null)stats=_s; else if(_s) stats={score:(_s.wins||0)*2+(_s.selfmo||0),wins:_s.wins||0,loses:_s.loses||0}; }catch(e){}
var S={}; // 状态
// ---------- 联机状态 ----------
var NET={mode:'solo', me:0, inGame:false, conns:[], connSeat:{}, realSeats:[0], waitAsk:-1, askTimer:null, turnTimer:null, _overShown:false};
var SEAT_NAMES=['南家','东家','北家','西家'];
function meIdx(){ return NET.mode==='solo'?0:(NET.me||0); }
function seatOfConn(conn){ return NET.connSeat[conn.peer]; }
function connOfSeat(seat){ for(var c in NET.connSeat){ if(NET.connSeat[c]===seat){ for(var i=0;i<NET.conns.length;i++){ if(NET.conns[i].peer===c) return NET.conns[i]; } } } return null; }
function sendIntent(msg){ if(Net.send({k:'intent',act:msg.act,tile:msg.tile})){ return true; } toast('连接已断开'); return false; }
function clone(x){return JSON.parse(JSON.stringify(x));}
function shuffle(a){for(var i=a.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=a[i];a[i]=a[j];a[j]=t;}return a;}
function count(hand,t){var c=0;for(var i=0;i<hand.length;i++)if(hand[i]===t)c++;return c;}
function cmap(hand){var m={};hand.forEach(function(t){m[t]=(m[t]||0)+1;});return m;}
function num(t){return +t.slice(1);}
function su(t){return t[0];}
function nxt(t){return su(t)+ (num(t)+1);}
function prev(t){return su(t)+ (num(t)-1);}
function tileLabel(t){var s=t[0],n=t.slice(1);var name='';SUITS.forEach(function(x){if(x[0]===s)name=x[1];});return name+n;}
function riverCount(t){var c=0;S.rivers.forEach(function(r){c+=count(r,t);});return c;}

// ---------- 牌型判定 ----------
function canFormMeldsN(m,left){
  var keys=Object.keys(m),i=0;
  for(;i<keys.length;i++){ if(m[keys[i]]>0) break; }
  if(i>=keys.length) return left===0;
  if(left===0) return false;
  var k=keys[i];
  if(m[k]>=3){ m[k]-=3; if(canFormMeldsN(m,left-1)){m[k]+=3;return true;} m[k]+=3; }
  var n=num(k);
  if(n<=7){ var k1=su(k)+(n+1),k2=su(k)+(n+2);
    if(m[k1]>0&&m[k2]>0){ m[k]--;m[k1]--;m[k2]--; if(canFormMeldsN(m,left-1)){m[k]++;m[k1]++;m[k2]++;return true;} m[k]++;m[k1]++;m[k2]++; }
  }
  return false;
}
function isSevenPairs(hand){
  if(hand.length!==14) return false;
  var m=cmap(hand),keys=Object.keys(m);
  for(var i=0;i<keys.length;i++) if(m[keys[i]]!==2) return false;
  return true;
}
// meldCount：已碰/杠/吃的面子组数；胡牌 = 手牌拆出(4-meldCount)面子 + 1 雀头（或纯手牌七对）
function canWinWith(hand,meldCount){
  var need=14-3*meldCount;
  if(hand.length!==need) return false;
  if(meldCount===0&&hand.length===14&&isSevenPairs(hand)) return true;
  var m=cmap(hand),keys=Object.keys(m);
  for(var i=0;i<keys.length;i++){
    if(m[keys[i]]>=2){
      m[keys[i]]-=2;
      if(canFormMeldsN(m,4-meldCount)){ m[keys[i]]+=2; return true; }
      m[keys[i]]+=2;
    }
  }
  return false;
}
// 听哪些牌：打掉一张后摸 t 即胡
function winTiles(hand,meldCount){
  var out=[],uniq={};
  hand.forEach(function(t){uniq[t]=1;});
  Object.keys(uniq).forEach(function(d){
    var idx=hand.indexOf(d);
    var h=hand.slice(); h.splice(idx,1);
    TILES.forEach(function(t){
      if(count(hand,t)>=4) return;
      if(canWinWith(h.concat([t]),meldCount)&&out.indexOf(t)<0) out.push(t);
    });
  });
  return out;
}
function meldCountOf(p){ return S.exposed[p.i].length; }

// ---------- AI ----------
function contribution(hand,t){
  var s=0,c=count(hand,t);
  if(c>=2) s+=3;
  var n=num(t);
  if(n>=2&&count(hand,prev(t))) s+=1.2;
  if(n>=3&&count(hand,su(t)+(n-2))) s+=1.2;
  if(n<=8&&count(hand,nxt(t))) s+=1.2;
  if(n<=7&&count(hand,su(t)+(n+2))) s+=1.2;
  if(n===1||n===9) s-=0.8;
  if(c>=3) s+=2;
  return s;
}
function safety(t){
  var s=riverCount(t)*2.5;
  var n=num(t);
  if(n>=2) s+=riverCount(prev(t))*0.8;
  if(n<=8) s+=riverCount(nxt(t))*0.8;
  if(S.lastDiscard!==null&&S.lastDiscard===t) s+=3;
  return s;
}
function aiDiscard(p){
  var hand=p.hand,best=null,bs=-1e9,uniq={};
  hand.forEach(function(t){uniq[t]=1;});
  Object.keys(uniq).forEach(function(t){
    if(count(hand,t)>=3){ return; } // 尽量保留刻子
    var sc=safety(t)*1.7 - contribution(hand,t);
    if(sc>bs){bs=sc;best=t;}
  });
  if(!best) best=hand[0];
  return best;
}
function aiRespond(others){
  // others: 可胡/可杠/可碰/可吃的家列表(按顺序)；返回第一家要动作的
  for(var i=0;i<others.length;i++){
    var o=others[i];
    if(o.canHu) return {p:o.p,act:'hu'};
  }
  for(var i=0;i<others.length;i++){
    var o=others[i];
    if(o.canGang&&Math.random()<0.85) return {p:o.p,act:'gang'};
  }
  for(var i=0;i<others.length;i++){
    var o=others[i];
    if(o.canPeng&&Math.random()<0.7) return {p:o.p,act:'peng'};
  }
  for(var i=0;i<others.length;i++){
    var o=others[i];
    if(o.canChi&&Math.random()<0.35) return {p:o.p,act:'chi'};
  }
  return null;
}

// ---------- 流程 ----------
function seatName(i){ return NET.mode==='solo' ? ['我 · 南','东家','北家','西家'][i] : SEAT_NAMES[i]; }
function newGame(){
  var deck=[];
  TILES.forEach(function(t){ for(var k=0;k<4;k++) deck.push(t); });
  deck=shuffle(deck);
  S={players:[],wall:deck,wallIdx:0,rivers:[[],[],[],[]],exposed:[[],[],[],[]],
     lastDiscard:null,lastBy:-1,phase:'deal',turn:Math.floor(Math.random()*4),respondStack:null,opening:true,
     winner:null,overMsg:null};
  for(var i=0;i<4;i++){
    var isReal = NET.mode==='solo' ? (i===0) : (NET.realSeats.indexOf(i)>=0);
    S.players.push({i:i,hand:deck.slice(i*13,(i+1)*13),ai:!isReal});
  }
  S.wallIdx=52;
  // 庄家多摸一张
  S.players[S.turn].hand.push(deck[S.wallIdx++]);
  S.phase='discard';
  NET._overShown=false;
  renderAll();
  toast(seatName(S.turn)+' 庄，先出牌');
  schedule();
}
function drawTile(p){
  if(S.wallIdx>=S.wall.length){ return false; }
  p.hand.push(S.wall[S.wallIdx++]);
  return true;
}
function discardTile(p,t){
  var i=p.hand.indexOf(t);
  if(i<0) return;
  p.hand.splice(i,1);
  S.rivers[p.i].push(t);
  S.lastDiscard=t; S.lastBy=p.i;
}
function endGame(msg,winnerSeat){
  S.phase='over';
  S.winner=winnerSeat; S.overMsg=msg;
  var selfWin = winnerSeat===meIdx();
  document.getElementById('mask').classList.add('show');
  document.getElementById('winTitle').textContent=selfWin?'和牌！':'本局结束';
  document.getElementById('winText').textContent=msg;
  if(NET.mode!=='client'){
    if(selfWin) stats.wins++;
    else stats.loses++;
    try{ localStorage.setItem(BEST,JSON.stringify(stats)); }catch(e){}
    renderScore();
  }
}
function afterDiscard(discarder, tile){
  // 依序检查 胡>杠>碰>吃
  var order=[];
  for(var k=1;k<=3;k++) order.push((discarder.i+k)%4);
  var options=[];
  order.forEach(function(pi){
    var p=S.players[pi];
    var canHu=canWinWith(p.hand.concat([tile]),meldCountOf(p));
    var canGang=count(p.hand,tile)===3;
    var canPeng=count(p.hand,tile)===2;
    var canChi=false;
    if((discarder.i+1)%4===pi){
      var n=num(tile);
      if(n>=3&&count(p.hand,su(tile)+(n-1))&&count(p.hand,su(tile)+(n-2))) canChi=true;
      if(n>=2&&n<=8&&count(p.hand,su(tile)+(n-1))&&count(p.hand,su(tile)+(n+1))) canChi=true;
      if(n<=7&&count(p.hand,su(tile)+(n+1))&&count(p.hand,su(tile)+(n+2))) canChi=true;
    }
    if(canHu||canGang||canPeng||canChi) options.push({p:p,canHu:canHu,canGang:canGang,canPeng:canPeng,canChi:canChi});
  });
  S.respondStack={options:options,discarder:discarder};
  if(NET.mode==='solo'){
    var my=options.filter(function(o){return o.p.i===0;})[0];
    if(my){
      showActions(my);
      return;
    }
    var act=aiRespond(options);
    if(act) performAction(act.p,act.act,tile,discarder);
    else nextAfterDiscard(discarder);
    return;
  }
  if(NET.mode==='host'){
    askNextResponder(options);
    return;
  }
}
// 联机响应流：按座位顺序询问真人，AI 直接决策
function askNextResponder(options){
  for(var i=0;i<options.length;i++){
    var o=options[i];
    if(NET.realSeats.indexOf(o.p.i)>=0){
      S.waitAsk=o.p.i;
      var conn=connOfSeat(o.p.i);
      if(conn){
        sendTo(conn,{k:'ask',type:'respond',opts:[{i:o.p.i,canHu:o.canHu,canGang:o.canGang,canPeng:o.canPeng,canChi:o.canChi}],discarder:S.respondStack.discarder.i});
        clearTimeout(NET.askTimer);
        NET.askTimer=setTimeout(function(){ aiTakeover(o.p.i,options); },20000);
        return;
      }
      // 房主自己
      clearTimeout(NET.askTimer);
      NET.askTimer=setTimeout(function(){ aiTakeover(o.p.i,options); },20000);
      showActions(o);
      return;
    }
  }
  // 全是 AI
  var aiOpts=options.filter(function(o){return NET.realSeats.indexOf(o.p.i)<0;});
  var act=aiRespond(aiOpts);
  if(act) performAction(act.p,act.act,S.lastDiscard,S.respondStack.discarder);
  else nextAfterDiscard(S.respondStack.discarder);
}
function aiTakeover(seat,options){
  if(S.phase!=='respond'||S.waitAsk!==seat) return;
  clearTimeout(NET.askTimer); NET.askTimer=null;
  S.waitAsk=-1;
  var idx=NET.realSeats.indexOf(seat);
  if(idx>=0) NET.realSeats.splice(idx,1);
  S.players[seat].ai=true;
  toast(seatName(seat)+' 未响应，AI 接管');
  var rest=options.filter(function(o){return o.p.i!==seat;});
  askNextResponder(rest);
}
function handleRespondIntent(seat,act){
  if(S.waitAsk!==seat) return;
  clearTimeout(NET.askTimer); NET.askTimer=null;
  S.waitAsk=-1;
  var st=S.respondStack;
  if(!st) return;
  if(act==='pass'){
    var rest=st.options.filter(function(o){return o.p.i!==seat;});
    askNextResponder(rest);
    return;
  }
  var o=st.options.filter(function(x){return x.p.i===seat;})[0];
  if(!o) return;
  var ok = act==='hu'?o.canHu : act==='gang'?o.canGang : act==='peng'?o.canPeng : act==='chi'?o.canChi : false;
  if(!ok) return;
  performAction(S.players[seat],act,S.lastDiscard,st.discarder);
}
function showActions(my){
  S.phase='respond';
  var hu=document.getElementById('bHu'),gang=document.getElementById('bGang'),
      peng=document.getElementById('bPeng'),chi=document.getElementById('bChi'),pass=document.getElementById('bPass');
  hu.className='obtn'+(my.canHu?' on hu':'');
  gang.className='obtn'+(my.canGang?' on gang':'');
  peng.className='obtn'+(my.canPeng?' on':'');
  chi.className='obtn'+(my.canChi?' on':'');
  pass.className='obtn on';
  toast('有牌可响应');
}
function hideActions(){
  ['bHu','bGang','bPeng','bChi','bPass'].forEach(function(id){document.getElementById(id).className='obtn';});
}
function performAction(p,act,tile,discarder){
  if(act==='hu'){
    if(tile) p.hand.push(tile);
    if(p.i===meIdx()) stats.score=(stats.score||0)+((discarder&&discarder.i!==p.i)?1:2);
    var msg;
    if(p.i===meIdx()) msg=(discarder&&discarder.i!==p.i)?'点炮和牌，积分 +1':'自摸和牌，积分 +2';
    else msg=seatName(p.i)+' 和牌';
    endGame(msg,p.i);
    renderAll();
    return;
  }
  if(act==='gang'||act==='peng'){
    var n=act==='gang'?3:2;
    var keep=[];var removed=0;
    p.hand=p.hand.filter(function(t){ if(t===tile&&removed<n){removed++;return false;} return true; });
    var tiles=[];for(var z=0;z<n+1;z++)tiles.push(tile);
    S.exposed[p.i].push({type:act,tiles:tiles});
    S.lastDiscard=null;
    if(act==='gang'){
      drawTile(p); // 杠后补牌
      toast(seatName(p.i)+' 杠，补牌');
    }
    renderAll();
    if(p.i===meIdx()){
      S.turn=p.i;S.phase='discard';
      renderHand();
      toast('你碰/杠了，请出牌');
    }else{
      S.turn=p.i;S.phase='discard';
      schedule();
    }
    return;
  }
  if(act==='chi'){
    var n=num(tile);
    // 找能吃的搭子：优先 (n-2,n-1) (n-1,n+1) (n+1,n+2)
    var find=null;
    if(n>=3&&count(p.hand,su(tile)+(n-1))&&count(p.hand,su(tile)+(n-2))) find=[su(tile)+(n-2),su(tile)+(n-1)];
    else if(n>=2&&n<=8&&count(p.hand,su(tile)+(n-1))&&count(p.hand,su(tile)+(n+1))) find=[su(tile)+(n-1),su(tile)+(n+1)];
    else if(n<=7&&count(p.hand,su(tile)+(n+1))&&count(p.hand,su(tile)+(n+2))) find=[su(tile)+(n+1),su(tile)+(n+2)];
    if(!find) return;
    find.forEach(function(t){ var i=p.hand.indexOf(t); if(i>=0)p.hand.splice(i,1); });
    S.exposed[p.i].push({type:'chi',tiles:find.concat([tile]).sort(function(a,b){return num(a)-num(b);})});
    S.lastDiscard=null;
    renderAll();
    if(p.i===meIdx()){ S.turn=p.i;S.phase='discard'; renderHand(); toast('你吃了，请出牌'); }
    else { S.turn=p.i;S.phase='discard'; schedule(); }
    return;
  }
}
function nextAfterDiscard(discarder){
  S.lastDiscard=null;
  S.turn=(discarder.i+1)%4;
  S.phase='discard';
  schedule();
}
function aiTurn(p){
  if(S.phase!=='discard') return;
  if(S.opening){ S.opening=false; }
  else if(!drawTile(p)){ endGame('牌墙摸完，荒庄平局',null); return; }
  renderAll();
  setTimeout(function(){
    if(S.phase!=='discard') return;
    // 暗杠检查
    var hasGang=null;
    var m=cmap(p.hand);
    Object.keys(m).forEach(function(t){ if(m[t]===4&&!hasGang) hasGang=t; });
    if(hasGang&&Math.random()<0.7){
      p.hand=p.hand.filter(function(t){return t!==hasGang;});
      var tiles=[];for(var z=0;z<4;z++)tiles.push(hasGang);
      S.exposed[p.i].push({type:'gang',tiles:tiles,hidden:true});
      drawTile(p);
      renderAll();
      toast(seatName(p.i)+' 暗杠');
    }
    var t=aiDiscard(p);
    discardTile(p,t);
    renderAll();
    afterDiscard(p,t);
  },900);
}
function schedule(){
  var p=S.players[S.turn];
  renderTurn();
  if(NET.mode==='host'&&NET.realSeats.indexOf(S.turn)>=0&&S.turn!==meIdx()){
    // 真人成员回合：房主先摸牌（若需要），广播后再让其出牌
    if(S.opening){ S.opening=false; renderAll(); }
    else if(!drawTile(p)){ endGame('牌墙摸完，荒庄平局',null); renderAll(); return; }
    renderAll();
    var conn=connOfSeat(p.i);
    if(conn){ sendTo(conn,{k:'ask',type:'turn'}); armTurnTimer(p.i); }
    return;
  }
  if(p.ai){ setTimeout(function(){ if(S.phase==='discard') aiTurn(p); },800); }
  else { if(S.opening){ S.opening=false; renderHand(); toast('你是庄家，请先出牌'); renderAll(); } else playerDrawPhase(); }
}
function armTurnTimer(seat){
  clearTimeout(NET.turnTimer);
  NET.turnTimer=setTimeout(function(){ aiTakeoverTurn(seat); },30000);
}
function aiTakeoverTurn(seat){
  if(S.phase!=='discard'||S.turn!==seat) return;
  clearTimeout(NET.turnTimer); NET.turnTimer=null;
  var idx=NET.realSeats.indexOf(seat);
  if(idx>=0) NET.realSeats.splice(idx,1);
  S.players[seat].ai=true;
  toast(seatName(seat)+' 长时间未操作，AI 接管');
  schedule();
}
function playerDrawPhase(){
  var p=S.players[meIdx()];
  if(!drawTile(p)){ endGame('牌墙摸完，荒庄平局',null); return; }
  S.phase='discard';
  renderAll();
  renderHand();
  // 暗杠提示
  var m=cmap(p.hand),hasGang=false;
  Object.keys(m).forEach(function(t){if(m[t]===4)hasGang=true;});
  document.getElementById('bGang').className='obtn'+(hasGang?' on gang':'');
  // 自摸判定
  document.getElementById('bHu').className='obtn'+(canWinWith(p.hand,meldCountOf(p))?' on hu':'');
  toast('轮到你出牌'+(hasGang?'（可暗杠）':''));
}

function renderHand(){

  var win=winTiles(sorted,meldCountOf(p));
  sorted.forEach(function(t,i){
    var d=tileEl(t,false);
    d.addEventListener('click',function(){
      if(S.phase!=='discard'||S.turn!==meIdx()) return;

        sendIntent({act:'discard',tile:t});

      renderAll();
      afterDiscard(p,t);
    });
    if(win.indexOf(t)>=0) d.classList.add('hintable');
    hand.appendChild(d);
  });
  var hint=document.getElementById('bHu');
  if(S.turn===meIdx()&&S.phase==='discard') hint.className='obtn'+(win.length?' on hu':'');
  if(win.length&&S.turn===meIdx()) toast('听牌：'+win.map(tileLabel).join(' '));

}

// ---------- 联机：视图广播与客户端应用 ----------
function viewOf(me){
  var v={k:'view',me:me,wallCnt:Math.max(0,S.wall.length-S.wallIdx),turn:S.turn,phase:S.phase,
    lastDiscard:S.lastDiscard,lastBy:S.lastBy,opening:!!S.opening,
    rivers:S.rivers,exposed:S.exposed,
    players:S.players.map(function(p){
      var h = (p.i===me)? p.hand.slice() : (function(){ var a=[]; for(var i=0;i<p.hand.length;i++) a.push('x'); return a; })();
      return {i:p.i,hand:h,ai:p.ai};
    }),
    respondStack:null,over:null};
  if(S.respondStack){
    var st=S.respondStack;
    v.respondStack={options:st.options.map(function(o){return {i:o.p.i,canHu:o.canHu,canGang:o.canGang,canPeng:o.canPeng,canChi:o.canChi};}),discarder:st.discarder?st.discarder.i:null};
  }
  if(S.phase==='over') v.over={winner:S.winner,msg:S.overMsg};
  return v;
}
function broadcastView(){
  NET.conns.forEach(function(conn){
    var seat=seatOfConn(conn);
    if(seat==null) return;
    sendTo(conn,viewOf(seat));
  });
}
function applyView(v){
  NET.me=v.me;
  S={players:[],wall:{length:v.wallCnt},wallIdx:0,rivers:v.rivers,exposed:v.exposed,
     lastDiscard:v.lastDiscard,lastBy:v.lastBy,phase:v.phase,turn:v.turn,
     respondStack:null,opening:v.opening,winner:null,overMsg:null};
  v.players.forEach(function(p){ S.players.push({i:p.i,hand:p.hand.slice(),ai:false}); });
  if(v.respondStack){
    var st=v.respondStack;
    S.respondStack={options:st.options.map(function(o){return {p:S.players[o.i],canHu:o.canHu,canGang:o.canGang,canPeng:o.canPeng,canChi:o.canChi};}),discarder:st.discarder!=null?S.players[st.discarder]:null};
  }
  if(v.over&&!NET._overShown){
    NET._overShown=true;
    var sw=v.over.winner===NET.me;
    document.getElementById('mask').classList.add('show');
    document.getElementById('winTitle').textContent=sw?'和牌！':'本局结束';
    document.getElementById('winText').textContent=v.over.msg;
    if(sw) stats.wins++; else stats.loses++;
    try{ localStorage.setItem(BEST,JSON.stringify(stats)); }catch(e){}
    renderScore();
  }
  if(!v.over) NET._overShown=false;
  renderAll();
  if(NET.mode==='client') updateClientTurn();
}
function updateClientTurn(){
  if(NET.mode!=='client') return;
  if(S.phase==='discard'&&S.turn===NET.me){
    var p=S.players[NET.me];
    if(S.opening){ toast('轮到你出牌'); return; }
    var hasGang=false,m=cmap(p.hand);
    Object.keys(m).forEach(function(t){if(m[t]===4)hasGang=true;});
    document.getElementById('bGang').className='obtn'+(hasGang?' on gang':'');
    document.getElementById('bHu').className='obtn'+(canWinWith(p.hand,meldCountOf(p))?' on hu':'');
    toast('轮到你出牌'+(hasGang?'（可暗杠）':''));
  }
}
function showActionsClient(o){
  S.phase='respond';
  var hu=document.getElementById('bHu'),gang=document.getElementById('bGang'),
      peng=document.getElementById('bPeng'),chi=document.getElementById('bChi'),pass=document.getElementById('bPass');
  hu.className='obtn'+(o.canHu?' on hu':'');
  gang.className='obtn'+(o.canGang?' on gang':'');
  peng.className='obtn'+(o.canPeng?' on':'');
  chi.className='obtn'+(o.canChi?' on':'');
  pass.className='obtn on';
  toast('有牌可响应');
}
function hideActionsClient(){
  ['bHu','bGang','bPeng','bChi','bPass'].forEach(function(id){document.getElementById(id).className='obtn';});
}
function onAsk(msg){
  if(NET.mode!=='client') return;
  if(msg.type==='respond'&&msg.opts&&msg.opts[0]){
    showActionsClient(msg.opts[0]);
  }
  if(msg.type==='turn'){
    if(S.opening) toast('轮到你出牌');
  }
}
function handleIntent(msg,seat){
  if(!NET.inGame) return;
  if(msg.k!=='intent') return;
  var act=msg.act;
  if(S.phase==='respond'){ handleRespondIntent(seat,act); return; }
  if(S.phase==='discard'&&S.turn===seat){
    var p=S.players[seat];
    clearTimeout(NET.turnTimer); NET.turnTimer=null;
    if(act==='discard'){
      var t=msg.tile;
      if(p.hand.indexOf(t)<0) return;
      discardTile(p,t);
      renderAll();
      afterDiscard(p,t);
    }else if(act==='gang'){
      var m=cmap(p.hand),tg=null;
      Object.keys(m).forEach(function(k){if(m[k]===4&&!tg)tg=k;});
      if(!tg) return;
      p.hand=p.hand.filter(function(x){return x!==tg;});
      var tiles=[];for(var z=0;z<4;z++)tiles.push(tg);
      S.exposed[seat].push({type:'gang',tiles:tiles,hidden:true});
      drawTile(p);
      renderAll();
      toast(seatName(seat)+' 暗杠');
      var conn=connOfSeat(seat);
      if(conn) sendTo(conn,{k:'ask',type:'turn'});
    }else if(act==='hu'){
      if(canWinWith(p.hand,meldCountOf(p))){
        performAction(p,'hu',null,null);
      }
    }
  }
}

}
document.getElementById('netModeLan').addEventListener('click',function(){ setNetMode('lan'); });
document.getElementById('netModeWan').addEventListener('click',function(){ setNetMode('wan'); });
setNetMode('lan');
function refreshNetUI(){
  if(NET.mode==='solo'){
    netCodeBox.style.display='none'; netCodeInput.style.display='block';
    netWait.style.display='none'; netStart.style.display='none'; netLeave.style.display='none';
    netMembers.textContent='';
    netCreate.style.display=''; netJoin.style.display=''; netCancel.style.display='';
    netTag.style.display='none';
    return;
  }
  netTag.style.display='';
  netCreate.style.display='none'; netJoin.style.display='none'; netCodeInput.style.display='none';
  netCancel.style.display=''; netLeave.style.display='';
  var code=Net.code();
  if(NET.mode==='host'){
    netCodeBox.style.display='block'; netCodeEl.textContent=code;
    var n=NET.conns.length;
    netMembers.textContent=n?('已加入：'+n+' 人（'+(n>=2?SEAT_NAMES[1]+'、'+SEAT_NAMES[2]:SEAT_NAMES[1])+'）'):'等待成员加入…（可 1 人开局，其余由 AI 补位）';
    netStart.style.display=NET.inGame?'none':'';
    netWait.style.display='none';
    netTag.textContent='联机 · '+code+' · '+(n+1)+'/4';
  }else{
    netCodeBox.style.display='block'; netCodeEl.textContent=code;
    netStart.style.display='none';
    netWait.style.display='block';
    netWait.textContent=NET.inGame?'对局中…':'已加入房间 '+code+'，等待房主开始';
    netMembers.textContent='';
    netTag.textContent='联机 · '+code;
  }
}
netBtn.addEventListener('click',showNetPanel);
netCancel.addEventListener('click',function(){ netMask.classList.remove('show'); });
netLeave.addEventListener('click',function(){ Net.leave(); location.reload(); });
netCreate.addEventListener('click',function(){
  netCreate.style.display='none'; netJoin.style.display='none';
  netMembers.textContent='正在创建房间…';
  Net.createRoom({game:'mh',
    onOpen:function(code){
      NET.mode='host'; NET.me=0; NET.inGame=false;
      refreshNetUI();
      toast('房间已创建：'+code+(NET_MODE==='wan'?'（远程，可发给异地朋友）':'（局域网直连）'));
    },
    onPeer:function(conn){
      NET.conns.push(conn);
      if(NET.inGame){ sendTo(conn,{k:'full'}); conn.close(); return; }
      refreshNetUI();
      toast('有新成员加入');
    },
    onData:function(conn,msg){
      if(NET.inGame&&msg.k==='intent'){
        handleIntent(msg,seatOfConn(conn));
      } else if(!NET.inGame){
        refreshNetUI();
      }
    },
    onPeerClose:function(conn){
      var seat=seatOfConn(conn);
      NET.conns=NET.conns.filter(function(c){return c!==conn;});
      delete NET.connSeat[conn.peer];
      if(NET.inGame&&seat!=null){
        clearTimeout(NET.turnTimer); NET.turnTimer=null;
        var idx=NET.realSeats.indexOf(seat);
        if(idx>=0){ NET.realSeats.splice(idx,1); S.players[seat].ai=true; toast(seatName(seat)+' 已离开，AI 接管'); }
        if(S.waitAsk===seat){
          clearTimeout(NET.askTimer); NET.askTimer=null; S.waitAsk=-1;
          var st=S.respondStack;
          if(st){ var rest=st.options.filter(function(o){return o.p.i!==seat;}); askNextResponder(rest); }
        }
        renderAll();
      } else refreshNetUI();
    },
    onError:function(e){
      if(e&&e.error==='peerjs-load-fail') toast('无法加载联机组件');
      else toast('联机错误：'+(e.type||e.error||'未知'));
    }
  });
});
netJoin.addEventListener('click',function(){
  var code=netCodeInput.value.trim().toUpperCase();
  if(code.length!==6){ toast('请输入 6 位房间码'); return; }
  netCodeInput.value='';
  netMembers.textContent='正在加入…';
  Net.joinRoom({game:'mh',code:code,
    onOpen:function(){
      NET.mode='client'; NET.inGame=false;
      clearTimeout(NET.askTimer); NET.askTimer=null;
      clearTimeout(NET.turnTimer); NET.turnTimer=null;
      if(S) S.phase='over';
      hideActions();
      renderAll();
      refreshNetUI();
      toast('已加入房间 '+code);
    },
    onData:function(conn,msg){
      if(msg.k==='full'){ toast('房间已满'); setTimeout(function(){location.reload();},600); return; }
      if(msg.k==='start'){ NET.inGame=true; refreshNetUI(); }
      else if(msg.k==='ask'){ onAsk(msg); }
      else if(msg.k==='view'){ applyView(msg); }
      else if(msg.k==='toast'){ toast(msg.msg); }
    },
    onClose:function(){ toast('与房主断开连接'); setTimeout(function(){location.reload();},900); },
    onError:function(e){
      if(e&&e.type==='room-not-found') toast('房间不存在，请核对房间码');
      else if(e&&e.error==='peerjs-load-fail') toast('无法加载联机组件');
      else toast('联机错误：'+(e.type||e.error||'未知'));
    }
  });
});
netStart.addEventListener('click',function(){
  if(NET.mode!=='host') return;
  NET.inGame=true;
  NET.realSeats=[0];
  NET.conns.forEach(function(conn,idx){
    NET.connSeat[conn.peer]=idx+1;
    NET.realSeats.push(idx+1);
  });
  NET.me=0;
  Net.broadcast({k:'start'});
  netMask.classList.remove('show');
  newGame();
});

newGame();
})();
</script>
