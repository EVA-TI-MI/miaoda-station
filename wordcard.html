<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="other">
<meta name="theme-color" content="#12141c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>单词卡 · 背诵 — 妙搭小站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#12141c; --txt:#e9eef7; --sub:#8b97b0; --gold:#e8c77a; --c:#ff7a59; }
  html,body{background:var(--bg);}
  body{min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt);
    display:flex;flex-direction:column;align-items:center;padding:28px 14px 34px;
    background:radial-gradient(ellipse at 12% 0%,rgba(255,122,89,.14) 0%,transparent 52%),
      radial-gradient(ellipse at 88% 6%,rgba(232,199,122,.10) 0%,transparent 50%),var(--bg);}
  .top{width:100%;max-width:680px;display:flex;justify-content:flex-start;margin-bottom:16px;}
  .back{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;text-decoration:none;
    background:rgba(33,41,62,.85);border:1px solid #2c3650;color:var(--sub);font-size:13.5px;transition:.2s;min-height:44px;}
  .back:hover{background:rgba(232,199,122,.12);border-color:var(--gold);color:var(--gold);}
  .head{text-align:center;margin:6px 0 4px;}
  .head h1{font-family:"STKaiti","KaiTi","楷体",serif;font-size:36px;letter-spacing:8px;margin-bottom:8px;
    background:linear-gradient(135deg,#ff9c80,#ff7a59 50%,#ffc8b5);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .head p{color:var(--sub);font-size:13.5px;letter-spacing:1px;line-height:1.8;}
  .stats{width:100%;max-width:680px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
    margin:14px 0 10px;padding:14px 16px;border-radius:12px;background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.09);color:var(--sub);font-size:13px;}
  .stats b{color:var(--gold);}
  .card-zone{width:100%;max-width:680px;display:flex;flex-direction:column;align-items:center;perspective:1000px;}
  .card{width:100%;min-height:280px;border-radius:20px;cursor:pointer;position:relative;transform-style:preserve-3d;
    transition:transform .45s;touch-action:manipulation;}
  .card.flip{transform:rotateY(180deg);}
  .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;border-radius:20px;
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:30px 24px;text-align:center;}
  .front{background:linear-gradient(160deg,#232a3c,#1b202e);border:1px solid rgba(255,122,89,.35);}
  .front .word{font-size:44px;font-weight:bold;letter-spacing:2px;color:var(--txt);}
  .front .phon{color:var(--sub);font-size:15px;margin-top:10px;}
  .front .tip{color:#566079;font-size:12px;margin-top:26px;}
  .back{transform:rotateY(180deg);background:linear-gradient(160deg,rgba(255,122,89,.12),#1b202e 70%);
    border:1px solid rgba(255,122,89,.45);}
  .back .mean{font-size:24px;line-height:1.9;color:var(--txt);}
  .back .pos{color:var(--sub);font-size:13px;margin-bottom:8px;letter-spacing:1px;}
  .ctrl{width:100%;max-width:680px;display:flex;gap:10px;justify-content:center;margin:18px 0 8px;flex-wrap:wrap;}
  .btn{padding:12px 24px;border-radius:10px;font-size:14.5px;letter-spacing:2px;cursor:pointer;transition:.2s;min-height:48px;}
  .btn.know{background:#46c39a;color:#12141c;border:none;font-weight:600;}
  .btn.dont{background:#e8453c;color:#fff;border:none;font-weight:600;}
  .btn.ghost{background:rgba(33,41,62,.85);border:1px solid #2c3650;color:var(--txt);}
  .btn:hover{transform:translateY(-2px);}
  .btn:disabled{opacity:.35;cursor:not-allowed;transform:none;}
  .extra{width:100%;max-width:680px;margin-top:18px;padding:18px;border-radius:14px;background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.09);}
  .extra h3{font-size:15px;color:var(--gold);letter-spacing:2px;margin-bottom:12px;font-family:"STKaiti","KaiTi",serif;}
  .add-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .add-row input{flex:1;min-width:150px;padding:11px 12px;border-radius:8px;background:#1b1f2c;border:1px solid #2c3650;
    color:var(--txt);font-size:14px;outline:none;min-height:44px;}
  .add-row input:focus{border-color:var(--gold);}
  .add-row .btn{padding:11px 16px;font-size:13.5px;min-height:44px;}
  .rev{display:flex;flex-wrap:wrap;gap:8px;align-items:center;color:var(--sub);font-size:13px;}
  .rev select{padding:10px;border-radius:8px;background:#1b1f2c;border:1px solid #2c3650;color:var(--txt);cursor:pointer;min-height:44px;}
  .foot{margin-top:26px;color:#566079;font-size:12px;letter-spacing:2px;text-align:center;}
  @media (max-width:520px){.head h1{font-size:29px;letter-spacing:5px;}.card{min-height:240px;}.front .word{font-size:34px;}.back .mean{font-size:20px;}}
</style>
</head>
<body>
  <div class="top"><a class="back" href="index.html">← 返回首页</a></div>
  <div class="head">
    <h1>单词卡</h1>
    <p>卡片翻转背单词 —— 认识进词库，不认识进错词本，进度本地保存</p>
  </div>

  <div class="stats">
    <span>总词 <b id="sTotal">0</b></span>
    <span>已认识 <b id="sKnown">0</b></span>
    <span>待复习 <b id="sReview">0</b></span>
    <span>本轮进度 <b id="sProg">0/0</b></span>
  </div>

  <div class="card-zone">
    <div class="card" id="card">
      <div class="face front">
        <div class="word" id="cWord">—</div>
        <div class="phon" id="cPhon"></div>
        <div class="tip">点卡片查看释义，或按空格</div>
      </div>
      <div class="face back">
        <div class="pos" id="cPos"></div>
        <div class="mean" id="cMean"></div>
      </div>
    </div>
  </div>

  <div class="ctrl">
    <button class="btn know" id="knowBtn">认识 ✓</button>
    <button class="btn dont" id="dontBtn">不认识 ✗</button>
    <button class="btn ghost" id="againBtn">再来一轮</button>
  </div>
  <div class="msg" style="min-height:26px;text-align:center;color:var(--gold);font-size:13.5px;" id="msg"></div>

  <div class="extra">
    <h3>添加单词 / 复习设置</h3>
    <div class="add-row">
      <input id="newWord" placeholder="英文单词">
      <input id="newMean" placeholder="释义，如 vt. 完成；实现">
      <button class="btn ghost" id="addBtn">添加</button>
    </div>
    <div class="rev">
      <span>复习范围：</span>
      <select id="modeSel">
        <option value="all">全部单词</option>
        <option value="unknown" selected>仅错词本（不认识的）</option>
        <option value="known">仅已认识的</option>
      </select>
      <button class="btn ghost" id="resetBtn">清空进度</button>
      <span id="tip">不认识会自动加入错词本</span>
    </div>
  </div>

  <div class="foot">妙搭小站 · 单词卡 · 纯本地记忆进度</div>

    ['viewpoint','n. 观点'],['virtual','adj. 虚拟的；实际上的'],['visible','adj. 可见的'],
    ['vital','adj. 至关重要的'],['volume','n. 体积；音量；卷'],['welfare','n. 福利；幸福'],
    ['witness','n./vt. 目击者；见证'],['worthwhile','adj. 值得的'],['yield','v./n. 产出；屈服']
  ];

  var state={data:{},custom:[]};
  var deck=[],pos=0,flipped=false,lastSeen={};

  function load(){
    try{state=JSON.parse(localStorage.getItem(STORE_KEY)||'null')||{data:{},custom:[]};}catch(e){state={data:{},custom:[]};}
    if(!state.data)state.data={};
    if(!state.custom)state.custom=[];
  }
  function save(){try{localStorage.setItem(STORE_KEY,JSON.stringify(state));}catch(e){}}

  function allWords(){
    var map={};
    BUILTIN.concat(state.custom).forEach(function(w){
      if(!map[w[0]])map[w[0]]=w;
    });
    return Object.keys(map).map(function(k){return map[k];});
  }

  function buildDeck(){
    var mode=$('modeSel').value;
    var words=allWords();
    if(mode==='unknown')words=words.filter(function(w){return state.data[w[0]]&&state.data[w[0]].s==='unknown';});
    if(mode==='known')words=words.filter(function(w){return state.data[w[0]]&&state.data[w[0]].s==='known';});
    deck=words.slice();
    // 未知优先 + 随机
    deck.sort(function(a,b){return (state.data[a[0]]&&state.data[a[0]].s==='unknown'?0:1)-(state.data[b[0]]&&state.data[b[0]].s==='unknown'?0:1);});
    for(var i=deck.length-1;i>0;i--){var j=Math.floor(Math.random()*(i+1));var t=deck[i];deck[i]=deck[j];deck[j]=t;}
    pos=0;flipped=false;
    renderStats();
    showCard();
  }

  function showCard(){
    if(!deck.length){$('cWord').textContent='词库为空';$('cPhon').textContent='';$('cPos').textContent='';$('cMean').textContent='去上方添加单词';$('msg').textContent='';return;}
    if(pos>=deck.length){
      $('cWord').textContent='本轮完成！';$('cPhon').textContent='';$('cPos').textContent='';$('cMean').textContent='点击「再来一轮」继续复习';
      $('msg').textContent='';
      return;
    }
    var w=deck[pos];
    flipped=false;
    $('card').classList.remove('flip');
    $('cWord').textContent=w[0];
    $('cPhon').textContent='';
    $('cPos').textContent='';
    $('cMean').textContent=w[1];
    $('msg').textContent='';
    renderStats();
  }

  function flip(){
    if(!deck.length||pos>=deck.length)return;
    var card=$('card');
    if(flipped)return;
    flipped=true;
    card.classList.add('flip');
  }

  function answer(know){
    if(!deck.length||pos>=deck.length)return;
    var w=deck[pos][0];
    lastSeen[w]=1;
    state.data[w]=state.data[w]||{s:'unknown',n:0};
    state.data[w].s=know?'known':'unknown';
    state.data[w].n=(state.data[w].n||0)+1;
    save();
    pos++;
    showCard();
  }

  function renderStats(){
    var words=allWords();
    var known=0,unknown=0;
    words.forEach(function(w){var d=state.data[w[0]];if(d&&d.s==='known')known++;else unknown++;});
    $('sTotal').textContent=words.length;
    $('sKnown').textContent=known;
    $('sReview').textContent=unknown;
    $('sProg').textContent=deck.length?Math.min(pos+1,deck.length)+'/'+deck.length:'0/0';
  }

  function addWord(){
    var w=$('newWord').value.trim(),m=$('newMean').value.trim();
    if(!w||!m){$('msg').textContent='单词和释义都要填';return;}
    state.custom.push([w,m]);
    save();
    $('newWord').value='';$('newMean').value='';
    $('msg').textContent='已添加 '+w+'；若已有该词则忽略重复';
    buildDeck();
  }

  function resetProgress(){
    if(!confirm('确认清空全部学习进度？'))return;
    state.data={};
    save();
    buildDeck();
    $('msg').textContent='进度已清空';
  }

  $('card').addEventListener('click',flip);
  $('knowBtn').addEventListener('click',function(){answer(true);});
  $('dontBtn').addEventListener('click',function(){answer(false);});
  $('againBtn').addEventListener('click',buildDeck);
  $('addBtn').addEventListener('click',addWord);
  $('modeSel').addEventListener('change',buildDeck);
  $('resetBtn').addEventListener('click',resetProgress);
  document.addEventListener('keydown',function(e){
    if(e.target.tagName==='INPUT')return;
    if(e.code==='Space'){e.preventDefault();if(flipped){answer(false);}else{flip();}}
    if(e.code==='ArrowRight'||e.code==='ArrowLeft'){if(flipped)answer(true);}
  });
  load();
  buildDeck();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
