<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="other">
<meta name="theme-color" content="#12141c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>数回 · Slitherlink — 妙搭小站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#12141c; --txt:#e9eef7; --sub:#8b97b0; --gold:#e8c77a; --c:#4ad6c1; }
  html,body{background:var(--bg);}
  body{min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt);
    display:flex;flex-direction:column;align-items:center;padding:28px 14px 34px;
    background:radial-gradient(ellipse at 12% 0%,rgba(74,214,193,.14) 0%,transparent 52%),
      radial-gradient(ellipse at 88% 6%,rgba(232,199,122,.10) 0%,transparent 50%),var(--bg);}
  .top{width:100%;max-width:820px;display:flex;justify-content:flex-start;margin-bottom:16px;}
  .back{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;text-decoration:none;
    background:rgba(33,41,62,.85);border:1px solid #2c3650;color:var(--sub);font-size:13.5px;transition:.2s;min-height:44px;}
  .back:hover{background:rgba(232,199,122,.12);border-color:var(--gold);color:var(--gold);}
  .head{text-align:center;margin:6px 0 4px;}
  .head h1{font-family:"STKaiti","KaiTi","楷体",serif;font-size:36px;letter-spacing:8px;margin-bottom:8px;
    background:linear-gradient(135deg,#7fe6d8,#4ad6c1 50%,#c9f5ee);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .head p{color:var(--sub);font-size:13.5px;letter-spacing:1px;line-height:1.8;}
  .toolbar{width:100%;max-width:820px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:14px 0 12px;}
  .btn{padding:9px 16px;border-radius:8px;font-size:14px;color:var(--txt);background:rgba(33,41,62,.85);
    border:1px solid #2c3650;cursor:pointer;transition:.2s;min-height:42px;}
  .btn:hover{border-color:var(--gold);color:var(--gold);}
  select.btn{cursor:pointer;}
  .info{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;color:var(--sub);font-size:13px;margin-bottom:10px;}
  .info b{color:var(--gold);font-weight:600;}
  .board-wrap{width:100%;max-width:820px;display:flex;justify-content:center;overflow-x:auto;padding:6px 0;}
  canvas{display:block;touch-action:manipulation;background:rgba(255,255,255,.02);border-radius:12px;}
  .msg{min-height:28px;font-size:14px;color:var(--gold);margin-top:10px;letter-spacing:1px;}
  .stats{width:100%;max-width:820px;margin-top:8px;padding:16px;border-radius:12px;background:rgba(255,255,255,.03);
    border:1px solid rgba(74,214,193,.16);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--sub);font-size:13px;}
  .stats b{color:var(--gold);}
  .modal{position:fixed;inset:0;background:rgba(8,9,13,.82);display:none;align-items:center;justify-content:center;z-index:50;padding:20px;}
  .modal.show{display:flex;}
  .modal-card{background:#1b1f2c;border:1px solid rgba(74,214,193,.35);border-radius:16px;padding:30px 26px;max-width:340px;width:100%;text-align:center;}
  .modal-card h2{font-family:"STKaiti","KaiTi",serif;color:#4ad6c1;font-size:24px;letter-spacing:3px;margin-bottom:12px;}
  .modal-card p{color:var(--sub);font-size:14px;line-height:1.9;margin-bottom:18px;}
  .foot{margin-top:26px;color:#566079;font-size:12px;letter-spacing:2px;text-align:center;}
  @media (max-width:520px){.head h1{font-size:29px;letter-spacing:5px;}}
</style>
</head>
<body>
  <div class="top"><a class="back" href="fun.html">← 返回</a></div>
  <div class="head">
    <h1>数回</h1>
    <p>Slitherlink · 一圈定乾坤 —— 数字是它四周线段的数量，把所有线段连成一条闭合回路</p>
  </div>

  <div class="toolbar">
    <button class="btn" id="newBtn">换一题</button>
    <select class="btn" id="sizeSel" style="cursor:pointer">
      <option value="5">5×5 · 入门</option>
      <option value="8" selected>8×8 · 进阶</option>
      <option value="10">10×10 · 大师</option>
    </select>
    <select class="btn" id="diffSel" style="cursor:pointer">
      <option value="0.55">线索多 · 轻松</option>
      <option value="0.35" selected>线索中 · 标准</option>
      <option value="0.22">线索少 · 硬核</option>
    </select>
    <button class="btn" id="checkBtn">检查</button>
  </div>
  <div class="info"><span>用时 <b id="time">00:00</b></span><span>已画线 <b id="cnt">0</b></span><span>最佳 <b id="best">—</b></span></div>
  <div class="board-wrap"><canvas id="cv"></canvas></div>
  <div class="msg" id="msg">点线段画线，再点变 ×，三击清除；完成要求：数字全符 + 单条闭合回路</div>
  <div class="stats">
    <span>玩法：<b>画线</b> 相邻顶点间的线段，点按循环「线 → × → 清除」</span>
    <span>判定：<b>数字与周围线段数一致</b>，且所有线段连成唯一闭合圈</span>
  </div>

  <div class="modal" id="winModal">
    <div class="modal-card">
      <h2 id="winTitle">回路闭合！</h2>
      <p id="winText"></p>
      <button class="btn" id="winBtn">再开一局 →</button>
    </div>
  </div>

  <div class="foot">妙搭小站 · 数回 SLITHERLINK · 纯本地</div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var BEST_KEY='miaodaSlitherBestV46';
  var cv=$('cv'),ctx=cv.getContext('2d');
  var cur={w:0,h:0,nums:[],hLine:[],vLine:[],state:{},time:0,timer:null,solved:false};
  var EDGE_W=5,CELL=44,PAD=18,FONT=16;

  // ===== 回路模板（几何回路，保证有解） =====
  // 返回边集合：hLine[v][h] 顶点(v,h)-(v,h+1)；vLine[v][h] 顶点(v,h)-(v+1,h)
  function rectLoop(w,h,dx,dy,dw,dh){
    // 内矩形：左上(dx,dy) 宽dw 高dh 的矩形边界
    var hl={},vl={};
    function H(v,x){ (hl[v]=hl[v]||{})[x]=1; }
    function V(v,x){ (vl[v]=vl[v]||{})[x]=1; }
    var x1=dx,y1=dy,x2=dx+dw,y2=dy+dh;
    for(var x=x1;x<x2;x++){H(y1,x);H(y2,x);}
    for(var y=y1;y<y2;y++){V(y,x1);V(y,x2);}
    return {hl:hl,vl:vl};
  }
  function loopFrom(w,h,kind){
    if(kind===0) return rectLoop(w,h,0,0,w,h);               // 外框
    if(kind===1) return rectLoop(w,h,1,1,w-2,h-2);           // 内框
    if(kind===2){ // 顶部下凹 U 形（外框顶部中央一段下移一行，仍是单回路）
      var hl={},vl={};
      function H2(v,x){(hl[v]=hl[v]||{})[x]=1;}
      function V2(v,x){(vl[v]=vl[v]||{})[x]=1;}
      for(var i=0;i<w;i++){H2(0,i);H2(h-1,i);}
      for(var j=0;j<h;j++){V2(j,0);V2(j,w-1);}
      if(w>=5){
        var cw=Math.floor(w/2);
        // 删顶部两段，改走 U 形
        delete hl[0][cw-1]; delete hl[0][cw];
        V2(1,cw-1); H2(1,cw-1); V2(1,cw); H2(1,cw-1);
        // 顶点(0,cw-1): H(0,cw-2)+V(1,cw-1)；顶点(1,cw-1): V(1,cw-1)+H(1,cw-1)
        // 顶点(1,cw): H(1,cw-1)+V(1,cw)；顶点(0,cw): V(1,cw)+H(0,cw)
      }
      return {hl:hl,vl:vl};
    }
    if(kind===3){ // 顶部下凹 + 底部上凸（对称变形，单回路）
      var hl3={},vl3={};
      function H3(v,x){(hl3[v]=hl3[v]||{})[x]=1;}
      function V3(v,x){(vl3[v]=vl3[v]||{})[x]=1;}
      for(var i2=0;i2<w;i2++){H3(0,i2);H3(h-1,i2);}
      for(var j2=0;j2<h;j2++){V3(j2,0);V3(j2,w-1);}
      if(w>=5){
        var cw3=Math.floor(w/2);
        delete hl3[0][cw3-1]; delete hl3[0][cw3];
        V3(1,cw3-1); H3(1,cw3-1); V3(1,cw3);
      }
      if(h>=5&&w>=5){
        var cw4=Math.floor(w/2);
        delete hl3[h-1][cw4-1]; delete hl3[h-1][cw4];
        V3(h-2,cw4-1); H3(h-2,cw4-1); V3(h-2,cw4);
      }
      return {hl:hl3,vl:vl3};
    }
    return rectLoop(w,h,0,0,w,h);
  }

  // 由边集计算格子数字
  function numbersFrom(w,h,loop){
    var nums=[];
    for(var r=0;r<h;r++){nums[r]=[];for(var c=0;c<w;c++){
      var n=0;
      if((loop.hl[r]||{})[c])n++;
      if((loop.hl[r+1]||{})[c])n++;
      if((loop.vl[r]||{})[c])n++;
      if((loop.vl[r]||{})[c+1])n++;
      nums[r][c]=n;
    }}
    return nums;
  }

  function newPuzzle(){
    var w=parseInt($('sizeSel').value,10),h=w;
    var keep=parseFloat($('diffSel').value);
    cur.w=w;cur.h=h;
    var kind=Math.floor(Math.random()*4);
    var loop=loopFrom(w,h,kind);
    cur.solution={hl:loop.hl,vl:loop.vl};
    var nums=numbersFrom(w,h,loop);
    // 随机扣减数字（0 也保留，0 是关键线索；保留 keep 比例的非 0）
    var nonZero=0,total=0;
    for(var r=0;r<h;r++)for(var c=0;c<w;c++){if(nums[r][c]>0)nonZero++;total++;}
    cur.nums=[];
    for(var r2=0;r2<h;r2++){cur.nums[r2]=[];for(var c2=0;c2<w;c2++){
      var v=nums[r2][c2];
      if(v>0&&Math.random()>keep){cur.nums[r2][c2]='';}else{cur.nums[r2][c2]=v;}
    }}
    // 状态：hLine/vLine 玩家
    cur.state={};
    cur.solved=false;cur.time=0;stopTimer();startTimer();
    $('msg').textContent='点线段画线，再点变 ×，三击清除';
    render();
  }

  function render(){
    var w=cur.w,h=cur.h;
    var cw=(w+1)*CELL+2*PAD, ch=(h+1)*CELL+2*PAD;
    cv.width=cw;cv.height=ch;
    ctx.clearRect(0,0,cw,ch);
    ctx.lineWidth=EDGE_W;ctx.lineCap='round';ctx.lineJoin='round';
    function PX(x){return PAD+x*CELL;}
    function PY(y){return PAD+y*CELL;}
    // 画 × 与线（先背景线）
    // 玩家线
    ctx.strokeStyle='#4ad6c1';
    for(var v=0;v<=h;v++){for(var hh=0;hh<w;hh++){if(cur.state['h'+v+'_'+hh]===1){ctx.beginPath();ctx.moveTo(PX(hh),PY(v));ctx.lineTo(PX(hh+1),PY(v));ctx.stroke();}}}
    for(var vv=0;vv<h;vv++){for(var ww=0;ww<=w;ww++){if(cur.state['v'+vv+'_'+ww]===1){ctx.beginPath();ctx.moveTo(PX(ww),PY(vv));ctx.lineTo(PX(ww),PY(vv+1));ctx.stroke();}}}
    // ×
    ctx.strokeStyle='rgba(255,255,255,.35)';ctx.lineWidth=2;
    for(var v3=0;v3<=h;v3++){for(var h3=0;h3<w;h3++){if(cur.state['h'+v3+'_'+h3]===2){var x=PX(h3)+CELL/2,y=PY(v3);ctx.beginPath();ctx.moveTo(x-6,y-6);ctx.lineTo(x+6,y+6);ctx.moveTo(x+6,y-6);ctx.lineTo(x-6,y+6);ctx.stroke();}}}
    for(var v4=0;v4<h;v4++){for(var w4=0;w4<=w;w4++){if(cur.state['v'+v4+'_'+w4]===2){var x2=PX(w4),y2=PY(v4)+CELL/2;ctx.beginPath();ctx.moveTo(x2-6,y2-6);ctx.lineTo(x2+6,y2+6);ctx.moveTo(x2+6,y2-6);ctx.lineTo(x2-6,y2+6);ctx.stroke();}}}
    // 顶点
    ctx.fillStyle='#e9eef7';
    for(var v5=0;v5<=h;v5++){for(var w5=0;w5<=w;w5++){ctx.beginPath();ctx.arc(PX(w5),PY(v5),3.5,0,Math.PI*2);ctx.fill();}}
    // 数字
    ctx.fillStyle='#e8c77a';ctx.font='bold '+FONT+'px sans-serif';ctx.textAlign='center';ctx.textBaseline='middle';
    for(var r=0;r<h;r++){for(var c=0;c<w;c++){
      var vv2=cur.nums[r][c];
      if(vv2==='')continue;
      ctx.fillText(String(vv2),PX(c)+CELL/2,PY(r)+CELL/2);
    }}
    var n=0;Object.keys(cur.state).forEach(function(k){if(cur.state[k]===1)n++;});
    $('cnt').textContent=n;
  }

  function hitTest(e){
    var rect=cv.getBoundingClientRect();
    var scaleX=cv.width/rect.width,scaleY=cv.height/rect.height;
    var mx=(e.clientX-rect.left)*scaleX,my=(e.clientY-rect.top)*scaleY;
    var gx=Math.round((mx-PAD)/CELL),gy=Math.round((my-PAD)/CELL);
    if(gx<0||gy<0||gx>cur.w||gy>cur.h)return null;
    var px=PAD+gx*CELL,py=PAD+gy*CELL;
    // 判断更接近水平边还是垂直边
    var dh=Math.abs(my-py),dv=Math.abs(mx-px);
    if(dh<=dv){
      if(dh>CELL*0.35)return null;
      return {t:'h',v:gy,h:Math.min(gx,cur.w-1)};
    }else{
      if(dv>CELL*0.35)return null;
      return {t:'v',v:Math.min(gy,cur.h-1),h:gx};
    }
  }

  function tap(e){
    if(cur.solved)return;
    var p=hitTest(e);
    if(!p)return;
    var k=p.t+p.v+'_'+p.h;
    var s=cur.state[k]||0;
    cur.state[k]=(s+1)%3;
    render();
  }

  // ===== 完成校验 =====
  function check(){
    var w=cur.w,h=cur.h;
    // 1) 数字约束
    for(var r=0;r<h;r++)for(var c=0;c<w;c++){
      var v=cur.nums[r][c];
      if(v==='')continue;
      var n=0;
      if(cur.state['h'+r+'_'+c]===1)n++;
      if(cur.state['h'+(r+1)+'_'+c]===1)n++;
      if(cur.state['v'+r+'_'+c]===1)n++;
      if(cur.state['v'+r+'_'+(c+1)]===1)n++;
      if(n!==v){$('msg').textContent='数字 '+v+' 周围线段数不对（应为 '+v+'，现有 '+n+'）';return false;}
    }
    // 2) 单回路：所有线段边连通 + 顶点度 0 或 2 + 边数>0
    var edges=[];
    for(var vv=0;vv<=h;vv++)for(var hh=0;hh<w;hh++)if(cur.state['h'+vv+'_'+hh]===1)edges.push(['h',vv,hh]);
    for(var v2=0;v2<h;v2++)for(var w2=0;w2<=w;w2++)if(cur.state['v'+v2+'_'+w2]===1)edges.push(['v',v2,w2]);
    if(edges.length===0){$('msg').textContent='还没有画任何线段';return false;}
    // 顶点度数
    var deg={};
    edges.forEach(function(e){
      if(e[0]==='h'){var v=e[1],x=e[2];deg[v+','+x]=(deg[v+','+x]||0)+1;deg[v+','+(x+1)]=(deg[v+','+(x+1)]||0)+1;}
      else{var vv2=e[1],y=e[2];deg[vv2+','+y]=(deg[vv2+','+y]||0)+1;deg[(vv2+1)+','+y]=(deg[(vv2+1)+','+y]||0)+1;}
    });
    for(var k in deg){if(deg[k]!==2){$('msg').textContent='存在岔路或断头（顶点连接数不是 2），请形成单条闭合回路';return false;}}
    // 连通性（BFS）
    var adj={};
    edges.forEach(function(e){
      var a,b;
      if(e[0]==='h'){a=e[1]+','+e[2];b=e[1]+','+(e[2]+1);}
      else{a=e[1]+','+e[2];b=(e[1]+1)+','+e[2];}
      (adj[a]=adj[a]||[]).push(b);(adj[b]=adj[b]||[]).push(a);
    });
    var start=edges[0][0]==='h'?edges[0][1]+','+edges[0][2]:edges[0][1]+','+edges[0][2];
    var seen={},q=[start];seen[start]=1;
    while(q.length){var cur2=q.pop();(adj[cur2]||[]).forEach(function(nb){if(!seen[nb]){seen[nb]=1;q.push(nb);}});}
    if(Object.keys(seen).length!==Object.keys(deg).length){$('msg').textContent='线段不连通，需连成一条完整回路';return false;}
    // 完成
    cur.solved=true;stopTimer();
    var best={};try{best=JSON.parse(localStorage.getItem(BEST_KEY)||'{}');}catch(e){}
    var dk=cur.w+'-'+$('diffSel').value;
    var isNew=false;
    if(!best[dk]||cur.time<best[dk]){best[dk]=cur.time;isNew=true;try{localStorage.setItem(BEST_KEY,JSON.stringify(best));}catch(e){}}
    var mm=Math.floor(cur.time/60),ss=cur.time%60;
    $('winTitle').textContent='回路闭合！';
    $('winText').innerHTML='用时 <b>'+(mm<10?'0':'')+mm+':'+(ss<10?'0':'')+ss+'</b>'+'<br>'+(isNew?'<b style="color:var(--gold)">新纪录！</b>':'已保存成绩');
    $('winModal').classList.add('show');
    renderBest();
    return true;
  }

  function renderBest(){
    var best={};try{best=JSON.parse(localStorage.getItem(BEST_KEY)||'{}');}catch(e){}
    var v=best[cur.w+'-'+$('diffSel').value];
    $('best').textContent=v!=null?(Math.floor(v/60)+':'+(v%60<10?'0':'')+(v%60)):'—';
  }

  function startTimer(){stopTimer();cur.timer=setInterval(function(){if(!cur.solved){cur.time++;var m=Math.floor(cur.time/60),s=cur.time%60;$('time').textContent=(m<10?'0':'')+m+':'+(s<10?'0':'')+s;}},1000);}
  function stopTimer(){if(cur.timer){clearInterval(cur.timer);cur.timer=null;}}

  cv.addEventListener('click',tap);
  cv.addEventListener('touchstart',function(e){e.preventDefault();var t=e.touches[0];tap({clientX:t.clientX,clientY:t.clientY});},{passive:false});
  $('newBtn').addEventListener('click',newPuzzle);
  $('checkBtn').addEventListener('click',check);
  $('winBtn').addEventListener('click',function(){$('winModal').classList.remove('show');newPuzzle();});
  $('sizeSel').addEventListener('change',newPuzzle);
  $('diffSel').addEventListener('change',newPuzzle);
  newPuzzle();
  renderBest();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>

<script src="sounds.js"></script>
</body>
</html>
