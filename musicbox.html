<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0d08">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f0d08'/%3E%3Ctext x='50' y='69' font-size='56' text-anchor='middle' fill='%23ff6fa5' font-family='serif'%3E%E7%9B%92%3C/text%3E%3C/svg%3E">
<title>八音盒 - 妙搭小站</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#0f0d08;--paper:#16130c;--txt:#e8dcc8;--sub:#9a8868;--gold:#d4a84b;--c:#ff6fa5;}
  html,body{background:var(--bg);}
  body{min-height:100vh;color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:18px 12px 30px;
    background:radial-gradient(ellipse at 15% 0%,color-mix(in srgb,var(--c) 12%,transparent) 0%,transparent 50%),var(--bg);}
  .wrap{width:100%;max-width:680px;}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;text-decoration:none;
    background:rgba(212,168,75,.08);border:1px solid rgba(212,168,75,.3);color:var(--sub);font-size:13px;transition:.2s;}
  .back:hover{color:var(--gold);border-color:var(--gold);}
  .head{text-align:center;margin-bottom:16px;}
  .head h1{font-family:"STKaiti","KaiTi","楷体",serif;font-size:30px;letter-spacing:6px;
    background:linear-gradient(135deg,#ffc0d9,#ff6fa5 45%,#ffd3e4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .head p{color:var(--sub);font-size:12px;letter-spacing:4px;margin-top:6px;}
  .panel{background:var(--paper);border:1px solid color-mix(in srgb,var(--c) 26%,transparent);
    border-radius:14px;padding:16px;margin-bottom:14px;}
  .lab{font-size:12px;color:var(--sub);margin:10px 0 8px;letter-spacing:2px;}
  .seg{display:flex;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:9px;overflow:hidden;}
  .seg button{flex:1;min-width:0;min-height:44px;background:transparent;color:var(--sub);border:none;font-size:14px;cursor:pointer;}
  .seg button.on{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);}
  /* 琴键 */
  .kb{position:relative;height:200px;display:flex;border-radius:10px;overflow:hidden;border:1px solid #2c2416;touch-action:none;}
  .wk{flex:1;min-width:0;background:linear-gradient(#efe6d2,#d9cdb4);border-right:1px solid #b8a98a;
    display:flex;align-items:flex-end;justify-content:center;padding:0 0 8px;cursor:pointer;user-select:none;-webkit-user-select:none;
    appearance:none;-webkit-appearance:none;font-family:inherit;outline:none;}
  .wk b{font-size:11px;color:#6a5a3e;font-weight:normal;}
  .wk.act{background:linear-gradient(#fff6df,var(--c));}
  .bk{position:absolute;top:0;height:58%;width:5.2%;background:linear-gradient(#3a3226,#16130c);
    border:1px solid #000;border-radius:0 0 5px 5px;cursor:pointer;z-index:2;display:flex;align-items:flex-end;justify-content:center;padding:0 0 5px;
    appearance:none;-webkit-appearance:none;font-family:inherit;outline:none;}
  .bk b{font-size:9px;color:#9a8868;font-weight:normal;}
  .bk.act{background:var(--c);}
  .bigbtn{width:100%;min-height:52px;border-radius:12px;border:1px solid var(--c);font-size:16px;letter-spacing:3px;
    background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);cursor:pointer;margin-top:10px;}
  .row2{display:flex;gap:8px;}
  .row2 button{flex:1;min-width:0;min-height:48px;border-radius:10px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
    background:transparent;color:var(--c);font-size:14px;cursor:pointer;}
  .row2 button.rec{border-color:#e8453c;color:#ff8a82;}
  .row2 button.rec.on{background:rgba(232,69,60,.25);}
  .status{font-size:12px;color:var(--sub);text-align:center;margin-top:8px;min-height:18px;}
  .foot{margin-top:20px;color:#6a5a3e;font-size:12px;letter-spacing:2px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="audio-hub.html">← 返回音乐</a>
  </div>
  <div class="head">
    <h1>八音盒</h1>
    <p>MUSIC BOX · 发条盒的清脆钟音</p>
  </div>

  <div class="panel">
    <div class="kb" id="kb"></div>
    <div class="status" id="status">点击琴键弹奏，桌面键盘 A S D F G H J K L ; Z X C V B 可弹</div>
  </div>

  <div class="panel">
    <div class="lab">内置旋律（公共领域）</div>
    <div class="seg" id="melSeg">
      <button data-mel="twinkle" class="on">小星星</button>
      <button data-mel="ode">欢乐颂</button>
      <button data-mel="tiger">两只老虎</button>
    </div>
    <div class="lab">播放速度</div>
    <div class="seg" id="spdSeg">
      <button data-s="0.5">0.5×</button>
      <button data-s="1" class="on">1×</button>
      <button data-s="1.5">1.5×</button>
    </div>
    <button class="bigbtn" id="btnMel">播放旋律</button>
  </div>

  <div class="panel">
    <div class="lab">录制自己的小曲</div>
    <div class="row2">
      <button id="btnRec">开始录制</button>
      <button id="btnPlayRec">回放录制</button>
      <button id="btnClear">清空</button>
    </div>
    <div class="status" id="recStatus">尚未录制（保存在本机）</div>
  </div>

  <div class="foot">妙搭小站 · 音乐听觉 · 听音与律动</div>
</div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  function freq(m){ return 440*Math.pow(2,(m-69)/12); }
  var NAMES=['C','C#','D','D#','E','F','F#','G','G#','A','A#','B'];

  // ===== 琴键布局：C4(60) .. C6(84) =====
  var WHITES=[60,62,64,65,67,69,71,72,74,76,77,79,81,83,84];
  var BLACKS=[61,63,66,68,70,73,75,78,80,82];
  var KEYMAP={'a':60,'s':62,'d':64,'f':65,'g':67,'h':69,'j':71,'k':72,'l':74,';':76,'z':77,'x':79,'c':81,'v':83,'b':84};
  var kb=$('kb'),keyEls={};
  WHITES.forEach(function(m){
    var d=document.createElement('button'); d.type='button'; d.className='wk';
    d.innerHTML='<b>'+NAMES[m%12]+Math.floor(m/12-1)+'</b>';
    d.setAttribute('onclick','MB.play('+m+')');
    kb.appendChild(d); keyEls[m]=d;
  });
  BLACKS.forEach(function(m){
    var before=WHITES.filter(function(w){return w<m;}).length;
    var d=document.createElement('button'); d.type='button'; d.className='bk';
    d.style.left='calc('+(before/WHITES.length*100)+'% - 2.6%)';
    d.innerHTML='<b>'+NAMES[m%12]+'</b>';
    d.setAttribute('onclick','MB.play('+m+')');
    kb.appendChild(d); keyEls[m]=d;
  });
  document.addEventListener('keydown',function(e){
    if(e.repeat) return;
    var k=e.key.toLowerCase();
    if(KEYMAP[k]!=null && !e.ctrlKey && !e.metaKey) pluck(KEYMAP[k]);
  });

  // ===== 八音盒音色：正弦基频 + 轻微二次泛音，快速衰减 =====
  var ctx=null,master=null;
  function ac(){
    if(ctx) return ctx;
    var AC=window.AudioContext||window.webkitAudioContext;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=.8; master.connect(ctx.destination);
    return ctx;
  }
  function pluck(m,delay){
    ac(); if(ctx.state==='suspended') ctx.resume();
    var t0=ctx.currentTime+(delay||0);
    [ [1,.55],[2,.18],[3,.06] ].forEach(function(p){
      var o=ctx.createOscillator(),g=ctx.createGain();
      o.type='sine'; o.frequency.value=freq(m*p[0]);
      g.gain.setValueAtTime(0.0001,t0);
      g.gain.exponentialRampToValueAtTime(p[1],t0+.015);
      g.gain.exponentialRampToValueAtTime(0.0001,t0+1.4);
      o.connect(g); g.connect(master);
      o.start(t0); o.stop(t0+1.5);
    });
    flashKey(m,delay);
    recordTick(m);
  }
  function flashKey(m,delay){
    var el=keyEls[m]; if(!el) return;
    setTimeout(function(){
      el.classList.add('act');
      setTimeout(function(){ el.classList.remove('act'); },420);
    },(delay||0)*1000);
  }
  window.MB={play:pluck};

  // ===== 内置旋律 =====
  var MELS={
    twinkle:[[0,1],[0,1],[7,1],[7,1],[9,1],[9,1],[7,2],[5,1],[5,1],[4,1],[4,1],[2,1],[2,1],[0,2]],
    ode:[[4,1],[4,1],[5,1],[7,1],[7,1],[5,1],[4,1],[2,1],[0,1],[0,1],[2,1],[4,1],[4,1.5],[2,.5],[2,2]],
    tiger:[[0,1],[2,1],[4,1],[0,1],[0,1],[2,1],[4,1],[0,1],[4,1],[5,1],[7,2],[4,1],[5,1],[7,2]]
  };
  var mel='twinkle',speed=1;
  $('melSeg').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    $('melSeg').querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); mel=b.dataset.mel;
  });
  $('spdSeg').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    $('spdSeg').querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); speed=parseFloat(b.dataset.s);
  });
  $('btnMel').onclick=function(){
    ac(); if(ctx.state==='suspended') ctx.resume();
    var t=0.1,beat=.5/speed;
    MELS[mel].forEach(function(n){
      pluck(60+n[0],t);
      t+=beat*n[1];
    });
  };

  // ===== 录制 / 回放 =====
  var rec=[],recording=false,recStart=0;
  try{ var r=JSON.parse(localStorage.getItem('miaodaMusicBox')||'{}'); if(r.rec) rec=r.rec; }catch(e){}
  function refreshRec(){
    $('recStatus').textContent=rec.length?('已录制 '+rec.length+' 个音符，保存在本机'):'尚未录制（保存在本机）';
  }
  refreshRec();
  function recordTick(m){
    if(!recording) return;
    rec.push({m:m,t:Math.round(performance.now()-recStart)});
    if(rec.length>200){ rec.shift(); }
  }
  $('btnRec').onclick=function(){
    ac(); if(ctx.state==='suspended') ctx.resume();
    if(!recording){
      rec=[]; recording=true; recStart=performance.now();
      this.textContent='停止录制'; this.classList.add('on');
      $('recStatus').textContent='录制中……弹奏吧';
    }else{
      recording=false;
      this.textContent='开始录制'; this.classList.remove('on');
      try{ localStorage.setItem('miaodaMusicBox',JSON.stringify({rec:rec})); }catch(e){}
      refreshRec();
    }
  };
  $('btnPlayRec').onclick=function(){
    if(!rec.length){ $('recStatus').textContent='没有可回放的内容'; return; }
    ac(); if(ctx.state==='suspended') ctx.resume();
    var base=ctx.currentTime+0.1;
    rec.forEach(function(e){
      pluck(e.m,(e.t/1000));
    });
  };
  $('btnClear').onclick=function(){
    rec=[]; try{ localStorage.removeItem('miaodaMusicBox'); }catch(e){}
    refreshRec();
  };
})();
</script>
<script>
// 源码保护
(function(){
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    var key = e.key.toLowerCase();
    if (key === 'f12') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 'u') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 's') { e.preventDefault(); return; }
  });
  document.addEventListener('selectstart', function(e){
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>

<script src="sounds.js"></script>
</body>
</html>
