<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0d08">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>四级词库 · 妙搭小站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#0f0d08; --txt:#e8dcc8; --sub:#9a8868; --gold:#d4a84b; --c:#b98cff; }
  html,body{background:var(--bg);}
  body{min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt);
    display:flex;flex-direction:column;align-items:center;padding:26px 14px 34px;
    background:radial-gradient(ellipse at 12% 0%,rgba(185,140,255,.13) 0%,transparent 52%),
      radial-gradient(ellipse at 88% 6%,rgba(212,168,75,.09) 0%,transparent 50%),var(--bg);}
  .top{width:100%;max-width:680px;display:flex;justify-content:flex-start;margin-bottom:14px;}
  .back{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;text-decoration:none;
    background:rgba(212,168,75,.08);border:1px solid rgba(212,168,75,.3);color:var(--sub);font-size:13.5px;transition:.2s;min-height:44px;}
  .back:hover{color:var(--gold);border-color:var(--gold);}
  .head{text-align:center;margin:4px 0 6px;}
  .head h1{font-family:"STKaiti","KaiTi","楷体",serif;font-size:34px;letter-spacing:8px;
    background:linear-gradient(135deg,#cfb0ff,#b98cff 50%,#e6d6ff);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .head p{color:var(--sub);font-size:12.5px;letter-spacing:3px;margin-top:6px;}
  .stats{width:100%;max-width:680px;display:flex;justify-content:space-between;flex-wrap:wrap;gap:8px;
    margin-bottom:14px;padding:12px 16px;border-radius:12px;background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.09);color:var(--sub);font-size:13px;}
  .stats b{color:var(--c);font-size:16px;}
  .panel{width:100%;max-width:680px;padding:18px;border-radius:14px;background:rgba(255,255,255,.03);
    border:1px solid rgba(255,255,255,.09);margin-bottom:14px;}
  .panel h3{font-size:15px;color:var(--c);letter-spacing:2px;margin-bottom:12px;font-family:"STKaiti","KaiTi",serif;}
  .chips{display:flex;flex-wrap:wrap;gap:10px;}
  .chip{padding:11px 14px;border-radius:9px;background:#1b1810;border:1px solid #33291a;color:var(--sub);
    font-size:13.5px;cursor:pointer;min-height:44px;transition:.2s;line-height:1.3;}
  .chip.on{background:color-mix(in srgb,var(--c) 20%,transparent);border-color:var(--c);color:var(--c);font-weight:600;}
  .chip.dis{opacity:.35;cursor:not-allowed;}
  .btn{padding:12px 26px;border-radius:10px;font-size:15px;letter-spacing:3px;cursor:pointer;transition:.2s;min-height:48px;
    background:color-mix(in srgb,var(--c) 18%,transparent);border:1px solid var(--c);color:var(--c);font-weight:600;}
  .btn:hover{transform:translateY(-2px);}
  .btn.ghost{background:transparent;border:1px solid #33291a;color:var(--sub);font-weight:400;}
  .btn.big{width:100%;margin-top:14px;}
  .quiz{width:100%;max-width:680px;display:none;flex-direction:column;}
  .quiz.on{display:flex;}
  .qtop{display:flex;justify-content:space-between;color:var(--sub);font-size:13px;margin-bottom:10px;}
  .qcard{border-radius:18px;padding:30px 20px;text-align:center;min-height:180px;
    background:linear-gradient(160deg,#221a30,#181222);border:1px solid color-mix(in srgb,var(--c) 45%,transparent);
    display:flex;flex-direction:column;justify-content:center;}
  .qcard .prompt{font-size:34px;font-weight:bold;letter-spacing:2px;color:var(--txt);word-break:break-word;}
  .qcard .hint{color:var(--sub);font-size:14px;margin-top:10px;}
  .opts{display:grid;grid-template-columns:1fr;gap:10px;margin-top:14px;}
  .opt{min-height:56px;padding:12px 16px;border-radius:11px;background:#1b1526;border:1px solid #3a2f4d;
    color:var(--txt);font-size:16px;cursor:pointer;text-align:left;transition:.15s;line-height:1.4;}
  .opt:hover{border-color:var(--c);}
  .opt.right{background:rgba(70,211,154,.18);border-color:#46d39a;color:#7ae0b8;}
  .opt.wrong{background:rgba(232,69,60,.18);border-color:#e8453c;color:#ff9c95;}
  .opt:disabled{cursor:default;}
  .spellrow{display:flex;gap:10px;margin-top:14px;}
  .spellrow input{flex:1;min-width:0;padding:14px;border-radius:11px;background:#16130c;border:1px solid #3a2f4d;
    color:var(--txt);font-size:18px;outline:none;min-height:56px;letter-spacing:1px;}
  .spellrow input:focus{border-color:var(--c);}
  .fb{margin-top:14px;min-height:54px;border-radius:11px;padding:12px 16px;font-size:14.5px;line-height:1.7;display:none;}
  .fb.on{display:block;}
  .fb.ok{background:rgba(70,211,154,.12);border:1px solid #2f6b52;color:#7ae0b8;}
  .fb.bad{background:rgba(232,69,60,.12);border:1px solid #7a2f2a;color:#ff9c95;}
  .nxt{margin-top:12px;display:none;}
  .nxt.on{display:block;}
  .result{width:100%;max-width:680px;display:none;padding:26px 20px;border-radius:16px;text-align:center;
    background:linear-gradient(160deg,color-mix(in srgb,var(--c) 12%,#14110b),#14110b 75%);
    border:1px solid color-mix(in srgb,var(--c) 45%,transparent);}
  .result.on{display:block;}
  .result h2{font-family:"STKaiti","KaiTi",serif;font-size:30px;color:var(--c);letter-spacing:4px;margin-bottom:14px;}
  .result .grid{display:grid;grid-template-columns:repeat(3,1fr);gap:12px;margin:16px 0;}
  .result .cell{background:rgba(0,0,0,.25);border-radius:10px;padding:12px 6px;}
  .result .cell b{display:block;font-size:22px;color:var(--gold);}
  .result .cell span{font-size:12px;color:var(--sub);}
  .rule{margin-top:14px;font-size:12.5px;line-height:2;color:var(--sub);}
  .rule b{color:var(--c);}
  .foot{margin-top:24px;color:#6a5a3e;font-size:12px;letter-spacing:2px;text-align:center;}
  @media (max-width:520px){.head h1{font-size:27px;letter-spacing:5px;}.qcard .prompt{font-size:26px;}}
</style>
</head>
<body>
  <div class="top"><a class="back" href="learn-hub.html">← 返回学习</a></div>
  <div class="head">
    <h1>四级词库</h1>
    <p>CET-4 WORDS · 核心词刷题</p>
  </div>

  <div class="stats">
    <span>总词 <b id="sTotal">0</b></span>
    <span>已刷 <b id="sSeen">0</b></span>
    <span>累计正确率 <b id="sAcc">0%</b></span>
    <span>错词本 <b id="sWrong">0</b></span>
  </div>

  <!-- ===== 设置 ===== -->
  <div class="panel" id="setup">
    <h3>刷题模式</h3>
    <div class="chips" id="modeChips">
      <button class="chip on" data-m="e2z">英译中</button>
      <button class="chip" data-m="z2e">中译英</button>
      <button class="chip" data-m="spell">拼写</button>
      <button class="chip" id="wrongChip">只刷错词（<span id="wrongN">0</span>）</button>
    </div>
    <h3 style="margin-top:16px;">每题组数</h3>
    <div class="chips" id="sizeChips">
      <button class="chip" data-s="5">5 题</button>
      <button class="chip on" data-s="10">10 题</button>
      <button class="chip" data-s="20">20 题</button>
    </div>
    <button class="btn big" id="startBtn">开始刷题 →</button>
    <div class="rule">
      <b>规则：</b>英译中 / 中译英为四选一；拼写模式看中文与词性手输英文，首字母大小写不判定错误。答错的词自动收进错词本并持久保存，答对则移出；「只刷错词」仅从错词本抽题。学习进度（已刷词数、累计正确率）保存在本机。
    </div>
  </div>

  <!-- ===== 刷题 ===== -->
  <div class="quiz" id="quiz">
    <div class="qtop"><span id="qProg">1/10</span><span id="qMode">英译中</span></div>
    <div class="qcard">
      <div class="prompt" id="qPrompt">—</div>
      <div class="hint" id="qHint"></div>
    </div>
    <div class="opts" id="opts"></div>
    <div class="spellrow" id="spellRow" style="display:none;">
      <input id="spellInput" autocomplete="off" autocapitalize="off" spellcheck="false" placeholder="输入英文单词…">
      <button class="btn" id="spellBtn">提交</button>
    </div>
    <div class="fb" id="fb"></div>
    <button class="btn nxt" id="nxtBtn">下一题 →</button>
  </div>

  <!-- ===== 结算 ===== -->
  <div class="result" id="result">
    <h2>本组完成</h2>
    <div class="grid">
      <div class="cell"><b id="rAcc">0%</b><span>正确率</span></div>
      <div class="cell"><b id="rOk">0</b><span>答对</span></div>
      <div class="cell"><b id="rTotal">0</b><span>题数</span></div>
    </div>
    <div style="color:var(--sub);font-size:13px;margin-bottom:16px;" id="rMsg"></div>
    <button class="btn" id="againBtn">再来一组</button>
    <button class="btn ghost" id="backBtn" style="margin-left:10px;">返回设置</button>
  </div>

  <div class="foot">妙搭小站 · 学习 · 四级核心词刷题</div>

  function loadJSON(k,d){try{var v=JSON.parse(localStorage.getItem(k));return v||d;}catch(e){return d;}}
  function saveJSON(k,v){try{localStorage.setItem(k,JSON.stringify(v));}catch(e){}}
  function $(id){return document.getElementById(id);}
  function rnd(n){return Math.floor(Math.random()*n);}
  function shuffle(a){for(var i=a.length-1;i>0;i--){var j=rnd(i+1);var t=a[i];a[i]=a[j];a[j]=t;}return a;}

  function wordObj(w){
    for(var i=0;i<WORDS.length;i++)if(WORDS[i][0]===w)return {w:WORDS[i][0],pos:WORDS[i][1],mean:WORDS[i][2]};
    return null;
  }

  // ===== 进度展示 =====
  function renderStats(){
    var seenN=Object.keys(prog.seen).length;
    $('sTotal').textContent=WORDS.length;
    $('sSeen').textContent=seenN;
    $('sAcc').textContent=prog.n?Math.round(prog.ok/prog.n*100)+'%':'0%';
    $('sWrong').textContent=wrongBook.length;
    $('wrongN').textContent=wrongBook.length;
    $('wrongChip').classList.toggle('dis',wrongBook.length===0);
  }

  // ===== 开始 =====
  function start(){
    var pool;
    if(state.onlyWrong){
      pool=wrongBook.map(wordObj).filter(Boolean);
      if(!pool.length){alert('错词本是空的');return;}
    }else{
      pool=WORDS.map(function(w){return {w:w[0],pos:w[1],mean:w[2]};});
    }
    shuffle(pool);
    state.deck=pool.slice(0,Math.min(state.size,pool.length));
    state.idx=0;state.ok=0;state.total=state.deck.length;
    $('setup').style.display='none';
    $('result').classList.remove('on');
    $('quiz').classList.add('on');
    $('qMode').textContent=state.onlyWrong?'错词复习':({e2z:'英译中',z2e:'中译英',spell:'拼写'}[state.mode]);
    if(window.SFX)SFX.start();
    showQ();
  }

  function distractors(list,correct,n,field){
    var seen={};seen[correct]=1;var out=[];
    var guard=0;
    while(out.length<n&&guard++<500){
      var c=list[rnd(list.length)];var key=c[field];
      if(!seen[key]){seen[key]=1;out.push(c);}
    }
    return out;
  }

  function showQ(){
    state.answered=false;
    var item=state.deck[state.idx];
    state.cur=item;
    $('qProg').textContent=(state.idx+1)+'/'+state.total;
    $('fb').classList.remove('on','ok','bad');
    $('nxtBtn').classList.remove('on');
    var isSpell=state.mode==='spell';
    $('spellRow').style.display=isSpell?'flex':'none';
    $('opts').innerHTML='';
    if(isSpell){
      $('qPrompt').textContent=item.mean;
      $('qHint').textContent='拼写：'+item.pos;
      var si=$('spellInput');si.value='';si.focus();
    }else if(state.mode==='e2z'){
      $('qPrompt').textContent=item.w;
      $('qHint').textContent=item.pos;
      var opts=[item];
      var d=distractors(WORDS,item.w,8,0).filter(function(w){return w[1]+' '+w[2]!==item.pos+' '+item.mean;});
      for(var di=0;di<3&&di<d.length;di++){opts.push({w:d[di][0],pos:d[di][1],mean:d[di][2]});}
      shuffle(opts);
      opts.forEach(function(o){
        var b=document.createElement('button');
        b.className='opt';b.textContent=o.pos+' '+o.mean;
        b.onclick=function(){judge(b,o.mean===item.mean&&o.w===item.w);};
        $('opts').appendChild(b);
      });
    }else{ // z2e
      $('qPrompt').textContent=item.mean;
      $('qHint').textContent=item.pos;
      var opts2=[item];
      distractors(WORDS,item.mean,3,2).forEach(function(w){opts2.push({w:w[0],pos:w[1],mean:w[2]});});
      shuffle(opts2);
      opts2.forEach(function(o){
        var b=document.createElement('button');
        b.className='opt';b.textContent=o.w;
        b.onclick=function(){judge(b,o.w===item.w);};
        $('opts').appendChild(b);
      });
    }
  }

  function addWrong(w){
    if(wrongBook.indexOf(w)<0){wrongBook.push(w);saveJSON(WKEY,wrongBook);}
  }
  function removeWrong(w){
    var i=wrongBook.indexOf(w);if(i>=0){wrongBook.splice(i,1);saveJSON(WKEY,wrongBook);}
  }

  function judge(btn,right){
    if(state.answered)return;
    state.answered=true;
    var item=state.cur;
    prog.n++;prog.seen[item.w]=1;
    if(right){
      state.ok++;prog.ok++;
      removeWrong(item.w);
      if(btn)btn.classList.add('right');
      if(window.SFX)SFX.pop();
      showFb(true,item);
    }else{
      addWrong(item.w);
      if(btn)btn.classList.add('wrong');
      if(window.SFX)SFX.error();
      // 标出正确答案
      Array.prototype.forEach.call($('opts').children,function(b){
        if(b.textContent.indexOf(item.mean)>=0&&state.mode==='e2z')b.classList.add('right');
        if(b.textContent===item.w&&state.mode==='z2e')b.classList.add('right');
      });
      showFb(false,item);
    }
    Array.prototype.forEach.call($('opts').children,function(b){b.disabled=true;});
    saveJSON(PKEY,prog);renderStats();
    $('nxtBtn').classList.add('on');
  }

  function showFb(right,item){
    var f=$('fb');
    f.classList.add('on',right?'ok':'bad');
    f.classList.remove(right?'bad':'ok');
    f.textContent=(right?'回答正确 ｜ ':'正确答案：')+item.w+'  '+(item.pos||'')+'  '+item.mean;
  }

  function submitSpell(){
    if(state.answered)return;
    var v=$('spellInput').value.trim().toLowerCase();
    if(!v)return;
    judge(null,v===state.cur.w.toLowerCase());
  }
  $('spellBtn').addEventListener('click',submitSpell);
  $('spellInput').addEventListener('keydown',function(e){if(e.key==='Enter')submitSpell();});

  $('nxtBtn').addEventListener('click',function(){
    state.idx++;
    if(state.idx>=state.total){settle();}else{showQ();}
  });

  function settle(){
    $('quiz').classList.remove('on');
    var acc=state.total?Math.round(state.ok/state.total*100):0;
    $('rAcc').textContent=acc+'%';
    $('rOk').textContent=state.ok;
    $('rTotal').textContent=state.total;
    $('rMsg').textContent=acc>=80?'状态出色，继续保持！':acc>=60?'错词已收入复习本，记得常回来刷。':'错题已进复习本，先去错词本巩固一下。';
    $('result').classList.add('on');
    if(window.SFX){acc>=80?SFX.win():SFX.lose();}
  }

  $('againBtn').addEventListener('click',start);
  $('backBtn').addEventListener('click',function(){
    $('result').classList.remove('on');
    $('setup').style.display='block';
  });
  $('startBtn').addEventListener('click',start);

  $('modeChips').addEventListener('click',function(e){
    var b=e.target.closest('.chip');if(!b)return;
    if(b.id==='wrongChip'){
      if(wrongBook.length===0)return;
      state.onlyWrong=true;
      this.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});
      b.classList.add('on');
      return;
    }
    state.onlyWrong=false;
    this.querySelectorAll('.chip').forEach(function(c){if(c.id!=='wrongChip')c.classList.remove('on');});
    b.classList.add('on');
    state.mode=b.dataset.m;
  });
  $('sizeChips').addEventListener('click',function(e){
    var b=e.target.closest('.chip');if(!b)return;
    this.querySelectorAll('.chip').forEach(function(c){c.classList.remove('on');});
    b.classList.add('on');
    state.size=parseInt(b.dataset.s,10);
  });

  renderStats();
})();
</script>
<script>
// 源码保护
(function(){
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    var key = e.key.toLowerCase();
    if (key === 'f12') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 'u') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 's') { e.preventDefault(); return; }
  });
  document.addEventListener('selectstart', function(e){
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
