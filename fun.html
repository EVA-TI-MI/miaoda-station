<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="refresh" content="3;url=index.html">
<meta name="theme-color" content="#111520">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>页面升级 · 妙搭小站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#111520; --txt:#e9eef7; --sub:#8b97b0; --gold:#e8c77a; }
  html,body{background:var(--bg);}
  body{min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt);
    display:flex;flex-direction:column;align-items:center;justify-content:center;padding:40px 20px;text-align:center;
    background:
      radial-gradient(ellipse at 12% 0%,rgba(232,69,60,.12) 0%,transparent 50%),
      radial-gradient(ellipse at 88% 4%,rgba(91,155,245,.12) 0%,transparent 50%),
      radial-gradient(ellipse at 50% 100%,rgba(67,184,100,.10) 0%,transparent 52%),var(--bg);}
  h1{font-family:"STKaiti","KaiTi","楷体",serif;font-size:34px;letter-spacing:6px;margin-bottom:18px;
    background:linear-gradient(135deg,#e8c77a,#f2c537 50%,#fff0c0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  p{color:var(--sub);font-size:14.5px;letter-spacing:2px;line-height:2;}
  .go{display:inline-block;margin-top:28px;padding:12px 30px;border-radius:8px;font-size:15px;letter-spacing:3px;
    color:var(--gold);text-decoration:none;border:1px solid var(--gold);background:rgba(232,199,122,.1);transition:.2s;}
  .go:hover{background:var(--gold);color:#111520;}
  .foot{position:fixed;bottom:18px;left:0;right:0;color:#566079;font-size:12px;letter-spacing:2px;text-align:center;}
  @media (max-width:480px){ h1{font-size:26px;letter-spacing:4px;} }
</style>
</head>
<body>
  <h1>妙搭小站已升级</h1>
  <p>游戏已迁入首页八大板块，内容更多、分类更清晰。<br>3 秒后自动跳转，如未跳转请点击下方按钮。</p>
  <a class="go" href="index.html">点此进入首页 →</a>
  <div class="foot">妙搭小站</div>

<script>
setTimeout(function(){ location.replace('index.html'); }, 3000);
</script>
<script>
(function(){
  document.addEventListener('contextmenu',function(e){e.preventDefault();});
  document.addEventListener('dragstart',function(e){e.preventDefault();});
  document.addEventListener('keydown',function(e){
    var key=e.key.toLowerCase();
    if(key==='f12'){e.preventDefault();return;}
    if((e.ctrlKey||e.metaKey)&&e.shiftKey&&(key==='i'||key==='j'||key==='c')){e.preventDefault();return;}
    if((e.ctrlKey||e.metaKey)&&key==='u'){e.preventDefault();return;}
    if((e.ctrlKey||e.metaKey)&&key==='s'){e.preventDefault();return;}
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>

<script src="sounds.js"></script>
</body>
</html>
