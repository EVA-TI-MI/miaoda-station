name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --noconfirm --name "MiaodaStation" `
            --add-data "snake.html;." --add-data "biquge.html;." `
            --add-data "index.html;." --add-data "sw.js;." `
            --add-data "manifest.json;." --add-data "icon-192.png;." `
            --add-data "icon-512.png;." snake_launcher.py

      - name: Delete old release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Checking for existing assets on release ${{ github.ref_name }}"
          gh release view ${{ github.ref_name }} --json assets --jq '.assets[].name' | while read asset; do
            echo "Deleting asset: $asset"
            gh release delete-asset ${{ github.ref_name }} "$asset" --yes || true
          done

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/MiaodaStation.exe

  set-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Set repository topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          echo "Setting repository topics..."
          RESPONSE=$(curl -s --fail -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/topics \
            -d '{"names":["snake-game","novel-reader","html5-game","pywebview","pwa","canvas-game","chinese-novel","desktop-app"]}')
          echo "Response: $RESPONSE"
