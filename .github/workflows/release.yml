name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --noconfirm --name "MiaodaStation" `
            --add-data "snake.html;." --add-data "biquge.html;." `
            --add-data "index.html;." --add-data "sw.js;." `
            --add-data "manifest.json;." --add-data "icon-192.png;." `
            --add-data "icon-512.png;." snake_launcher.py

      - name: Delete old release assets
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # 新 tag 首次发布时 Release 尚不存在，gh release view 会非零退出；
          # Actions 的 bash 默认 set -eo pipefail，旧写法的管道会让整个步骤失败并跳过上传。
          # 容错取资产列表：没有 Release/资产就安全跳过，有旧资产才逐个删除（重跑同 tag 时清理旧 exe）。
          assets=$(gh release view ${{ github.ref_name }} --json assets --jq '.assets[].name' 2>/dev/null || true)
          if [ -n "$assets" ]; then
            while IFS= read -r asset; do
              [ -z "$asset" ] && continue
              echo "Deleting asset: $asset"
              gh release delete-asset ${{ github.ref_name }} "$asset" --yes || true
            done <<< "$assets"
          else
            echo "No existing release/assets yet for ${{ github.ref_name }}; skip deletion."
          fi

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/MiaodaStation.exe

  set-topics:
    runs-on: ubuntu-latest
    continue-on-error: true
    steps:
      - name: Set repository topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh repo edit ${{ github.repository }} --add-topic snake-game --add-topic novel-reader \
            --add-topic html5-game --add-topic pywebview --add-topic pwa \
            --add-topic canvas-game --add-topic chinese-novel --add-topic desktop-app || true
