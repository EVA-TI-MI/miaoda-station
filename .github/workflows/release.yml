name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --noconfirm --name "MiaodaStation" `
            --add-data "snake.html;." --add-data "biquge.html;." `
            --add-data "index.html;." --add-data "sw.js;." `
            --add-data "manifest.json;." --add-data "icon-192.png;." `
            --add-data "icon-512.png;." snake_launcher.py

      - name: Delete old release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $headers = @{ Authorization = "Bearer $env:GH_TOKEN"; Accept = "application/vnd.github+json" }
          $repo = "${{ github.repository }}"
          $tag = "${{ github.ref_name }}"
          try {
            $release = Invoke-RestMethod -Uri "https://api.github.com/repos/$repo/releases/tags/$tag" -Headers $headers
            foreach ($asset in $release.assets) {
              Write-Host "Deleting asset: $($asset.name)"
              Invoke-RestMethod -Method Delete -Uri $asset.url -Headers $headers
            }
          } catch {
            Write-Host "No existing release or assets to delete"
          }

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/MiaodaStation.exe

  set-topics:
    runs-on: ubuntu-latest
    steps:
      - name: Set repository topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          curl -s -X PUT \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            https://api.github.com/repos/${{ github.repository }}/topics \
            -d '{"names":["snake-game","novel-reader","html5-game","pywebview","pwa","canvas-game","chinese-novel","desktop-app"]}'
