name: Release

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install pywebview pyinstaller
          pip install -r requirements.txt

      - name: Build EXE
        run: |
          pyinstaller --onefile --windowed --noconfirm --name "MiaodaStation" `
            --add-data "snake.html;." --add-data "biquge.html;." `
            --add-data "index.html;." --add-data "sw.js;." `
            --add-data "manifest.json;." --add-data "icon-192.png;." `
            --add-data "icon-512.png;." snake_launcher.py

      - name: Delete old release assets
        shell: pwsh
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          $release = gh release view ${{ github.ref_name }} --json id -q .id
          if ($release) {
            gh release delete-asset ${{ github.ref_name }} default.exe -y --skip-questions 2>$null
            Write-Host "Cleaned old assets"
          }

      - name: Upload EXE to Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          draft: false
          prerelease: false
          files: |
            dist/MiaodaStation.exe

  set-topics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Set repository topics
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh api -X PUT repos/${{ github.repository }}/topics \
            -f names[]=snake-game \
            -f names[]=novel-reader \
            -f names[]=html5-game \
            -f names[]=pywebview \
            -f names[]=pwa \
            -f names[]=electron-alternative \
            -f names[]=canvas-game \
            -f names[]=chinese-novel
