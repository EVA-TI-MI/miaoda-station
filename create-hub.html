<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0d08">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>养成创作 - 妙搭小站</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  :root{ --bg:#0f0d08; --txt:#e8dcc8; --sub:#9a8868; --gold:#d4a84b; --c:#ff6fa5; }
  html,body{background:var(--bg);}
  body { min-height:100vh; font-family:"PingFang SC","Microsoft YaHei",sans-serif; color:var(--txt);
    display:flex; flex-direction:column; align-items:center; padding:30px 20px 40px;
    background: radial-gradient(ellipse at 18% 0%, rgba(255,111,165,.10) 0%, transparent 52%),
      radial-gradient(ellipse at 85% 8%, rgba(70,195,154,.08) 0%, transparent 48%),
      radial-gradient(ellipse at 80% 100%, rgba(212,168,75,.07) 0%, transparent 50%), var(--bg); }
  .top{width:100%;max-width:1180px;display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;text-decoration:none;
    background:rgba(212,168,75,.08);border:1px solid rgba(212,168,75,.3);color:var(--sub);font-size:13px;transition:.2s;}
  .back:hover{color:var(--gold);border-color:var(--gold);}
  .head{text-align:center;margin-bottom:6px;}
  .head h1{font-family:"STKaiti","KaiTi","楷体",serif;font-size:36px;letter-spacing:8px;
    background:linear-gradient(135deg,#ff9ec3,#ff6fa5 45%,#ffc0d8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .head p{color:var(--sub);font-size:13px;letter-spacing:5px;margin-top:8px;}
  .cards{display:grid;grid-template-columns:1fr;gap:20px;width:100%;max-width:1180px;margin-top:22px;}
  .app-card{ --c:#ff6fa5; border-radius:14px; position:relative; overflow:hidden; text-decoration:none;
    border:1px solid color-mix(in srgb,var(--c) 26%,transparent);
    background:linear-gradient(160deg,color-mix(in srgb,var(--c) 9%,#14110b) 0%,#14110b 72%);
    display:flex; flex-direction:column; transition:transform .25s,box-shadow .25s,border-color .25s; min-height:250px;}
  .app-card:hover{transform:translateY(-4px);box-shadow:0 14px 40px color-mix(in srgb,var(--c) 24%,transparent);border-color:var(--c);}
  .app-card::before{content:"";position:absolute;top:-24%;right:-24%;width:220px;height:220px;border-radius:50%;
    background:radial-gradient(circle,color-mix(in srgb,var(--c) 26%,transparent) 0%,transparent 70%);opacity:.5;pointer-events:none;}
  .cc{position:relative;z-index:1;padding:22px 22px 20px;display:flex;flex-direction:column;flex:1;min-width:0;}
  .ci{width:54px;height:54px;border-radius:13px;display:flex;align-items:center;justify-content:center;font-size:26px;color:var(--c);
    background:color-mix(in srgb,var(--c) 14%,transparent);border:2px solid color-mix(in srgb,var(--c) 40%,transparent);margin-bottom:14px;}
  .ct{font-size:21px;font-weight:bold;color:var(--c);font-family:"STKaiti","KaiTi",serif;letter-spacing:2px;}
  .ce{font-size:10.5px;letter-spacing:1.5px;color:var(--sub);margin-top:3px;text-transform:uppercase;}
  .cd{font-size:12.5px;line-height:1.8;color:rgba(255,255,255,.6);margin-top:9px;flex:1;}
  .cb{margin-top:12px;padding:8px 16px;border-radius:7px;font-size:13px;letter-spacing:2px;align-self:flex-start;
    color:var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);border:1px solid var(--c);transition:.2s;}
  .app-card:hover .cb{background:var(--c);color:#14110b;}
  .foot{margin-top:30px;color:#6a5a3e;font-size:12px;letter-spacing:2px;text-align:center;}
  @media (min-width:768px){
    .cards{grid-template-columns:repeat(2,1fr);}
  }
  @media (max-width:520px){
    body{padding:20px 12px 30px;}
    .head h1{font-size:28px;letter-spacing:5px;}
  }
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="index.html">← 返回首页</a>
  </div>
  <div class="head">
    <h1>养成创作</h1>
    <p>CREATE · 像素与伙伴</p>
  </div>
  <div class="cards">

    <a href="pixelart.html" class="app-card" style="--c:#ff6fa5">
      <div class="cc">
        <div class="ci">绘</div>
        <div class="ct">像素画</div>
        <div class="ce">Pixel Art · 像素画板</div>
        <div class="cd">自由像素作画：多档画布尺寸与调色板，铅笔橡皮填充取色，撤销重做，导出 PNG，多槽位本地存档。</div>
        <div class="cb">开画 →</div>
      </div>
    </a>

    <a href="pet.html" class="app-card" style="--c:#46c39a">
      <div class="cc">
        <div class="ci">宠</div>
        <div class="ct">宠物养成</div>
        <div class="ce">Pet Care · 像素伙伴</div>
        <div class="cd">领养一只像素小宠物：喂食玩耍清洁休息，四项属性实时变化，阶段进化与每日打卡，陪你一起成长。</div>
        <div class="cb">领养一只 →</div>
      </div>
    </a>

  </div>
  <div class="foot">妙搭小站 · 养成创作 · 像素与伙伴</div>
<script>
// 源码保护
(function(){
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    var key = e.key.toLowerCase();
    if (key === 'f12') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 'u') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 's') { e.preventDefault(); return; }
  });
  document.addEventListener('selectstart', function(e){
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>

<script src="sounds.js"></script>
</body>
</html>
