<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0d08">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f0d08'/%3E%3Ctext x='50' y='69' font-size='56' text-anchor='middle' fill='%23d4a84b' font-family='serif'%3E%E6%8B%8D%3C/text%3E%3C/svg%3E">
<title>节拍器 - 妙搭小站</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#0f0d08;--paper:#16130c;--txt:#e8dcc8;--sub:#9a8868;--gold:#d4a84b;--c:#d4a84b;}
  html,body{background:var(--bg);}
  body{min-height:100vh;color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:18px 12px 30px;
    background:radial-gradient(ellipse at 15% 0%,color-mix(in srgb,var(--c) 12%,transparent) 0%,transparent 50%),var(--bg);}
  .wrap{width:100%;max-width:680px;}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;text-decoration:none;
    background:rgba(212,168,75,.08);border:1px solid rgba(212,168,75,.3);color:var(--sub);font-size:13px;transition:.2s;}
  .back:hover{color:var(--gold);border-color:var(--gold);}
  .head{text-align:center;margin-bottom:16px;}
  .head h1{font-family:"STKaiti","KaiTi","楷体",serif;font-size:30px;letter-spacing:6px;color:var(--gold);}
  .head p{color:var(--sub);font-size:12px;letter-spacing:4px;margin-top:6px;}
  .panel{background:var(--paper);border:1px solid color-mix(in srgb,var(--c) 26%,transparent);
    border-radius:14px;padding:18px;margin-bottom:14px;}
  .bpmbig{text-align:center;font-size:64px;font-weight:bold;color:var(--c);font-variant-numeric:tabular-nums;
    font-family:"STKaiti","KaiTi",serif;letter-spacing:2px;}
  .bpmlab{text-align:center;font-size:12px;color:var(--sub);letter-spacing:3px;margin-bottom:14px;}
  input[type=range]{width:100%;height:44px;accent-color:var(--c);}
  .bpmrow{display:flex;gap:8px;align-items:center;margin-top:6px;}
  .bpmrow input[type=number]{flex:1;min-width:0;height:44px;text-align:center;font-size:16px;border-radius:9px;
    border:1px solid color-mix(in srgb,var(--c) 40%,transparent);background:rgba(255,255,255,.04);color:var(--txt);}
  .step{width:52px;height:44px;border-radius:9px;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);
    background:transparent;color:var(--c);font-size:20px;cursor:pointer;}
  .lab{font-size:12px;color:var(--sub);margin:14px 0 8px;letter-spacing:2px;}
  .seg{display:flex;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:9px;overflow:hidden;}
  .seg button{flex:1;min-width:0;min-height:48px;background:transparent;color:var(--sub);border:none;font-size:15px;cursor:pointer;}
  .seg button.on{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);}
  .dots{display:flex;justify-content:center;gap:12px;margin:18px 0 4px;min-height:34px;}
  .dot{width:22px;height:22px;border-radius:50%;border:2px solid color-mix(in srgb,var(--c) 45%,transparent);
    background:transparent;transition:.08s;}
  .dot.strong{border-color:var(--gold);}
  .dot.light{background:var(--c);box-shadow:0 0 14px var(--c);}
  .dot.light.strong{background:var(--gold);box-shadow:0 0 16px var(--gold);}
  .bigbtn{width:100%;min-height:58px;border-radius:12px;border:1px solid var(--c);font-size:18px;letter-spacing:6px;
    background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);cursor:pointer;margin-top:8px;}
  .bigbtn.stop{background:color-mix(in srgb,232,69,60,15%,transparent);border-color:#e8453c;color:#ff8a82;}
  .volrow{display:flex;align-items:center;gap:10px;}
  .volrow span{font-size:12px;color:var(--sub);}
  .hint{font-size:12px;color:var(--sub);text-align:center;margin-top:10px;line-height:1.8;}
  .foot{margin-top:20px;color:#6a5a3e;font-size:12px;letter-spacing:2px;text-align:center;}
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="audio-hub.html">← 返回音乐</a>
  </div>
  <div class="head">
    <h1>节拍器</h1>
    <p>METRONOME · 强弱分明的练拍工具</p>
  </div>

  <div class="panel">
    <div class="bpmbig" id="bpmBig">120</div>
    <div class="bpmlab">BPM · 每分钟拍数</div>
    <input type="range" id="bpmRange" min="30" max="240" value="120">
    <div class="bpmrow">
      <button class="step" id="bpmMinus">−</button>
      <input type="number" id="bpmNum" min="30" max="240" value="120">
      <button class="step" id="bpmPlus">＋</button>
    </div>

    <div class="lab">拍号</div>
    <div class="seg" id="beatSeg">
      <button data-b="2">2/4</button>
      <button data-b="3">3/4</button>
      <button data-b="4" class="on">4/4</button>
      <button data-b="6">6/8</button>
    </div>

    <div class="dots" id="dots"></div>

    <div class="lab">音量</div>
    <div class="volrow"><span>小</span><input type="range" id="volRange" min="0" max="100" value="70"><span>大</span></div>

    <button class="bigbtn" id="btnStart">开 始</button>
    <div class="hint">重拍（第 1 拍）为高音方波，6/8 第 4 拍为次重拍，其余为低音正弦。</div>
  </div>

  <div class="foot">妙搭小站 · 音乐听觉 · 听音与律动</div>
</div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var S={bpm:120,beats:4,vol:.7,playing:false};
  try{
    var b=JSON.parse(localStorage.getItem('miaodaMetro')||'{}');
    if(b.bpm) S.bpm=Math.min(240,Math.max(30,b.bpm|0));
    if(b.beats) S.beats=[2,3,4,6].indexOf(b.beats)>=0?b.beats:S.beats;
    if(b.vol!=null) S.vol=Math.min(1,Math.max(0,b.vol));
  }catch(e){}

  // ===== 音频（用户点击开始后才建上下文）=====
  var ctx=null,master=null,timerID=null,nextTime=0,beatIdx=0;
  function ac(){
    if(ctx) return ctx;
    var AC=window.AudioContext||window.webkitAudioContext;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=S.vol; master.connect(ctx.destination);
    return ctx;
  }
  function clickSound(strong,sub,t){
    var o=ctx.createOscillator(),g=ctx.createGain();
    if(strong){ o.type='square'; o.frequency.value=1000; g.gain.setValueAtTime(.5,t); }
    else if(sub){ o.type='square'; o.frequency.value=800; g.gain.setValueAtTime(.35,t); }
    else{ o.type='sine'; o.frequency.value=600; g.gain.setValueAtTime(.28,t); }
    g.gain.exponentialRampToValueAtTime(.0001,t+.06);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+.08);
  }
  function lightDot(i,strong,sub){
    var dots=$('dots').children;
    var delay=(nextTime-ctx.currentTime)*1000;
    setTimeout(function(){
      for(var k=0;k<dots.length;k++) dots[k].classList.remove('light');
      if(dots[i]) dots[i].classList.add('light');
    },Math.max(0,delay));
  }
  function scheduleBeat(){
    var strong=(beatIdx===0);
    var sub=(S.beats===6&&beatIdx===3);
    clickSound(strong,sub,nextTime);
    lightDot(beatIdx,strong,sub);
    // 推进
    nextTime += 60/S.bpm;
    beatIdx=(beatIdx+1)%S.beats;
  }
  function scheduler(){
    while(nextTime < ctx.currentTime + 0.1){ scheduleBeat(); }
  }
  function start(){
    ac(); if(ctx.state==='suspended') ctx.resume();
    S.playing=true; beatIdx=0;
    nextTime=ctx.currentTime+0.08;
    timerID=setInterval(scheduler,25); // 25ms lookahead 轮询
    $('btnStart').textContent='停 止'; $('btnStart').classList.add('stop');
  }
  function stop(){
    S.playing=false;
    clearInterval(timerID); timerID=null;
    var dots=$('dots').children;
    setTimeout(function(){ for(var k=0;k<dots.length;k++) dots[k].classList.remove('light'); },120);
    $('btnStart').textContent='开 始'; $('btnStart').classList.remove('stop');
  }
  function save(){ try{ localStorage.setItem('miaodaMetro',JSON.stringify({bpm:S.bpm,beats:S.beats,vol:S.vol})); }catch(e){} }

  // ===== UI =====
  function syncUI(){
    $('bpmBig').textContent=S.bpm;
    $('bpmRange').value=S.bpm; $('bpmNum').value=S.bpm;
    $('volRange').value=Math.round(S.vol*100);
    $('beatSeg').querySelectorAll('button').forEach(function(b){ b.classList.toggle('on',+b.dataset.b===S.beats); });
    // 拍子灯
    var box=$('dots'); box.innerHTML='';
    for(var i=0;i<S.beats;i++){
      var d=document.createElement('div'); d.className='dot';
      if(i===0) d.classList.add('strong');
      box.appendChild(d);
    }
    if(master) master.gain.value=S.vol;
    save();
  }
  $('bpmRange').addEventListener('input',function(){ S.bpm=+this.value; syncUI(); });
  $('bpmNum').addEventListener('input',function(){
    var v=parseInt(this.value,10);
    if(!isNaN(v)){ S.bpm=Math.min(240,Math.max(30,v)); syncUI(); }
  });
  $('bpmMinus').onclick=function(){ S.bpm=Math.max(30,S.bpm-1); syncUI(); };
  $('bpmPlus').onclick=function(){ S.bpm=Math.min(240,S.bpm+1); syncUI(); };
  $('beatSeg').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    S.beats=+b.dataset.b; beatIdx=0; syncUI();
  });
  $('volRange').addEventListener('input',function(){ S.vol=+this.value/100; if(master) master.gain.value=S.vol; save(); });
  $('btnStart').onclick=function(){ S.playing?stop():start(); };

  syncUI();
})();
</script>
<script>
// 源码保护
(function(){
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    var key = e.key.toLowerCase();
    if (key === 'f12') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 'u') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 's') { e.preventDefault(); return; }
  });
  document.addEventListener('selectstart', function(e){
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>

<script src="sounds.js"></script>
</body>
</html>
