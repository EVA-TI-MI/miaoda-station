<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="other">
<meta name="theme-color" content="#12141c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>24 点 · 心算 — 妙搭小站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#12141c; --txt:#e9eef7; --sub:#8b97b0; --gold:#e8c77a; --c:#f0b72a; }
  html,body{background:var(--bg);}
  body{min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt);
    display:flex;flex-direction:column;align-items:center;padding:28px 14px 34px;
    background:radial-gradient(ellipse at 12% 0%,rgba(240,183,42,.14) 0%,transparent 52%),
      radial-gradient(ellipse at 88% 6%,rgba(232,199,122,.10) 0%,transparent 50%),var(--bg);}
  .top{width:100%;max-width:680px;display:flex;justify-content:flex-start;margin-bottom:16px;}
  .back{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;text-decoration:none;
    background:rgba(33,41,62,.85);border:1px solid #2c3650;color:var(--sub);font-size:13.5px;transition:.2s;min-height:44px;}
  .back:hover{background:rgba(232,199,122,.12);border-color:var(--gold);color:var(--gold);}
  .head{text-align:center;margin:6px 0 4px;}
  .head h1{font-family:"STKaiti","KaiTi","楷体",serif;font-size:36px;letter-spacing:8px;margin-bottom:8px;
    background:linear-gradient(135deg,#f5cf6a,#f0b72a 50%,#ffe8a8);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .head p{color:var(--sub);font-size:13.5px;letter-spacing:1px;line-height:1.8;}
  .cards{display:flex;gap:14px;justify-content:center;margin:20px 0 6px;flex-wrap:wrap;}
  .card{width:74px;height:104px;border-radius:12px;background:linear-gradient(150deg,#fdf6e3,#f3e4b8);
    color:#7a3b12;font-size:40px;font-weight:bold;display:flex;align-items:center;justify-content:center;
    border:1px solid #e8c77a;box-shadow:0 8px 22px rgba(0,0,0,.4);font-family:"STKaiti","KaiTi",serif;}
  .toolbar{width:100%;max-width:680px;display:flex;flex-wrap:wrap;gap:10px;justify-content:center;align-items:center;margin:16px 0 8px;}
  .btn{padding:9px 16px;border-radius:8px;font-size:14px;color:var(--txt);background:rgba(33,41,62,.85);
    border:1px solid #2c3650;cursor:pointer;transition:.2s;min-height:42px;}
  .btn:hover{border-color:var(--gold);color:var(--gold);}
  .input-row{width:100%;max-width:680px;display:flex;gap:10px;justify-content:center;flex-wrap:wrap;margin:10px 0;}
  #expr{flex:1;min-width:240px;padding:12px 14px;border-radius:8px;background:#1b1f2c;border:1px solid #2c3650;
    color:var(--txt);font-size:18px;letter-spacing:1px;outline:none;min-height:48px;font-family:inherit;}
  #expr:focus{border-color:var(--gold);}
  .msg{min-height:30px;font-size:14.5px;color:var(--gold);letter-spacing:1px;text-align:center;line-height:1.8;}
  .msg.ok{color:#4ad6c1;}
  .msg.bad{color:#e8453c;}
  .info{display:flex;gap:16px;flex-wrap:wrap;justify-content:center;color:var(--sub);font-size:13px;margin:6px 0;}
  .info b{color:var(--gold);font-weight:600;}
  .stats{width:100%;max-width:680px;margin-top:14px;padding:16px;border-radius:12px;background:rgba(255,255,255,.03);
    border:1px solid rgba(240,183,42,.16);display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px;color:var(--sub);font-size:13px;}
  .stats b{color:var(--gold);}
  .keypad{width:100%;max-width:480px;display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:12px 0 4px;}
  .key{min-height:48px;border-radius:8px;background:rgba(33,41,62,.85);border:1px solid #2c3650;color:var(--txt);
    font-size:17px;cursor:pointer;transition:.15s;}
  .key:active{background:rgba(240,183,42,.18);}
  .foot{margin-top:26px;color:#566079;font-size:12px;letter-spacing:2px;text-align:center;}
  @media (max-width:520px){.head h1{font-size:29px;letter-spacing:5px;}.card{width:64px;height:92px;font-size:34px;}}
</style>
</head>
<body>
  <div class="top"><a class="back" href="puzzle-hub.html">← 返回益智</a></div>
  <div class="head">
    <h1>24 点</h1>
    <p>四张牌 · 加减乘除，凑出 24 —— 心算与排列的博弈</p>
  </div>

  <div class="cards" id="cards"></div>
  <div class="info"><span>本局计数 <b id="round">1</b></span><span>连对 <b id="streak">0</b></span><span>最高连对 <b id="best">—</b></span></div>

  <div class="input-row">
    <input id="expr" placeholder="输入算式，如 (1+2+3)×4 —— 用 * 代替 ×" autocomplete="off" spellcheck="false">
    <button class="btn" id="calcBtn">提交</button>
  </div>
  <div class="msg" id="msg">把四张牌各用一次，通过 + - × ÷ 与括号算出 24</div>

  <div class="keypad" id="keypad"></div>

  <div class="toolbar">
    <button class="btn" id="hintBtn">看提示（解法）</button>
    <button class="btn" id="newBtn">换一局</button>
  </div>

  <div class="stats">
    <span>规则：<b>每张牌恰好用一次</b>，可任意组合括号</span>
    <span>提示按钮直接给出<b>一种正确解法</b>（若有）</span>
  </div>

  <div class="foot">妙搭小站 · 24 点 · 纯本地</div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var BEST_KEY='miaodaCalc24BestV46';
  var cur={nums:[],round:1,streak:0,solutions:[]};

  // ===== 求解器：枚举所有可能，返回表达式列表 =====
  function ops(a,b,fn){var r=[];r.push([a+b,'+',b]);r.push([a-b,'-',b]);r.push([b-a,'-',a]);r.push([a*b,'*',b]);if(Math.abs(b)>1e-9)r.push([a/b,'/',b]);if(Math.abs(a)>1e-9)r.push([b/a,'/',a]);return r;}
  function eq(x){return Math.abs(x-24)<1e-6;}

  function solve(nums){
    // 括号结构 5 种，排列 24，运算符 4^3=64 → 枚举
    var res=[];
    function perm(arr,pre){
      if(arr.length===0){enumerate(pre.slice());return;}
      for(var i=0;i<arr.length;i++){
        var rest=arr.slice(0,i).concat(arr.slice(i+1));
        perm(rest,pre.concat([arr[i]]));
      }
    }
    var memo={};
    function enumerate(a){
      // 5 种括号形式，每种用 ops 组合
      tryPair(a);
    }
    function tryPair(a){
      // ((a∘b)∘c)∘d
      var r1=ops(a[0],a[1],0);
      for(var i=0;i<r1.length;i++){
        var r2=ops(r1[i][0],a[2],0);
        for(var j=0;j<r2.length;j++){
          var r3=ops(r2[j][0],a[3],0);
          for(var k=0;k<r3.length;k++){
            if(eq(r3[k][0]))res.push('(('+fmt(a[0])+r1[i][1]+fmt(a[1])+')'+r2[j][1]+fmt(a[2])+')'+r3[k][1]+fmt(a[3]));
          }
        }
      }
      // (a∘(b∘c))∘d
      var r4=ops(a[1],a[2],0);
      for(var i2=0;i2<r4.length;i2++){
        var r5=ops(a[0],r4[i2][0],0);
        for(var j2=0;j2<r5.length;j2++){
          var r6=ops(r5[j2][0],a[3],0);
          for(var k2=0;k2<r6.length;k2++){
            if(eq(r6[k2][0]))res.push('('+fmt(a[0])+r5[j2][1]+'('+fmt(a[1])+r4[i2][1]+fmt(a[2])+'))'+r6[k2][1]+fmt(a[3]));
          }
        }
      }
      // (a∘b)∘(c∘d)
      var r7=ops(a[0],a[1],0);
      var r8=ops(a[2],a[3],0);
      for(var i3=0;i3<r7.length;i3++){
        for(var j3=0;j3<r8.length;j3++){
          var r9=ops(r7[i3][0],r8[j3][0],0);
          for(var k3=0;k3<r9.length;k3++){
            if(eq(r9[k3][0]))res.push('('+fmt(a[0])+r7[i3][1]+fmt(a[1])+')'+r9[k3][1]+'('+fmt(a[2])+r8[j3][1]+fmt(a[3])+')');
          }
        }
      }
      // a∘((b∘c)∘d)
      var r10=ops(a[1],a[2],0);
      for(var i4=0;i4<r10.length;i4++){
        var r11=ops(r10[i4][0],a[3],0);
        for(var j4=0;j4<r11.length;j4++){
          var r12=ops(a[0],r11[j4][0],0);
          for(var k4=0;k4<r12.length;k4++){
            if(eq(r12[k4][0]))res.push(fmt(a[0])+r12[k4][1]+'(('+fmt(a[1])+r10[i4][1]+fmt(a[2])+')'+r11[j4][1]+fmt(a[3])+')');
          }
        }
      }
      // a∘(b∘(c∘d))
      var r13=ops(a[2],a[3],0);
      for(var i5=0;i5<r13.length;i5++){
        var r14=ops(a[1],r13[i5][0],0);
        for(var j5=0;j5<r14.length;j5++){
          var r15=ops(a[0],r14[j5][0],0);
          for(var k5=0;k5<r15.length;k5++){
            if(eq(r15[k5][0]))res.push(fmt(a[0])+r15[k5][1]+'('+fmt(a[1])+r14[j5][1]+'('+fmt(a[2])+r13[i5][1]+fmt(a[3])+'))');
          }
        }
      }
    }
    function fmt(n){return String(n);}
    perm(nums,[]);
    // 去重
    var seen={},out=[];
    res.forEach(function(s){if(!seen[s]){seen[s]=1;out.push(s);}});
    return out;
  }

  // ===== 发牌（保证有解） =====
  function newRound(){
    for(;;){
      var nums=[];
      for(var i=0;i<4;i++){nums.push(1+Math.floor(Math.random()*13));}
      var sol=solve(nums);
      if(sol.length>0){cur.nums=nums;cur.solutions=sol;break;}
    }
    renderCards();
    $('msg').className='msg';
    $('msg').textContent='把四张牌各用一次，通过 + - × ÷ 与括号算出 24';
    $('expr').value='';
    $('expr').focus();
  }

  function renderCards(){
    var box=$('cards');box.innerHTML='';
    cur.nums.forEach(function(n){var d=document.createElement('div');d.className='card';d.textContent=n;box.appendChild(d);});
    $('round').textContent=cur.round;
  }

  function renderBest(){
    var best={};try{best=JSON.parse(localStorage.getItem(BEST_KEY)||'{}');}catch(e){}
    $('best').textContent=best.s||'—';
  }

  // ===== 校验玩家算式 =====
  function calc(){
    var raw=$('expr').value.trim();
    if(!raw){$('msg').className='msg';$('msg').textContent='请输入算式';return;}
    var expr=raw.replace(/×/g,'*').replace(/÷/g,'/').replace(/−/g,'-').replace(/＋/g,'+');
    if(!/^[\d+\-*/()\.\s]+$/.test(expr)){$('msg').className='msg bad';$('msg').textContent='算式含非法字符，只允许数字与 + - * / ( )';return;}
    // 提取数字并比对
    var m=expr.match(/\d+/g);
    if(!m||m.length!==4){$('msg').className='msg bad';$('msg').textContent='需恰好使用四张牌的数字';return;}
    var used=m.map(Number).slice().sort(function(a,b){return a-b;}).join(',');
    var need=cur.nums.slice().sort(function(a,b){return a-b;}).join(',');
    if(used!==need){$('msg').className='msg bad';$('msg').textContent='数字与牌面不一致（每张牌各用一次）';return;}
    var val;
    try{val=new Function('return ('+expr+')')();}catch(e){$('msg').className='msg bad';$('msg').textContent='算式无法解析，检查括号是否配平';return;}
    if(typeof val!=='number'||!isFinite(val)){$('msg').className='msg bad';$('msg').textContent='结果无效';return;}
    if(Math.abs(val-24)<1e-6){
      cur.round++;cur.streak++;
      var best={};try{best=JSON.parse(localStorage.getItem(BEST_KEY)||'{}');}catch(e){}
      if(!best.s||cur.streak>best.s){best.s=cur.streak;try{localStorage.setItem(BEST_KEY,JSON.stringify(best));}catch(e){}}
      renderBest();
      $('msg').className='msg ok';
      $('msg').textContent='✓ 等于 24！当前连对 '+cur.streak+'，换下一局';
      setTimeout(newRound,700);
    }else{
      $('msg').className='msg bad';
      $('msg').textContent='= '+Math.round(val*1000)/1000+'，不是 24，再想想';
      cur.streak=0;
    }
  }

  // 数字键盘
  function buildKeypad(){
    var keys=['(','+','-','*','7','8','9',')','4','5','6','/','1','2','3','0','⌫','×'];
    var kp=$('keypad');kp.innerHTML='';
    keys.forEach(function(k){
      var b=document.createElement('button');b.className='key';b.textContent=k;
      b.addEventListener('click',function(){
        var inp=$('expr');
        if(k==='⌫'){inp.value=inp.value.slice(0,-1);}
        else if(k==='×'){inp.value='';}
        else{inp.value+=k;}
        inp.focus();
      });
      kp.appendChild(b);
    });
  }

  $('calcBtn').addEventListener('click',calc);
  $('expr').addEventListener('keydown',function(e){if(e.key==='Enter')calc();});
  $('hintBtn').addEventListener('click',function(){
    if(cur.solutions.length){$('msg').className='msg';$('msg').textContent='解法示例： '+cur.solutions[0]+' = 24';}
    else{$('msg').textContent='这局无解（不应发生）';}
  });
  $('newBtn').addEventListener('click',newRound);
  buildKeypad();
  newRound();
  renderBest();
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>

<script src="sounds.js"></script>
</body>
</html>
