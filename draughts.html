<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#12141c">
<link rel="manifest" href="manifest.json">
<title>国际跳棋 · 弈境 — 妙搭小站</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#12141c;--txt:#e9eef7;--sub:#8b97b0;--gold:#e8c77a;--line:#2c3650;}
  body{min-height:100vh;background:var(--bg);color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:18px 12px 30px;
    background:radial-gradient(ellipse at 12% 0%,rgba(232,69,60,.10) 0%,transparent 50%),
      radial-gradient(ellipse at 88% 4%,rgba(91,155,245,.10) 0%,transparent 50%),var(--bg);}
  .top{width:100%;max-width:780px;display:flex;justify-content:space-between;align-items:center;margin-bottom:12px;}
  .back{display:inline-flex;align-items:center;gap:6px;padding:7px 12px;border-radius:8px;text-decoration:none;
    background:rgba(33,41,62,.85);border:1px solid var(--line);color:var(--sub);font-size:13px;transition:.2s;}
  .back:hover{background:rgba(232,199,122,.12);border-color:var(--gold);color:var(--gold);}
  .head{text-align:center;margin-bottom:10px;}
  .head h1{font-family:"STKaiti","KaiTi",serif;font-size:30px;letter-spacing:6px;
    background:linear-gradient(135deg,#e8c77a,#f2c537 50%,#fff0c0);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .head p{color:var(--sub);font-size:12.5px;letter-spacing:1px;margin-top:6px;}
  .status{width:100%;max-width:780px;text-align:center;margin:8px 0 10px;font-size:14.5px;color:var(--gold);min-height:20px;}
  .main{display:flex;gap:16px;justify-content:center;align-items:flex-start;flex-wrap:wrap;}
  #board{display:grid;grid-template-columns:repeat(8,1fr);width:min(92vw,520px);aspect-ratio:1;
    border:2px solid var(--gold);border-radius:6px;overflow:hidden;background:#20160f;}
  .sq{position:relative;display:flex;align-items:center;justify-content:center;cursor:pointer;user-select:none;}
  .sq.dark{background:#8a5a2b;}
  .sq.light{background:#e9d3a7;}
  .sq.dark.selected{box-shadow:inset 0 0 0 3px #f2c537;}
  .sq.dark.move::after{content:"";width:34%;height:34%;border-radius:50%;background:rgba(70,211,154,.45);}
  .sq.dark.cap::after{content:"";width:34%;height:34%;border-radius:50%;background:rgba(232,69,60,.5);}
  .sq.dark.lastmove{box-shadow:inset 0 0 0 3px rgba(232,199,122,.5);}
  .piece{width:78%;height:78%;border-radius:50%;display:flex;align-items:center;justify-content:center;transition:transform .15s;}
  .piece.b{background:radial-gradient(circle at 35% 30%,#d9c9a3,#b08d4f 70%);box-shadow:0 3px 8px rgba(0,0,0,.5);}
  .piece.r{background:radial-gradient(circle at 35% 30%,#f5f0e6,#cfc4b4 70%);box-shadow:0 3px 8px rgba(0,0,0,.5);}
  .piece.king::after{content:"王";font-size:clamp(10px,3.4vw,16px);color:rgba(120,40,20,.85);font-weight:700;}
  .piece.r.king::after{color:rgba(90,50,20,.9);}
  .side{display:flex;flex-direction:column;gap:10px;min-width:190px;}
  .info{background:#161b29;border:1px solid var(--line);border-radius:10px;padding:12px 14px;font-size:13px;line-height:1.9;color:var(--sub);}
  .info b{color:var(--gold);}
  .btns{display:flex;gap:10px;justify-content:center;margin-top:10px;flex-wrap:wrap;}
  .btn{padding:9px 18px;border-radius:8px;font-size:14px;letter-spacing:1px;color:var(--gold);
    background:rgba(232,199,122,.1);border:1px solid var(--gold);cursor:pointer;transition:.2s;}
  .btn:hover{background:var(--gold);color:#111520;}
  .btn.ghost{color:var(--sub);border-color:var(--line);background:transparent;}
  .btn.ghost:hover{color:var(--gold);border-color:var(--gold);background:rgba(232,199,122,.08);}
  .rules{width:100%;max-width:780px;margin-top:14px;padding:12px 14px;background:rgba(255,255,255,.03);
    border:1px solid var(--line);border-radius:10px;font-size:12.5px;line-height:1.9;color:var(--sub);}
  .rules b{color:var(--gold);font-weight:normal;}
  .foot{margin-top:16px;color:#566079;font-size:12px;letter-spacing:2px;text-align:center;}
</style>
</head>
<body>
  <div class="top">
    <a class="back" href="chess-hub.html">← 返回棋院</a>
    <a class="back" href="index.html">首页</a>
  </div>
  <div class="head">
    <h1>国际跳棋</h1>
    <p>DRAUGHTS · 西洋跳棋 · 8×8 斜跳 · 强制吃子</p>
  </div>
  <div class="status" id="status">红方先行 · 有吃必吃</div>
  <div class="main">
    <div id="board"></div>
    <div class="side">
      <div class="info" id="info">红方：12 子<br>黑方：12 子<br><b>规则</b>：斜线走子，普通子只进不退；隔子跳吃、连跳不停；到底线升王，王可前后斜走、长跳连吃。有吃必吃。</div>
      <div class="btns">
        <button class="btn ghost" id="undoBtn">悔棋</button>
        <button class="btn ghost" id="newBtn">新开一局</button>
        <button class="btn ghost" id="modeBtn">当前：人机</button>
      </div>
    </div>
  </div>
  <div class="rules">
    <b>玩法</b>：红方先行。普通子（兵）只能向前斜走一格；<b>吃子</b>：隔一格跳吃对方棋子（必须吃，有多吃选择时选吃子最多的一档，连跳不停）；到达对方底线立即升王。<b>王</b>：可前后斜走任意格，跳吃时沿斜线跳过敌子、落点可选敌子后同方向任一空格（长跳），可连跳。<b>胜负</b>：吃光对方或对方无子可动即胜。
  </div>
  <div class="foot">妙搭小站 · 国际跳棋 DRAUGHTS · 纯本地</div>

<script>
var $=function(id){return document.getElementById(id);};
var board=[],turn='r',selected=null,selMoves=[],moves=[],mode='ai',gameEnded=false,lastPath=null;
function setup(){
  board=[];
  for(var r=0;r<8;r++){board[r]=[];for(var c=0;c<8;c++){
    board[r][c]=((r+c)%2===1)?(r<3?{p:'b',k:false}:(r>4?{p:'r',k:false}:null)):null;
  }}
  turn='r';selected=null;selMoves=[];moves=[];gameEnded=false;lastPath=null;
}
function opp(p){return p==='r'?'b':'r';}
function inB(r,c){return r>=0&&r<8&&c>=0&&c<8;}
// 生成全部走法（含强制吃子过滤、最多吃子过滤）
function genMoves(p){
  var simple=[];      // 普通走（只走不吃）
  var jumpRes=[];     // 所有跳吃路径
  function trySimple(r,c,k){
    var dirs=k?[[-1,-1],[-1,1],[1,-1],[1,1]]:(p==='r'?[[-1,-1],[-1,1]]:[[1,-1],[1,1]]);
    for(var i=0;i<dirs.length;i++){
      var nr=r+dirs[i][0],nc=c+dirs[i][1];
      if(inB(nr,nc)&&!board[nr][nc])simple.push({path:[[r,c],[nr,nc]],jumps:[]});
    }
  }
  function dfs(r,c,k,path,jumps){
    var extended=false;
    var dirs=[[-1,-1],[-1,1],[1,-1],[1,1]];
    for(var i=0;i<dirs.length;i++){
      var dr=dirs[i][0],dc=dirs[i][1];
      // 兵只能向前跳
      if(!k){
        var f=(p==='r')?dr===-1:dr===1;
        if(!f)continue;
      }
      var jr=r+dr,jc=c+dc;
      while(inB(jr,jc)&&board[jr][jc]&&board[jr][jc].p===opp(p)){
        var lr=jr+dr,lc=jc+dc;
        if(inB(lr,lc)&&!board[lr][lc]){
          // 吃掉 (jr,jc)，落点 (lr,lc)
          var saved=board[jr][jc];
          board[jr][jc]=null;
          var np=path.concat([[lr,lc]]),nj=jumps.concat([[jr,jc]]);
          dfs(lr,lc,k,np,nj);
          // 王的长跳：同一方向敌子后更远的空格也合法（不继续吃，只换落点）
          if(k){
            var lr2=lr+dr,lc2=lc+dc;
            while(inB(lr2,lc2)&&!board[lr2][lc2]){
              jumpRes.push({path:path.concat([[lr2,lc2]]),jumps:nj});
              // 从更远落点也可继续连跳
              dfs(lr2,lc2,k,path.concat([[lr2,lc2]]),nj);
              lr2+=dr;lc2+=dc;
            }
          }
          board[jr][jc]=saved;
          extended=true;
        }
        break; // 只能跳过第一个敌子
      }
    }
    if(extended&&jumps.length)jumpRes.push({path:path,jumps:jumps});
  }
  for(var r=0;r<8;r++)for(var c=0;c<8;c++){
    var pc=board[r][c];
    if(pc&&pc.p===p){
      dfs(r,c,pc.k,[[r,c]],[]);
      if(!hasJump)trySimple(r,c,pc.k);
    }
  }
  // 有吃必吃：只保留跳吃；多种吃法取吃子最多
  if(jumpRes.length){
    var max=0;
    jumpRes.forEach(function(m){if(m.jumps.length>max)max=m.jumps.length;});
    return jumpRes.filter(function(m){return m.jumps.length===max;});
  }
  return simple;
}
// 临时标记（dfs 中使用）
var hasJump=false;
function apply(m){
  var path=m.path, from=path[0], to=path[path.length-1];
  var pc=board[from[0]][from[1]];
  if(!pc)return;
  var jumpPieces={};
  m.jumps.forEach(function(j){jumpPieces[j[0]+'_'+j[1]]=board[j[0]][j[1]];});
  board[from[0]][from[1]]=null;
  m.jumps.forEach(function(j){board[j[0]][j[1]]=null;});
  board[to[0]][to[1]]=pc;
  var promoted=false;
  if(!pc.k&&((pc.p==='r'&&to[0]===0)||(pc.p==='b'&&to[0]===7))){pc.k=true;promoted=true;}
  moves.push({m:m,turn:turn,jumpPieces:jumpPieces,promoted:promoted});
  lastPath=path;
}
function undoMove(){
  if(!moves.length)return;
  var rec=moves.pop();
  var path=rec.m.path, to=path[path.length-1], from=path[0];
  var pc=board[to[0]][to[1]];
  if(rec.promoted)pc.k=false;
  board[to[0]][to[1]]=null;
  board[from[0]][from[1]]=pc;
  rec.m.jumps.forEach(function(j){board[j[0]][j[1]]=rec.jumpPieces[j[0]+'_'+j[1]];});
  turn=rec.turn;
  selected=null;selMoves=[];lastPath=path;
  render();
}
function switchTurn(){turn=turn==='r'?'b':'r';}
// ===== AI =====
function evalBoard(){
  var s=0;
  for(var r=0;r<8;r++)for(var c=0;c<8;c++){
    var pc=board[r][c];if(!pc)continue;
    var v=pc.k?3:1;
    var pos=pc.p==='r'?(7-r):r;
    s+=(pc.p==='r'?1:-1)*(v+pos*0.08);
  }
  return s;
}
function aiMove(){
  var ms=genMoves('b');
  if(!ms.length){gameOver('r');return;}
  var best=null,bestScore=-1e9;
  function search(depth,alpha,beta){
    var cur=turn;
    var all=genMoves(cur);
    if(!all.length)return cur==='b'?-1000:1000;
    if(depth===0)return cur==='b'?evalBoard():-evalBoard();
    all.sort(function(a,b){return b.jumps.length-a.jumps.length;});
    if(cur==='b'){
      var bv=-1e9;
      for(var i=0;i<all.length;i++){
        apply(all[i]);switchTurn();
        var v=search(depth-1,alpha,beta);
        switchTurn();undoMove();
        if(v>bv)bv=v;
        if(v>alpha)alpha=v;
        if(beta<=alpha)break;
      }
      return bv;
    }else{
      var bv2=1e9;
      for(var j=0;j<all.length;j++){
        apply(all[j]);switchTurn();
        var v2=search(depth-1,alpha,beta);
        switchTurn();undoMove();
        if(v2<bv2)bv2=v2;
        if(v2<beta)beta=v2;
        if(beta<=alpha)break;
      }
      return bv2;
    }
  }
  for(var i=0;i<ms.length;i++){
    apply(ms[i]);switchTurn();
    var s=search(2,-1e9,1e9);
    switchTurn();undoMove();
    if(s>bestScore){bestScore=s;best=ms[i];}
  }
  if(best){
    apply(best);switchTurn();
    if(genMoves('r').length===0){gameOver('b');return;}
  }
  selected=null;selMoves=[];render();
}
// ===== 渲染与交互 =====
function render(){
  var b=$('board');b.innerHTML='';
  var counts={r:0,b:0};
  for(var r=0;r<8;r++)for(var c=0;c<8;c++){
    var sq=document.createElement('div');
    sq.className='sq '+((r+c)%2===1?'dark':'light');
    var pc=board[r][c];
    if(pc){
      var p=document.createElement('div');
      p.className='piece '+pc.p+(pc.k?' king':'');
      sq.appendChild(p);
      counts[pc.p]++;
    }
    if(selected&&selected[0]===r&&selected[1]===c)sq.classList.add('selected');
    if(lastPath&&lastPath.some(function(x){return x[0]===r&&x[1]===c;}))sq.classList.add('lastmove');
    selMoves.forEach(function(m){
      var t=m.path[m.path.length-1];
      if(t[0]===r&&t[1]===c)sq.classList.add(m.jumps.length?'cap':'move');
    });
    sq.addEventListener('click',function(){clickSq(parseInt(this.dataset.r,10),parseInt(this.dataset.c,10));});
    sq.setAttribute('data-r',r);sq.setAttribute('data-c',c);
    b.appendChild(sq);
  }
  $('info').innerHTML='红方：'+counts.r+' 子<br>黑方：'+counts.b+' 子<br><b>规则</b>：斜线走子，普通子只进不退；隔子跳吃、连跳不停；到底线升王，王可前后斜走、长跳连吃。有吃必吃。';
  $('status').textContent=(gameEnded?'':(turn==='r'?'红方':'黑方')+'行棋 · 有吃必吃');
}
function clickSq(r,c){
  if(gameEnded)return;
  if(mode==='ai'&&turn==='b')return;
  var pc=board[r][c];
  if(selected){
    var target=selMoves.filter(function(m){return m.path[m.path.length-1][0]===r&&m.path[m.path.length-1][1]===c;});
    if(target.length){
      apply(target[0]);
      switchTurn();
      selected=null;selMoves=[];
      if(gameOverCheck())return;
      afterTurn();
      return;
    }
    if(pc&&pc.p===turn){
      selected=[r,c];
      selMoves=genMoves(turn).filter(function(m){return m.path[0][0]===r&&m.path[0][1]===c;});
      render();
      return;
    }
    selected=null;selMoves=[];render();return;
  }
  if(pc&&pc.p===turn){
    selected=[r,c];
    selMoves=genMoves(turn).filter(function(m){return m.path[0][0]===r&&m.path[0][1]===c;});
  }else{selected=null;selMoves=[];}
  render();
}
function gameOverCheck(){
  if(genMoves(turn).length===0){gameOver(opp(turn));return true;}
  return false;
}
function gameOver(w){
  gameEnded=true;
  $('status').textContent=(w==='r'?'红方胜！':'黑方胜！')+' · 对方无子可动';
  if(mode==='ai'){
    try{var rec=JSON.parse(localStorage.getItem('draughts_record')||'{"w":0,"l":0,"d":0}');if(w==='r')rec.w++;else rec.l++;localStorage.setItem('draughts_record',JSON.stringify(rec));}catch(e){}
  }
}
function afterTurn(){
  render();
  if(mode==='ai'&&turn==='b'&&!gameEnded)setTimeout(function(){aiMove();},300);
}
function newGame(){setup();render();}
$('undoBtn').addEventListener('click',function(){
  if(mode==='ai'){undoMove();switchTurn();if(moves.length){undoMove();switchTurn();}}
  else{undoMove();switchTurn();}
  gameEnded=false;render();
});
$('newBtn').addEventListener('click',newGame);
$('modeBtn').addEventListener('click',function(){
  mode=mode==='ai'?'2p':'ai';
  newGame();
  this.textContent='当前：'+(mode==='ai'?'人机':'双人');
});
setup();render();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>

<script src="sounds.js"></script>
</body>
</html>
