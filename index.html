<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="other">
<title>妙搭小站 - 游戏与阅读</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }

  body {
    min-height: 100vh;
    font-family: "PingFang SC", "Microsoft YaHei", sans-serif;
    color: #e8dcc8;
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: flex-start;
    padding: 40px 20px;
    background:
      radial-gradient(ellipse at 20% 20%, rgba(184, 134, 11, 0.15) 0%, transparent 50%),
      radial-gradient(ellipse at 80% 80%, rgba(0, 255, 200, 0.08) 0%, transparent 50%),
      #0f0d08;
  }

  @media (min-height: 700px) {
    body {
      justify-content: center;
    }
  }

  .site-header {
    text-align: center;
    margin-bottom: 48px;
  }

  .site-title {
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-size: 42px;
    font-weight: bold;
    background: linear-gradient(135deg, #d4a84b 0%, #e8c77a 50%, #d4a84b 100%);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 8px;
    margin-bottom: 12px;
  }

  .site-subtitle {
    font-size: 14px;
    color: #8a7555;
    letter-spacing: 4px;
  }

  .cards-container {
    display: flex;
    gap: 32px;
    flex-wrap: wrap;
    justify-content: center;
    max-width: 900px;
  }

  .app-card {
    width: 340px;
    height: 440px;
    border-radius: 16px;
    position: relative;
    overflow: hidden;
    cursor: pointer;
    transition: transform 0.3s, box-shadow 0.3s;
    text-decoration: none;
    display: block;
  }

  .app-card:hover {
    transform: translateY(-6px);
  }

  .app-card.snake:hover {
    box-shadow: 0 16px 48px rgba(0, 255, 200, 0.25);
  }

  .app-card.biquge:hover {
    box-shadow: 0 16px 48px rgba(212, 168, 75, 0.25);
  }

  .card-bg {
    position: absolute;
    top: 0; left: 0; right: 0; bottom: 0;
    z-index: 0;
  }

  .app-card.snake .card-bg {
    background: linear-gradient(135deg, #0a0a1f 0%, #1a1a3e 50%, #0d0d2a 100%);
  }

  .app-card.biquge .card-bg {
    background: linear-gradient(135deg, #1a0f05 0%, #3d2510 50%, #2a1a0a 100%);
  }

  .card-bg::before {
    content: "";
    position: absolute;
    top: -30%;
    right: -30%;
    width: 300px;
    height: 300px;
    border-radius: 50%;
    opacity: 0.2;
  }

  .app-card.snake .card-bg::before {
    background: radial-gradient(circle, #00ffc8 0%, transparent 70%);
  }

  .app-card.biquge .card-bg::before {
    background: radial-gradient(circle, #d4a84b 0%, transparent 70%);
  }

  .card-bg::after {
    content: "";
    position: absolute;
    bottom: -20%;
    left: -20%;
    width: 250px;
    height: 250px;
    border-radius: 50%;
    opacity: 0.15;
  }

  .app-card.snake .card-bg::after {
    background: radial-gradient(circle, #ff6b9d 0%, transparent 70%);
  }

  .app-card.biquge .card-bg::after {
    background: radial-gradient(circle, #8b4513 0%, transparent 70%);
  }

  .card-content {
    position: relative;
    z-index: 1;
    height: 100%;
    padding: 32px;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
  }

  .card-icon {
    width: 80px;
    height: 80px;
    border-radius: 16px;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 40px;
    margin-bottom: 20px;
  }

  .app-card.snake .card-icon {
    background: rgba(0, 255, 200, 0.15);
    border: 2px solid rgba(0, 255, 200, 0.4);
    box-shadow: 0 0 30px rgba(0, 255, 200, 0.2);
  }

  .app-card.biquge .card-icon {
    background: rgba(212, 168, 75, 0.15);
    border: 2px solid rgba(212, 168, 75, 0.4);
    box-shadow: 0 0 30px rgba(212, 168, 75, 0.2);
  }

  .card-title {
    font-size: 28px;
    font-weight: bold;
    margin-bottom: 8px;
  }

  .app-card.snake .card-title {
    color: #00ffc8;
    font-family: 'Courier New', monospace;
    letter-spacing: 2px;
    text-shadow: 0 0 20px rgba(0, 255, 200, 0.5);
  }

  .app-card.biquge .card-title {
    color: #d4a84b;
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    letter-spacing: 4px;
    text-shadow: 0 0 20px rgba(212, 168, 75, 0.5);
  }

  .card-desc {
    font-size: 14px;
    line-height: 1.8;
    color: rgba(255, 255, 255, 0.6);
    margin-bottom: 12px;
  }

  .card-tags {
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
    margin-bottom: 20px;
  }

  .card-tag {
    padding: 3px 10px;
    border-radius: 4px;
    font-size: 12px;
    backdrop-filter: blur(10px);
  }

  .app-card.snake .card-tag {
    background: rgba(0, 255, 200, 0.15);
    border: 1px solid rgba(0, 255, 200, 0.3);
    color: #00ffc8;
  }

  .app-card.biquge .card-tag {
    background: rgba(212, 168, 75, 0.15);
    border: 1px solid rgba(212, 168, 75, 0.3);
    color: #d4a84b;
  }

  .card-btn {
    padding: 12px 24px;
    border-radius: 8px;
    font-size: 15px;
    font-weight: 500;
    display: inline-flex;
    align-items: center;
    gap: 8px;
    transition: all 0.2s;
    align-self: flex-start;
  }

  .app-card.snake .card-btn {
    background: rgba(0, 255, 200, 0.2);
    border: 1px solid #00ffc8;
    color: #00ffc8;
  }

  .app-card.biquge .card-btn {
    background: rgba(212, 168, 75, 0.2);
    border: 1px solid #d4a84b;
    color: #d4a84b;
  }

  .app-card.snake:hover .card-btn {
    background: #00ffc8;
    color: #0a0a1f;
  }

  .app-card.biquge:hover .card-btn {
    background: #d4a84b;
    color: #1a0f05;
  }

  .card-preview {
    position: absolute;
    right: -20px;
    bottom: -20px;
    width: 160px;
    height: 120px;
    border-radius: 8px;
    opacity: 0.6;
    transform: rotate(-5deg);
    transition: all 0.3s;
  }

  .app-card:hover .card-preview {
    opacity: 0.8;
    transform: rotate(-3deg) translateY(-4px);
  }

  .app-card.snake .card-preview {
    background:
      repeating-linear-gradient(0deg, transparent, transparent 9px, rgba(0,255,200,0.1) 9px, rgba(0,255,200,0.1) 10px),
      repeating-linear-gradient(90deg, transparent, transparent 9px, rgba(0,255,200,0.1) 9px, rgba(0,255,200,0.1) 10px),
      #0d0d1a;
    border: 1px solid rgba(0, 255, 200, 0.3);
  }

  .app-card.snake .card-preview::before {
    content: "🐍";
    position: absolute;
    top: 20px;
    left: 20px;
    font-size: 32px;
    filter: drop-shadow(0 0 8px rgba(0,255,200,0.6));
  }

  .app-card.snake .card-preview::after {
    content: "🍎";
    position: absolute;
    top: 50px;
    right: 30px;
    font-size: 20px;
    filter: drop-shadow(0 0 8px rgba(255,59,59,0.6));
  }

  .app-card.biquge .card-preview {
    background: linear-gradient(135deg, #3d2510, #6b4423);
    border: 1px solid rgba(212, 168, 75, 0.3);
  }

  .app-card.biquge .card-preview::before {
    content: "笔";
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%, -50%);
    font-family: "STKaiti", "KaiTi", "楷体", serif;
    font-size: 48px;
    color: #d4a84b;
    opacity: 0.7;
    text-shadow: 0 0 10px rgba(212, 168, 75, 0.5);
  }

  .app-card.biquge .card-preview::after {
    content: "";
    position: absolute;
    bottom: 20px;
    left: 20px;
    right: 20px;
    height: 6px;
    background: repeating-linear-gradient(90deg, rgba(212,168,75,0.3) 0, rgba(212,168,75,0.3) 20px, transparent 20px, transparent 24px);
  }

  .footer {
    margin-top: 60px;
    text-align: center;
    color: #5a4a35;
    font-size: 12px;
    letter-spacing: 2px;
  }

  @media (max-width: 768px) {
    .site-title { font-size: 32px; letter-spacing: 4px; }
    .site-header { margin-bottom: 32px; }
    .cards-container { gap: 20px; }
    .app-card { width: 100%; max-width: 340px; min-height: 380px; height: auto; }
    .card-icon { width: 64px; height: 64px; font-size: 32px; border-radius: 12px; }
    .card-title { font-size: 24px; }
    .card-preview { width: 110px; height: 80px; right: -10px; bottom: -10px; }
    .card-content { padding: 24px; }
  }

  @media (max-width: 380px) {
    body { padding: 24px 16px; }
    .site-title { font-size: 26px; letter-spacing: 2px; }
    .site-subtitle { font-size: 12px; letter-spacing: 2px; }
    .site-header { margin-bottom: 24px; }
    .card-desc { font-size: 13px; line-height: 1.6; }
    .card-title { font-size: 22px; }
    .card-icon { width: 56px; height: 56px; font-size: 28px; border-radius: 10px; margin-bottom: 14px; }
    .card-content { padding: 20px; }
    .card-btn { padding: 10px 18px; font-size: 14px; }
    .card-preview { width: 90px; height: 65px; }
  }
</style>
</head>
<body>

  <div class="site-header">
    <h1 class="site-title">妙搭小站</h1>
    <p class="site-subtitle">GAMES & READING</p>
  </div>

  <div class="cards-container">
    <a href="snake.html" class="app-card snake" title="霓虹贪吃蛇 - 经典贪吃蛇游戏" aria-label="进入霓虹贪吃蛇游戏">
      <div class="card-bg"></div>
      <div class="card-content">
        <div>
          <div class="card-icon">🐍</div>
          <h2 class="card-title">霓虹贪吃蛇</h2>
          <p class="card-desc">经典贪吃蛇游戏，霓虹像素风格。7种蛇色自由切换，越吃越快，挑战你的最高分！</p>
          <div class="card-tags">
            <span class="card-tag">休闲</span>
            <span class="card-tag">经典</span>
            <span class="card-tag">霓虹风</span>
          </div>
        </div>
        <div class="card-btn">
          开始游戏 →
        </div>
      </div>
      <div class="card-preview"></div>
    </a>

    <a href="biquge.html" class="app-card biquge" title="笔趣阁 - 小说阅读" aria-label="进入笔趣阁小说阅读">
      <div class="card-bg"></div>
      <div class="card-content">
        <div>
          <div class="card-icon">📚</div>
          <h2 class="card-title">笔趣阁</h2>
          <p class="card-desc">海量精品小说免费阅读。沉浸式阅读器、多主题切换、书架收藏，尽享阅读时光。</p>
          <div class="card-tags">
            <span class="card-tag">玄幻</span>
            <span class="card-tag">仙侠</span>
            <span class="card-tag">都市</span>
            <span class="card-tag">历史</span>
          </div>
        </div>
        <div class="card-btn">
          进入书阁 →
        </div>
      </div>
      <div class="card-preview"></div>
    </a>
  </div>

  <div class="footer">
    两个小站，各自精彩
  </div>

<script>
// 源码保护
(function(){
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    var key = e.key.toLowerCase();
    if (key === 'f12') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 'u') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 's') { e.preventDefault(); return; }
  });
  document.addEventListener('selectstart', function(e){
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
})();
</script>
</body>
</html>
