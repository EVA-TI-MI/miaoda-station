// render 之后同步朗读状态：换章自动续读、离开阅读页自动停止、同章重渲染不打断
function ttsAfterRender() {
  if (currentPage !== 'reader') {
    if (tts.playing) ttsStop();
    return;
  }
  ttsPopulateEngineSelect();
  ttsPopulateVoiceSelect();
  if (!tts.playing) { ttsRefreshUI(); return; }
  const same = (tts.bookId === currentBookId && tts.chapterNum === currentChapterNum);
  if (same && tts.chapterEnded) {
    ttsStop();
    showToast('🎧 本书已听完');
    return;
  }
  if (!same) {
    ttsStartChapter(0);
  } else {
    ttsHighlight(tts.index);
    ttsRefreshUI();
  }
}


// ==================== 本地 TXT 导入（编码识别 / 安全检测 / 自动分章 / IndexedDB 存储） ====================
const LOCAL_DB = 'biquge_local_books', LOCAL_STORE = 'books';
const LOCAL_MAX = 20 * 1024 * 1024; // 单文件 20MB 上限
function localOpenDB() {
  return new Promise(function (res) {
    if (!window.indexedDB) return res(null);
    let req;
    try { req = indexedDB.open(LOCAL_DB, 1); } catch (e) { return res(null); }
    req.onupgradeneeded = function () { if (!req.result.objectStoreNames.contains(LOCAL_STORE)) req.result.createObjectStore(LOCAL_STORE, { keyPath: 'id' }); };
    req.onsuccess = function () { res(req.result); };
    req.onerror = function () { res(null); };
  });
}
function localIDB(mode, fn) {
  return localOpenDB().then(function (db) {
    return new Promise(function (res) {
      if (!db) return res(null);
      try { const tx = db.transaction(LOCAL_STORE, mode), st = tx.objectStore(LOCAL_STORE), rq = fn(st);
        if (rq && rq.onsuccess !== undefined) { rq.onsuccess = function () { res(rq.result); }; rq.onerror = function () { res(null); }; }
        else { tx.oncomplete = function () { res(true); }; tx.onerror = function () { res(null); }; }
      } catch (e) { res(null); }
    });
  });
}
function localPutBook(b) { return localIDB('readwrite', st => st.put(b)); }
function localAllBooks() { return localIDB('readonly', st => st.getAll()); }
function localDeleteBook(id) { return localIDB('readwrite', st => st.delete(id)); }

// 解码：BOM → UTF-8 严格 → GBK 兜底（中文 txt 常见 GB18030/GBK）
function localDecode(buf) {
  const u8 = new Uint8Array(buf);
  if (u8.length >= 3 && u8[0] === 0xEF && u8[1] === 0xBB && u8[2] === 0xBF) return new TextDecoder('utf-8').decode(u8.subarray(3));
  if (u8.length >= 2 && u8[0] === 0xFF && u8[1] === 0xFE) return new TextDecoder('utf-16le').decode(u8.subarray(2));
  if (u8.length >= 2 && u8[0] === 0xFE && u8[1] === 0xFF) return new TextDecoder('utf-16be').decode(u8.subarray(2));
  try { return new TextDecoder('utf-8', { fatal: true }).decode(u8); } catch (e) {}
  try { return new TextDecoder('gbk').decode(u8); } catch (e) { return new TextDecoder('utf-8').decode(u8); }
}

// 纯文本安全检测：拦截伪装可执行文件 / 二进制 / 内嵌脚本（说明：纯文本 txt 不会携带可执行病毒，这里做的是“是否为安全纯文本”校验）
function txtSafetyScan(fileName, u8, text) {
  const lower = String(fileName || '').toLowerCase();
  if (!lower.endsWith('.txt')) return { ok: false, reason: '不是 .txt 文本文件' };
  if (u8.length < 2) return { ok: false, reason: '文件为空' };
  if (u8.length > LOCAL_MAX) return { ok: false, reason: '超过 20MB 上限' };
  const hex = Array.from(u8.slice(0, 8)).map(b => b.toString(16).padStart(2, '0')).join('');
  const magic = [
    ['4d5a', 'Windows 可执行程序（EXE/DLL）'], ['7f454c46', 'Linux 可执行程序'],
    ['504b0304', '压缩包（ZIP/Office）'], ['25504446', 'PDF 文档'], ['cafebabe', 'Java 程序'],
    ['cffaedfe', 'Windows 可执行程序'], ['feedface', '可执行程序'], ['78617221', '压缩包']
  ];
  for (const item of magic) if (hex.startsWith(item[0])) return { ok: false, reason: '文件头为' + item[1] + '，并非纯文本，已阻止' };
  if (/^\s*#!/.test(text.slice(0, 200))) return { ok: false, reason: '内容是脚本文件，已阻止' };
  for (let i = 0; i < Math.min(u8.length, 200000); i++) if (u8[i] === 0) return { ok: false, reason: '含二进制空字节，不是纯文本，已阻止' };
  const sample = text.slice(0, 200000);
  let bad = 0;
  for (const ch of sample) { const c = ch.codePointAt(0); if (c === 0xFFFD || (c < 32 && c !== 9 && c !== 10 && c !== 13)) bad++; }
  if (sample.length > 0 && bad / sample.length > 0.002) return { ok: false, reason: '含大量非文本字节，疑似二进制或已损坏，已阻止' };
  if (/<script[\s>]/i.test(text) || /<\?php/i.test(text) || /<%[^%]/.test(text.slice(0, 8000))) return { ok: false, reason: '内嵌可执行脚本，为安全已阻止' };
  return { ok: true };
}

// 逐行扫描分章；识别不到章节则整本一章
const LOCAL_HEAD_RE = /^\s*(第\s*[0-9零一二三四五六七八九十百千万两]+\s*[章节回卷集部篇][^\n]{0,40}|楔子|序章|序言|前言|引子|引言|后记|尾声|番外[^\n]{0,30}|Chapter\s+\d+[^\n]{0,40})\s*$/i;
function splitIntoChapters(raw, fallback) {
  const lines = raw.replace(/\r\n?/g, '\n').replace(/^\uFEFF/, '').split('\n');
  const chapters = [];
  let cur = null, headCount = 0;
  const flush = function () {
    if (!cur) return;
    const ps = cur.buf.map(s => s.trim()).filter(Boolean);
    if (ps.length) { cur.c.paragraphs = ps; chapters.push(cur.c); }
    cur = null;
  };
  for (const line of lines) {
    if (LOCAL_HEAD_RE.test(line)) {
      headCount++; flush();
      cur = { c: { title: line.trim(), paragraphs: [] }, buf: [] };
    } else if (cur) cur.buf.push(line);
    else if (!chapters.length) cur = { c: { title: '开篇', paragraphs: [] }, buf: [line] };
  }
  flush();
  if (headCount < 2 || chapters.length === 0) {
    const ps = lines.map(s => s.trim()).filter(Boolean);
    return ps.length ? [{ title: fallback, paragraphs: ps }] : [];
  }
  return chapters;
}

function localEnsureInput() {
  let i = document.getElementById('localTxtInput');
  if (i) return i;
  i = document.createElement('input');
  i.type = 'file'; i.id = 'localTxtInput'; i.accept = '.txt,text/plain'; i.multiple = true;
  i.style.display = 'none';
  i.addEventListener('change', function () { onLocalTxtFiles(i); });
  document.body.appendChild(i);
  return i;
}
function pickLocalTxt() { localEnsureInput().click(); }
async function onLocalTxtFiles(input) {
  const files = Array.from(input.files || []);
  try { input.value = ''; } catch (e) {}
  if (!files.length) return;
  showToast('正在检测并解析 ' + files.length + ' 个文件…');
  let ok = 0; const fail = [];
  for (const f of files) {
    try {
      const buf = await f.arrayBuffer();
      const u8 = new Uint8Array(buf);
      const text = localDecode(buf);
      const scan = txtSafetyScan(f.name, u8, text);
      if (!scan.ok) { fail.push(f.name + '：' + scan.reason); continue; }
      const base = f.name.replace(/\.txt$/i, '').trim() || '本地书籍';
      const real = splitIntoChapters(text, base);
      if (!real.length) { fail.push(f.name + '：未解析出正文'); continue; }
      const words = text.replace(/\s/g, '').length;
      const id = 'local_' + Date.now().toString(36) + Math.floor(Math.random() * 1e6).toString(36);
      const book = {
        id, title: base, author: '本地导入', category: 'mingzhu', tags: ['本地导入', 'TXT'], status: '完结',
        words: Math.round(words / 10000 * 10) / 10, chapters: real.length, rating: 0, hot: 0,
        desc: '本地导入的 TXT：共 ' + real.length + ' 章、约 ' + words.toLocaleString() + ' 字，已通过纯文本安全检测。',
        gradient: ['#5d4037', '#8d6e63', '#bcaaa4'], realContent: real, localImport: true, importAt: Date.now()
      };
      await localPutBook(book);
      if (!BOOKS_DATA.some(x => x.id === id)) BOOKS_DATA.unshift(book);
      addToShelf(id);
      ok++;
    } catch (err) { fail.push(f.name + '：解析异常（' + (err && err.message ? err.message : err) + '）'); }
  }
  if (ok) showToast('安全检测通过，成功导入 ' + ok + ' 本');
  if (fail.length) alert('以下文件未通过检测或解析失败，未导入：\n\n' + fail.join('\n'));
  try { render(); } catch (e) {}
}
async function localRemoveBook(id) {
  await localDeleteBook(id);
  removeFromShelf(id);
  for (let i = BOOKS_DATA.length - 1; i >= 0; i--) if (BOOKS_DATA[i].id === id) BOOKS_DATA.splice(i, 1);
  try { render(); } catch (e) {}
}
// 启动时把本地书载入内存并确保在书架
function localLoadIntoMemory() {
  return localAllBooks().then(function (arr) {
    if (!arr || !arr.length) return;
    arr.forEach(b => { if (!BOOKS_DATA.some(x => x.id === b.id)) BOOKS_DATA.unshift(b); });
    const shelf = getShelf(); let changed = false;
    arr.forEach(b => { if (!shelf.some(s => s.id === b.id)) { shelf.unshift({ id: b.id, lastChapter: 1, lastTime: b.importAt || Date.now() }); changed = true; }});
    if (changed) saveShelf(shelf);
  }).catch(function () {});
}
localLoadIntoMemory().then(function () { try { render(); } catch (e) {} });

// ==================== 阅读器“更多”面板 + 独立录音（保存到手机 / 系统分享） ====================
// ============ 离线语音包：持久化 + 跨 App(微信/QQ)导入导出共用 ============
// 与 sw.js 的 TTS_CACHE 同名；离线引擎(约45MB)就缓存在这里
const TTS_CACHE_NAME = 'biquge-tts-v1';
// 请求持久化存储，尽量避免微信/QQ(X5)在空间不足时自动清掉已下好的离线包
function ttsPersistStorage() {
  try {
    if (navigator.storage && navigator.storage.persisted) {
      navigator.storage.persisted().then(function (p) {
        if (!p && navigator.storage.persist) navigator.storage.persist().catch(function () {});
      }).catch(function () {});
    }
  } catch (e) {}
}
// 按需加载压缩库 fflate（UMD，挂到 window.fflate）
function ensureFflate(cb) {
  if (window.fflate) { cb && cb(window.fflate); return; }
  const s = document.createElement('script');
  s.src = ttsBase() + 'fflate.js';
  s.onload = function () { cb && cb(window.fflate); };
  s.onerror = function () { showToast('打包组件加载失败，请联网后重试'); };
  document.head.appendChild(s);
}
// 离线朗读引擎必需文件白名单（排除声音克隆 zvmodel、测试文件等“大而无关”的内容）
function ttsPackWanted(pathname) {
  if (pathname.indexOf('/tts/model/') >= 0) return true; // 6 个模型文件
  const base = pathname.split('/').pop();
  return ['biquge-tts.worker.js', 'sherpa-onnx-tts.js',
          'sherpa-onnx-wasm-main-tts.js', 'sherpa-onnx-wasm-main-tts.wasm'].indexOf(base) >= 0;
}
// 导入写回缓存时按扩展名补 MIME，否则 importScripts 会因空 MIME 拒绝执行、wasm 也无法编译
function ttsPackMime(rel) {
  if (rel.endsWith('.js')) return 'text/javascript; charset=utf-8';
  if (rel.endsWith('.wasm')) return 'application/wasm';
  if (rel.endsWith('.txt')) return 'text/plain; charset=utf-8';
  return 'application/octet-stream'; // .onnx / .fst
}
// 收集离线引擎文件（按路径去重，避免带不同参数的重复 Request）
async function ttsPackCollect() {
  const cache = await caches.open(TTS_CACHE_NAME);
  const keys = await cache.keys();
  const seen = {}; const list = [];
  for (const req of keys) {
    const u = new URL(req.url);
    if (!ttsPackWanted(u.pathname) || seen[u.pathname]) continue;
    seen[u.pathname] = 1;
    list.push(req);
  }
  return { cache, list };
}
// 统计离线包已缓存情况（文件数、大小MB）
async function ttsPackStats() {
  if (!('caches' in window)) return { count: 0, mb: 0 };
  try {
    const { cache, list } = await ttsPackCollect();
    let bytes = 0;
    for (const req of list) { const r = await cache.match(req); if (r) bytes += (await r.arrayBuffer()).byteLength; }
    return { count: list.length, mb: Math.round(bytes / 1048576 * 10) / 10 };
  } catch (e) { return { count: 0, mb: 0 }; }
}
// 导出：把本 App 已下好的离线引擎打包成单个 .bqtts 文件，可发给微信/QQ另一端导入，免去重复下载
async function ttsExportPack() {
  if (!('caches' in window)) { showToast('当前浏览器不支持离线包导出'); return; }
  const st = await ttsPackStats();
  if (st.count < 8) { showToast('离线引擎还没下好（当前' + st.count + '个文件），请先用一次离线引擎再导出'); return; }
  showToast('正在打包离线语音包（约' + st.mb + 'MB）…');
  ensureFflate(async function (ff) {
    try {
      const { cache, list } = await ttsPackCollect();
      const files = {};
      for (const req of list) {
        const u = new URL(req.url);
        const i = u.pathname.indexOf('/tts/');
        const rel = u.pathname.slice(i + 1);                 // 形如 tts/model/model.onnx
        const resp = await cache.match(req);
        files[rel] = new Uint8Array(await resp.arrayBuffer());
      }
      const zipped = ff.zipSync(files, { level: 0 });        // 仅存储不压缩，快
      const blob = new Blob([zipped], { type: 'application/octet-stream' });
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = 'biquge-tts-pack.bqtts';
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(function () { URL.revokeObjectURL(a.href); }, 4000);
      showToast('离线语音包已导出（' + list.length + '个文件），把该文件发到另一个 App 点“导入”即可共用');
    } catch (e) { showToast('导出失败：' + (e.message || e)); }
  });
}
// 导入：选择 .bqtts 文件，解压写回本 App 的离线缓存，之后离线引擎直接命中、无需联网下载
function ttsImportPackClick() {
  let inp = document.getElementById('ttsPackFileInput');
  if (!inp) {
    inp = document.createElement('input');
    inp.type = 'file'; inp.id = 'ttsPackFileInput'; inp.accept = '.bqtts,.zip';
    inp.style.display = 'none';
    inp.onchange = function () { const f = inp.files && inp.files[0]; if (f) ttsImportPack(f); inp.value = ''; };
    document.body.appendChild(inp);
  }
  inp.click();
}
async function ttsImportPack(file) {
  if (!file) return;
  if (!('caches' in window)) { showToast('当前浏览器不支持离线包导入'); return; }
  showToast('正在导入离线语音包…');
  ensureFflate(async function (ff) {
    try {
      const buf = await file.arrayBuffer();
      const files = ff.unzipSync(new Uint8Array(buf));
      const cache = await caches.open(TTS_CACHE_NAME);
      let n = 0;
      for (const rel in files) {
        if (!ttsPackWanted('/' + rel)) continue;             // 只接受离线引擎白名单文件
        const url = new URL(rel, location.href).href;       // 以当前页面目录为基还原成同源绝对 URL
        await cache.put(new Request(url), new Response(files[rel], { headers: { 'Content-Type': ttsPackMime(rel) } }));
        n++;
      }
      if (n < 8) { showToast('文件里离线引擎不完整（仅' + n + '项），请重新导出'); return; }
      ttsPersistStorage();
      showToast('离线语音包导入成功（' + n + ' 个文件），已可离线使用');
      // 若当前有残留的失败 worker，重置后静默验证一次
      try { if (off.state === 'error') { off.worker = null; } ttsOfflineEnsure(true); } catch (e) {}
    } catch (e) { showToast('导入失败，请确认是本阅读器导出的 .bqtts 文件：' + (e.message || e)); }
  });
}

// 独立录音器：单纯录音 → 试听 → 保存到手机(下载) / 系统分享(可选择微信、QQ 等)
const recS = { mr: null, stream: null, chunks: [], blob: null, url: null, mime: '', timer: null, sec: 0, audio: null };
function recSSupported() {
  return !!(navigator.mediaDevices && navigator.mediaDevices.getUserMedia && window.MediaRecorder);
}
function recSFmt(s) { s = Math.max(0, Math.floor(s)); return ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + (s % 60)).slice(-2); }
function recSExt() {
  if (recS.mime.indexOf('mp4') >= 0) return 'm4a';
  if (recS.mime.indexOf('ogg') >= 0) return 'ogg';
  return 'webm';
}
function recSName() {
  const d = new Date(), p = n => ('0' + n).slice(-2);
  return '录音_' + d.getFullYear() + p(d.getMonth() + 1) + p(d.getDate()) + '_' + p(d.getHours()) + p(d.getMinutes()) + p(d.getSeconds()) + '.' + recSExt();
}
function openStandaloneRecorder() {
  closeReaderMore();
  const ok = recSSupported();
  ttsEl('recSMask', 'tts-help-mask',
    '<div class="tts-help-card" style="max-width:420px;">' +
      '<div class="tts-help-title">🎤 录音</div>' +
      '<div class="clone-hint">录一段声音，可试听、保存到手机（下载到本地/“下载”目录，也可在系统面板选录音软件或 QQ 浏览器打开保存），或通过系统分享发送给微信/QQ 好友（在弹出面板里选择，可逐个多选联系人）。录音只在本机处理。</div>' +
      (ok ? '' : '<div class="clone-hint" style="color:#c0504d;">当前浏览器不支持网页录音，请用系统浏览器（Chrome/Edge/Safari）或更新微信。</div>') +
      '<div class="clone-timer" id="recSTimer">00:00</div>' +
      '<div class="clone-status" id="recSStatus">尚未录制</div>' +
      '<div id="recSPreview"></div>' +
      '<div class="clone-btns">' +
        '<button class="clone-btn primary" id="recSBtn" onclick="recSToggle()">● 开始录音</button>' +
        '<button class="clone-btn" id="recSPlay" onclick="recSPlay()" disabled>▶ 试听</button>' +
        '<button class="clone-btn" id="recSSave" onclick="recSDownload()" disabled>💾 保存到手机</button>' +
        '<button class="clone-btn" id="recSShare" onclick="recSShare()" disabled>📤 分享</button>' +
        '<button class="clone-btn" onclick="closeStandaloneRecorder()">关闭</button>' +
      '</div>' +
    '</div>');
  const m = document.getElementById('recSMask');
  m.onclick = function (e) { if (e.target === m) closeStandaloneRecorder(); };
  if (!ok) { const b = document.getElementById('recSBtn'); if (b) b.disabled = true; }
  m.classList.add('show');
}
function closeStandaloneRecorder() {
  const m = document.getElementById('recSMask'); if (m) m.classList.remove('show');
  recSStopStream();
}
function recSSetStatus(t, isRec) { const el = document.getElementById('recSStatus'); if (el) { el.textContent = t; el.className = 'clone-status' + (isRec ? ' rec' : ''); } }
function recSRefresh() {
  const has = !!recS.blob;
  ['recSPlay', 'recSSave', 'recSShare'].forEach(function (id) { const b = document.getElementById(id); if (b) b.disabled = !has; });
  const w = document.getElementById('recSPreview');
  if (w && recS.url) w.innerHTML = '<audio class="clone-audio" controls src="' + recS.url + '"></audio>';
}
function recSStopStream() {
  if (recS.timer) { clearInterval(recS.timer); recS.timer = null; }
  try { if (recS.mr && recS.mr.state !== 'inactive') recS.mr.stop(); } catch (e) {}
  try { (recS.stream || { getTracks: () => [] }).getTracks().forEach(t => t.stop()); } catch (e) {}
  recS.stream = null;
}
async function recSToggle() {
  if (recS.mr && recS.mr.state === 'recording') { recSStopOnly(); return; }
  try {
    recS.stream = await navigator.mediaDevices.getUserMedia({ audio: { echoCancellation: true, noiseSuppression: true } });
    let mime = '';
    ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].forEach(c => {
      if (!mime && MediaRecorder.isTypeSupported && MediaRecorder.isTypeSupported(c)) mime = c;
    });
    recS.chunks = []; recS.sec = 0;
    recS.mr = mime ? new MediaRecorder(recS.stream, { mimeType: mime }) : new MediaRecorder(recS.stream);
    recS.mime = recS.mr.mimeType || mime || 'audio/webm';
    recS.mr.ondataavailable = e => { if (e.data && e.data.size > 0) recS.chunks.push(e.data); };
    recS.mr.onstop = function () {
      recS.blob = new Blob(recS.chunks, { type: recS.mime || 'audio/webm' });
      if (recS.url) URL.revokeObjectURL(recS.url);
      recS.url = URL.createObjectURL(recS.blob);
      recSSetStatus('录制完成（' + recSFmt(recS.sec) + '），可试听 / 保存 / 分享', false);
      recSRefresh();
    };
    recS.mr.start(250);
    recS.timer = setInterval(() => { recS.sec += 0.25; const t = document.getElementById('recSTimer'); if (t) t.textContent = recSFmt(recS.sec); }, 250);
    const b = document.getElementById('recSBtn'); if (b) { b.textContent = '■ 停止'; b.classList.remove('primary'); }
    recSSetStatus('正在录音…再次点击停止', true);
  } catch (err) {
    recSSetStatus('无法使用麦克风：' + (err && err.message ? err.message : '权限被拒绝'), false);
  }
}
function recSStopOnly() {
  try { if (recS.mr) recS.mr.stop(); } catch (e) {}
  recSStopStream();
  const b = document.getElementById('recSBtn'); if (b) { b.textContent = '● 重新录制'; b.classList.add('primary'); }
  const t = document.getElementById('recSTimer'); if (t) t.textContent = recSFmt(recS.sec);
}
function recSPlay() { if (!recS.url) return; if (recS.audio) { try { recS.audio.pause(); } catch (e) {} } recS.audio = new Audio(recS.url); recS.audio.play().catch(() => {}); }
function recSDownload() {
  if (!recS.blob) return;
  const a = document.createElement('a');
  a.href = recS.url; a.download = recSName();
  document.body.appendChild(a); a.click(); setTimeout(() => a.remove(), 1000);
  recSSetStatus('已触发保存，请在手机提示中选择保存位置/录音软件/浏览器', false);
}
async function recSShare() {
  if (!recS.blob) return;
  const file = new File([recS.blob], recSName(), { type: recS.mime || 'audio/webm' });
  try {
    if (navigator.canShare && navigator.canShare({ files: [file] })) {
      await navigator.share({ files: [file], title: '录音分享' });
    } else if (navigator.share) {
      await navigator.share({ title: '录音', text: '我的录音（当前环境不支持直接分享文件，已改为先保存再到微信/QQ 发送）' });
      recSDownload();
    } else {
      recSSetStatus('当前环境不支持系统分享，已改为保存到手机，可到微信/QQ 手动发送', false);
      recSDownload();
    }
  } catch (e) { /* 用户取消分享，忽略 */ }
}

// ==================== B1 本地账号锁（手机号+强密码；纯本机，不联网、不跨设备、不发短信） ====================
const AUTH_KEY = 'biquge_account', AUTH_SESSION = 'biquge_auth_session';
let authTab = 'login';
function authGet() { try { return JSON.parse(localStorage.getItem(AUTH_KEY) || 'null'); } catch (e) { return null; } }
function authSetSession(phone) { try { localStorage.setItem(AUTH_SESSION, phone); } catch (e) {} }
function authClearSession() { try { localStorage.removeItem(AUTH_SESSION); } catch (e) {} }
async function authHash(password, salt) {
  const enc = new TextEncoder();
  const data = enc.encode('biquge|' + salt + '|' + password);
  const buf = await crypto.subtle.digest('SHA-256', data);
  return Array.from(new Uint8Array(buf)).map(b => b.toString(16).padStart(2, '0')).join('');
}
function authRandSalt() {
  const a = new Uint8Array(16);
  (crypto.getRandomValues ? crypto.getRandomValues(a) : a.fill(1));
  return Array.from(a).map(b => b.toString(16).padStart(2, '0')).join('');
}
function authPhoneOk(p) { return /^1[3-9]\d{9}$/.test(p); }
function authPwdCheck(p) {
  return {
    len: p.length >= 8,
    lower: /[a-z]/.test(p),
    upper: /[A-Z]/.test(p),
    digit: /[0-9]/.test(p),
    special: /[^A-Za-z0-9]/.test(p)
  };
}
function authPwdOk(c) { return c.len && c.lower && c.upper && c.digit && c.special; }
function authMaskPhone(p) { return p.length === 11 ? p.slice(0, 3) + '****' + p.slice(7) : p; }

function authBuildDom() {
  if (document.getElementById('authLock')) return;
  const lock = document.createElement('div');
  lock.id = 'authLock';
  lock.className = 'auth-lock';
  lock.innerHTML =
    '<div class="auth-card">' +
      '<div class="auth-logo">📖</div>' +
      '<div class="auth-brand">墨渊阁</div>' +
      '<div class="auth-sub" id="authSub">登录后继续阅读</div>' +
      '<div class="auth-tabs">' +
        '<div class="auth-tab active" data-tab="login" onclick="authSwitchTab(\'login\')">登录</div>' +
        '<div class="auth-tab" data-tab="register" onclick="authSwitchTab(\'register\')">注册</div>' +
      '</div>' +
      '<input class="auth-input" id="authPhone" type="tel" maxlength="11" inputmode="numeric" placeholder="请输入手机号" autocomplete="username">' +
      '<input class="auth-input" id="authPwd" type="password" placeholder="请输入密码" autocomplete="current-password">' +
      '<input class="auth-input" id="authPwd2" type="password" placeholder="再次输入密码" autocomplete="new-password" style="display:none;">' +
      '<div class="auth-strength" id="authStrength"></div>' +
      '<div class="auth-msg" id="authMsg"></div>' +
      '<button class="auth-primary" id="authPrimary" onclick="authSubmit()">登录</button>' +
      '<div class="auth-foot">' +
        '<span class="auth-link" id="authForgot" onclick="authForgot()">忘记密码？</span>' +
        '<span class="auth-link" id="authSwitch" onclick="authSwitchTab(\'register\')">注册新账号</span>' +
      '</div>' +
      '<div class="auth-note">本机账号锁：密码加盐加密后仅保存在本设备，不联网、不跨设备，也不会发送短信。</div>' +
    '</div>';
  document.body.appendChild(lock);
  const pwd = document.getElementById('authPwd');
  pwd.addEventListener('input', function () {
    const c = authPwdCheck(pwd.value || '');
    const el = document.getElementById('authStrength');
    const items = [['len', '≥8位'], ['lower', '小写'], ['upper', '大写'], ['digit', '数字'], ['special', '特殊符']];
    el.innerHTML = items.map(it => '<span class="' + (c[it[0]] ? 'ok' : '') + '">' + it[1] + '</span>').join('');
  });
}
function authShow() { authBuildDom(); const l = document.getElementById('authLock'); if (l) l.classList.add('show'); }
function authHide() { const l = document.getElementById('authLock'); if (l) l.classList.remove('show'); }
function authSwitchTab(tab) {
  authTab = tab;
  document.querySelectorAll('.auth-tab').forEach(el => el.classList.toggle('active', el.dataset.tab === tab));
  document.getElementById('authPwd2').style.display = tab === 'register' ? '' : 'none';
  document.getElementById('authPrimary').textContent = tab === 'register' ? '注册并进入' : '登录';
  document.getElementById('authSub').textContent = tab === 'register' ? '创建本机账号' : '登录后继续阅读';
  document.getElementById('authSwitch').style.display = tab === 'register' ? 'none' : '';
  document.getElementById('authForgot').style.display = tab === 'register' ? 'none' : '';
  authSetMsg('');
}
function authSetMsg(t, bad) {
  const el = document.getElementById('authMsg');
  if (!el) return;
  el.textContent = t || '';
  el.className = 'auth-msg' + (bad ? ' bad' : '');
}
async function authSubmit() {
  const phone = (document.getElementById('authPhone').value || '').trim();
  const pwd = document.getElementById('authPwd').value || '';
  const pwd2 = document.getElementById('authPwd2').value || '';
  if (!authPhoneOk(phone)) return authSetMsg('请输入正确的 11 位手机号', true);
  const acc = authGet();
  if (authTab === 'register') {
    const c = authPwdCheck(pwd);
    if (!authPwdOk(c)) return authSetMsg('密码必须至少8位，并同时包含大写、小写、数字、特殊符号', true);
    if (pwd !== pwd2) return authSetMsg('两次输入的密码不一致', true);
    if (acc && !confirm('本机已存在账号 ' + authMaskPhone(acc.phone) + '，继续将覆盖原账号（书架/导入的书不受影响）。确定？')) return;
    const salt = authRandSalt();
    const hash = await authHash(pwd, salt);
    try { localStorage.setItem(AUTH_KEY, JSON.stringify({ phone: phone, salt: salt, hash: hash, createdAt: Date.now() })); } catch (e) {}
    authSetSession(phone);
    authHide();
    showToast('注册成功，已进入');
  } else {
    if (!acc) return authSetMsg('尚未注册，请切换到“注册”创建账号', true);
    if (phone !== acc.phone) return authSetMsg('手机号与本机注册账号不一致', true);
    const hash = await authHash(pwd, acc.salt);
    if (hash !== acc.hash) return authSetMsg('密码错误，请重试（忘记密码可点下方重置）', true);
    authSetSession(phone);
    authHide();
    showToast('登录成功');
  }
}
function authForgot() {
  const acc = authGet();
  if (!acc) { authSwitchTab('register'); return; }
  if (confirm('本机账号不联网、无法接收短信验证码，因此无法远程找回密码。\n\n点“确定”将清除本机账号 ' + authMaskPhone(acc.phone) + ' 并回到注册页重新设置密码（书架、进度、导入的 TXT 保留）。')) {
    try { localStorage.removeItem(AUTH_KEY); } catch (e) {}
    authClearSession();
    authSwitchTab('register');
    authSetMsg('旧账号已清除，请重新注册', false);
  }
}
function authLogout() {
  authClearSession();
  try { ttsStop(); } catch (e) {}
  authTab = 'login';
  authShow();
  authSwitchTab('login');
  navigate('home');
}
function authBoot() {
  authBuildDom();
  const acc = authGet();
  const session = (function () { try { return localStorage.getItem(AUTH_SESSION); } catch (e) { return null; } })();
  if (acc && session === acc.phone) authHide(); else { authSwitchTab('login'); authShow(); }
}

});

// PWA Service Worker 注册（离线语音引擎依赖它做持久缓存；file:// 下自动跳过）
// 策略：页面 HTML 由 SW 网络优先（保证首次即新版）；发现新 SW 立即接管并只自动刷新一次，避免“要手动刷新才到新版”
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function () {
    let refreshing = false;
    navigator.serviceWorker.addEventListener('controllerchange', function () {
      if (refreshing) return;
      refreshing = true;
      try { sessionStorage.setItem('biquge_sw_reloaded', '1'); } catch (e) {}
      location.reload();
    });
    navigator.serviceWorker.register('sw.js').then(function (reg) {
      const askSkip = function (sw) { try { sw && sw.postMessage({ type: 'SKIP_WAITING' }); } catch (e) {} };
      if (reg.waiting) askSkip(reg.waiting);
      reg.addEventListener('updatefound', function () {
        const nw = reg.installing;
        if (!nw) return;
        nw.addEventListener('statechange', function () {
          // installed 且已有控制器 => 这是“更新”，让它立刻接管（controllerchange 会触发一次刷新）
          if (nw.state === 'installed' && navigator.serviceWorker.controller) askSkip(nw);
        });
      });
      // 每 10 分钟后台查一次更新
      setInterval(function () { try { reg.update(); } catch (e) {} }, 10 * 60 * 1000);
    }).catch(function () {});
  });
}

<script>
// 源码保护：禁用右键、开发者工具快捷键、查看源码、保存页面
(function(){
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    var key = e.key.toLowerCase();
    if (key === 'f12') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) {
      e.preventDefault(); return;
    }
    if ((e.ctrlKey || e.metaKey) && key === 'u') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 's') { e.preventDefault(); return; }
  });
  document.addEventListener('selectstart', function(e){
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });

  // 内容保护：切后台/页面隐藏时用遮罩盖住正文（防系统任务缩略图、录屏切走瞬间）。
  // 注意：浏览器网页无法真正拦截系统截屏键，彻底禁止截图只有原生 App 能做到；此处为可实现的最强软防护。
  var shield = document.createElement('div');
  shield.className = 'bq-shot-shield';
  shield.innerHTML = '<div class="ico">🔒</div><div>内容已隐藏<br>返回页面即可继续阅读</div>';
  function bqShield(on){ shield.classList.toggle('show', !!on); }
  document.addEventListener('visibilitychange', function(){ bqShield(document.hidden); });
  window.addEventListener('pagehide', function(){ bqShield(true); });
  window.addEventListener('pageshow', function(){ bqShield(false); });
  (function mount(){ if (document.body) document.body.appendChild(shield); else setTimeout(mount, 60); })();
})();
</script>
