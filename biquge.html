<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<!-- 在线TTS(百度gettts)校验Referer：第三方页面带Referer会被返回空，全站不依赖Referer授权，故统一不发送，兼容手机流量/微信/X5 -->
<meta name="referrer" content="no-referrer">
<meta name="creative-medium" content="interactive-prototype">
<title>墨渊阁 - 免费小说阅读</title>
<style>
/* ========== CSS Variables & Themes ========== */
:root {
  --primary: #b8860b;
  --primary-light: #daa520;
  --primary-dark: #8b6914;
  --gold: #d4a84b;
  --gold-light: #e8c77a;
  --ink: #2c1810;
  --ink-light: #5a3e2b;
  --paper: #f5efe0;
  --paper-dark: #e8dcc8;
  --border: #d4c4a8;
  --shadow: rgba(139, 105, 20, 0.15);
  --bg-page: #faf6ed;
  --bg-card: #ffffff;
  --bg-secondary: #f5efe0;
  --text-primary: #2c1810;
  --text-secondary: #7a6248;
  --text-muted: #a89070;
  --tag-bg: #f0e6d0;
  --tag-text: #8b6914;
  --hover: #faf0d8;
  --hero-gradient: linear-gradient(135deg, #3a2817 0%, #6b4423 50%, #b8860b 100%);
  --reader-bg: #f5efe0;
  --reader-text: #2c1810;
  /* 字体体系 */
  --font-sans: "PingFang SC", "Microsoft YaHei", "Hiragino Sans GB", "Source Han Sans CN", "Noto Sans CJK SC", sans-serif;
  --font-serif: "Noto Serif SC", "Source Han Serif SC", "SimSun", "宋体", "NSimSun", serif;
  --font-kai: "STKaiti", "KaiTi", "楷体", "STFangsong", "FangSong", "仿宋", serif;
  --font-xingkai: "STXingkai", "华文行楷", "STKaiti", "KaiTi", "楷体", cursive;
  --font-lishu: "LiSu", "隶书", "STKaiti", "KaiTi", serif;
}

[data-theme="dark"] {
  --primary: #daa520;
  --primary-light: #e8c77a;
  --primary-dark: #b8860b;
  --gold: #d4a84b;
  --gold-light: #e8c77a;
  --ink: #e8dcc8;
  --ink-light: #c4b393;
  --paper: #1a1510;
  --paper-dark: #2a2318;
  --border: #3a3020;
  --shadow: rgba(0, 0, 0, 0.4);
  --bg-page: #0f0d08;
  --bg-card: #1a1510;
  --bg-secondary: #252015;
  --text-primary: #e8dcc8;
  --text-secondary: #a89070;
  --text-muted: #6b5d45;
  --tag-bg: #2a2318;
  --tag-text: #d4a84b;
  --hover: #2a2318;
  --hero-gradient: linear-gradient(135deg, #1a0f05 0%, #3d2510 50%, #8b6914 100%);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  font-family: var(--font-sans);
  background: var(--bg-page);
  color: var(--text-primary);
  line-height: 1.6;
  transition: background 0.3s, color 0.3s;
  min-height: 100vh;
}

a { color: inherit; text-decoration: none; }
button { font-family: inherit; cursor: pointer; border: none; background: none; color: inherit; }
ul, ol { list-style: none; }
img { max-width: 100%; display: block; }

/* ========== Header & Nav ========== */
.site-header {
  position: sticky;
  top: 0;
  z-index: 100;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  box-shadow: 0 2px 8px var(--shadow);
}

.header-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  align-items: center;
  gap: 20px;
  height: 64px;
}

.back-home-btn {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text-secondary);
  font-size: 16px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
  flex-shrink: 0;
}
.back-home-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.logo {
  font-family: var(--font-xingkai);
  font-size: 30px;
  font-weight: normal;
  color: var(--primary);
  text-shadow: 1px 1px 2px var(--shadow);
  white-space: nowrap;
  cursor: pointer;
  flex-shrink: 0;
  position: relative;
  letter-spacing: 2px;
}
.logo::after {
  content: "";
  position: absolute;
  bottom: 2px;
  left: 0;
  right: 0;
  height: 2px;
  background: linear-gradient(90deg, var(--gold-light), var(--gold), var(--gold-light));
  border-radius: 2px;
}

.search-box {
  flex: 1;
  max-width: 400px;
  position: relative;
}
.search-box input {
  width: 100%;
  padding: 8px 14px 8px 38px;
  border: 1px solid var(--border);
  border-radius: 20px;
  background: var(--bg-secondary);
  color: var(--text-primary);
  font-size: 14px;
  outline: none;
  transition: border-color 0.2s;
}
.search-box input:focus {
  border-color: var(--primary);
}
.search-icon {
  position: absolute;
  left: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 16px;
}
.search-clear {
  position: absolute;
  right: 12px;
  top: 50%;
  transform: translateY(-50%);
  color: var(--text-muted);
  font-size: 13px;
  cursor: pointer;
  width: 20px;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
  border-radius: 50%;
  background: var(--bg-secondary);
  opacity: 0.7;
  display: none;
  transition: opacity 0.2s;
}
.search-clear:hover { opacity: 1; color: var(--text-primary); }

.header-actions {
  display: flex;
  align-items: center;
  gap: 12px;
  flex-shrink: 0;
}

.theme-toggle {
  width: 36px;
  height: 36px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text-secondary);
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 16px;
  transition: all 0.2s;
}
.theme-toggle:hover {
  border-color: var(--primary);
  color: var(--primary);
}

.main-nav {
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
}
.nav-inner {
  max-width: 1200px;
  margin: 0 auto;
  padding: 0 20px;
  display: flex;
  gap: 4px;
}
.nav-item {
  padding: 12px 20px;
  font-size: 15px;
  color: var(--text-secondary);
  cursor: pointer;
  position: relative;
  transition: color 0.2s;
  white-space: nowrap;
}
.nav-item:hover { color: var(--primary); }
.nav-item.active {
  color: var(--primary);
  font-weight: 600;
}
.nav-item.active::after {
  content: "";
  position: absolute;
  bottom: -1px;
  left: 20px;
  right: 20px;
  height: 2px;
  background: var(--primary);
  border-radius: 2px;
}

/* ========== Main Content ========== */
.main-content {
  max-width: 1200px;
  margin: 0 auto;
  padding: 20px;
}

/* Hero Banner */
.hero-banner {
  background: var(--hero-gradient);
  border-radius: 12px;
  padding: 40px;
  margin-bottom: 24px;
  color: #fff;
  display: flex;
  align-items: center;
  gap: 30px;
  min-height: 200px;
  position: relative;
  overflow: hidden;
}
.hero-banner::before {
  content: "";
  position: absolute;
  top: -50%;
  right: -10%;
  width: 400px;
  height: 400px;
  background: radial-gradient(circle, rgba(255,215,0,0.15) 0%, transparent 70%);
  border-radius: 50%;
}
.hero-banner::after {
  content: "";
  position: absolute;
  bottom: -30%;
  left: 10%;
  width: 300px;
  height: 300px;
  background: radial-gradient(circle, rgba(255,215,0,0.1) 0%, transparent 70%);
  border-radius: 50%;
}
.hero-book-cover {
  flex-shrink: 0;
  width: 120px;
  height: 160px;
  border-radius: 6px;
  box-shadow: 0 8px 24px rgba(0,0,0,0.3);
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-family: var(--font-kai);
  font-weight: bold;
  text-align: center;
  padding: 10px;
  position: relative;
  z-index: 1;
  font-size: 18px;
  line-height: 1.3;
  letter-spacing: 1px;
}
.hero-book-cover small {
  font-size: 12px;
  font-weight: normal;
  opacity: 0.8;
  margin-top: 8px;
}
.hero-info {
  flex: 1;
  position: relative;
  z-index: 1;
}
.hero-tag {
  display: inline-block;
  padding: 2px 10px;
  background: rgba(255,215,0,0.3);
  border: 1px solid rgba(255,215,0,0.5);
  border-radius: 4px;
  font-size: 12px;
  margin-bottom: 10px;
  color: #ffd700;
}
.hero-title {
  font-size: 28px;
  font-weight: bold;
  font-family: var(--font-kai);
  margin-bottom: 8px;
  text-shadow: 0 2px 10px rgba(0,0,0,0.3);
  letter-spacing: 1px;
}
.hero-author {
  font-size: 14px;
  opacity: 0.85;
  margin-bottom: 12px;
}
.hero-desc {
  font-size: 14px;
  opacity: 0.9;
  line-height: 1.6;
  display: -webkit-box;
  -webkit-line-clamp: 2;
  -webkit-box-orient: vertical;
  overflow: hidden;
  max-width: 500px;
}
.hero-btn {
  display: inline-block;
  margin-top: 16px;
  padding: 10px 28px;
  background: var(--gold);
  color: #2c1810;
  font-weight: bold;
  border-radius: 24px;
  font-size: 14px;
  transition: all 0.2s;
  cursor: pointer;
}
.hero-btn:hover {
  background: var(--gold-light);
  transform: translateY(-1px);
  box-shadow: 0 4px 12px rgba(255,215,0,0.3);
}

/* Section */
.section {
  margin-bottom: 28px;
}
.section-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 16px;
}
.section-title {
  font-size: 20px;
  font-weight: bold;
  font-family: var(--font-kai);
  color: var(--text-primary);
  position: relative;
  padding-left: 14px;
  letter-spacing: 1px;
}
.section-title::before {
  content: "";
  position: absolute;
  left: 0;
  top: 50%;
  transform: translateY(-50%);
  width: 4px;
  height: 20px;
  background: linear-gradient(180deg, var(--gold-light), var(--primary));
  border-radius: 2px;
}
.section-more {
  font-size: 13px;
  color: var(--text-muted);
  cursor: pointer;
  transition: color 0.2s;
}
.section-more:hover { color: var(--primary); }

/* Book Grid */
.book-grid {
  display: grid;
  grid-template-columns: repeat(6, 1fr);
  gap: 16px;
}
.book-card {
  cursor: pointer;
  transition: transform 0.2s;
}
.book-card:hover {
  transform: translateY(-3px);
}
.book-card:hover .book-title {
  color: var(--primary);
}
.book-cover {
  width: 100%;
  aspect-ratio: 3 / 4;
  border-radius: 6px;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  padding: 12px 8px;
  text-align: center;
  font-family: var(--font-kai);
  font-size: 17px;
  font-weight: bold;
  line-height: 1.2;
  box-shadow: 0 4px 12px var(--shadow);
  margin-bottom: 8px;
  position: relative;
  overflow: hidden;
  letter-spacing: 1px;
}
.book-cover small {
  font-size: 11px;
  font-weight: normal;
  opacity: 0.8;
  margin-top: 6px;
  display: block;
}
.book-cover::after {
  content: "";
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  background: linear-gradient(135deg, rgba(255,255,255,0.1) 0%, transparent 50%);
  pointer-events: none;
}
.book-title {
  font-size: 14px;
  font-weight: 600;
  font-family: var(--font-kai);
  color: var(--text-primary);
  margin-bottom: 2px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  transition: color 0.2s;
  letter-spacing: 0.5px;
}
.book-author {
  font-size: 12px;
  color: var(--text-muted);
}
.book-meta {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-top: 4px;
  font-size: 11px;
  color: var(--text-muted);
}
.book-rating {
  color: var(--gold);
  font-weight: bold;
}

/* ========== Bookshelf Page ========== */
.bookshelf-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 20px;
}
.bookshelf-title {
  font-size: 22px;
  font-weight: bold;
  font-family: var(--font-kai);
  letter-spacing: 1px;
}
.bookshelf-count {
  font-size: 13px;
  color: var(--text-muted);
}

/* Shelf Tabs */
.shelf-tabs {
  display: flex;
  gap: 4px;
  margin-bottom: 20px;
  border-bottom: 1px solid var(--border);
}
.shelf-tab {
  padding: 10px 20px;
  font-size: 15px;
  color: var(--text-secondary);
  cursor: pointer;
  position: relative;
  transition: color 0.2s;
  background: none;
  border: none;
  border-bottom: 2px solid transparent;
  margin-bottom: -1px;
  font-family: inherit;
}
.shelf-tab:hover { color: var(--primary); }
.shelf-tab.active {
  color: var(--primary);
  font-weight: 600;
  border-bottom-color: var(--primary);
}
.shelf-tab-count {
  font-size: 12px;
  color: var(--text-muted);
  margin-left: 4px;
}
.shelf-tab.active .shelf-tab-count { color: var(--primary); }

/* Shelf book card with remove button */
.shelf-book-wrapper {
  position: relative;
}
.shelf-remove-btn {
  position: absolute;
  top: -6px;
  right: -6px;
  width: 24px;
  height: 24px;
  border-radius: 50%;
  background: rgba(0,0,0,0.6);
  color: #fff;
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
  z-index: 2;
  opacity: 0;
  transition: opacity 0.2s, background 0.2s;
  border: none;
  line-height: 1;
  padding: 0;
}
.shelf-book-wrapper:hover .shelf-remove-btn { opacity: 1; }
.shelf-remove-btn:hover { background: #e74c3c; }

.shelf-badges {
  display: flex;
  gap: 4px;
  margin-top: 4px;
  flex-wrap: wrap;
}
.shelf-badge {
  font-size: 10px;
  padding: 1px 6px;
  border-radius: 4px;
  line-height: 1.4;
}
.shelf-badge.fav { background: #fff3cd; color: #856404; }
.shelf-badge.like { background: #f8d7da; color: #c0392b; }
.shelf-badge.src { background: #e8f5e9; color: #2e7d32; }
[data-theme="dark"] .shelf-badge.fav { background: #3d3416; color: #e8c77a; }
[data-theme="dark"] .shelf-badge.like { background: #3d1a1a; color: #e88a8a; }
[data-theme="dark"] .shelf-badge.src { background: #1a3d1a; color: #8ae88a; }

/* Shelf toolbar */
.shelf-toolbar {
  display: flex;
  justify-content: flex-end;
  gap: 10px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.shelf-tool-btn {
  padding: 8px 16px;
  border: 1px solid var(--border);
  border-radius: 6px;
  background: var(--bg-card);
  color: var(--text-secondary);
  font-size: 13px;
  cursor: pointer;
  transition: all 0.2s;
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
}
.shelf-tool-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}

/* Icon action buttons */
.btn-icon {
  padding: 10px 16px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid var(--border);
  background: transparent;
  color: var(--text-primary);
  display: inline-flex;
  align-items: center;
  gap: 6px;
  font-family: inherit;
}
.btn-icon:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.btn-icon.active-fav {
  background: #fff3cd;
  border-color: #d4a84b;
  color: #856404;
}
.btn-icon.active-like {
  background: #f8d7da;
  border-color: #e74c3c;
  color: #c0392b;
}
[data-theme="dark"] .btn-icon.active-fav { background: #3d3416; color: #e8c77a; }
[data-theme="dark"] .btn-icon.active-like { background: #3d1a1a; color: #e88a8a; }

.empty-state {
  text-align: center;
  padding: 80px 20px;
  color: var(--text-muted);
}
.empty-icon {
  font-size: 64px;
  margin-bottom: 16px;
  opacity: 0.3;
}
.empty-text {
  font-size: 16px;
  margin-bottom: 8px;
  color: var(--text-secondary);
}
.empty-hint {
  font-size: 13px;
  margin-bottom: 20px;
}
.empty-btn {
  display: inline-block;
  padding: 10px 28px;
  background: var(--primary);
  color: #fff;
  border-radius: 24px;
  font-size: 14px;
  cursor: pointer;
  transition: background 0.2s;
}
.empty-btn:hover { background: var(--primary-light); }

/* ========== Category Page ========== */
.category-grid {
  display: grid;
  grid-template-columns: repeat(4, 1fr);
  gap: 16px;
  margin-bottom: 24px;
}
.category-card {
  padding: 24px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 10px;
  text-align: center;
  cursor: pointer;
  transition: all 0.2s;
}
.category-card:hover {
  border-color: var(--primary);
  transform: translateY(-2px);
  box-shadow: 0 6px 16px var(--shadow);
}
.category-card.active {
  border-color: var(--primary);
  background: var(--tag-bg);
}
.category-icon {
  font-size: 32px;
  margin-bottom: 8px;
}
.category-name {
  font-size: 16px;
  font-weight: 600;
  font-family: var(--font-kai);
  color: var(--text-primary);
  letter-spacing: 1px;
}
.category-count {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ========== Ranking Page ========== */
.ranking-list {
  background: var(--bg-card);
  border-radius: 10px;
  border: 1px solid var(--border);
  overflow: hidden;
}
.ranking-item {
  display: flex;
  align-items: center;
  gap: 16px;
  padding: 14px 20px;
  border-bottom: 1px solid var(--border);
  cursor: pointer;
  transition: background 0.2s;
}
.ranking-item:last-child { border-bottom: none; }
.ranking-item:hover { background: var(--hover); }

.rank-num {
  width: 32px;
  text-align: center;
  font-size: 18px;
  font-weight: bold;
  color: var(--text-muted);
  flex-shrink: 0;
}
.rank-num.gold { color: #ffd700; text-shadow: 0 0 8px rgba(255,215,0,0.5); }
.rank-num.silver { color: #c0c0c0; text-shadow: 0 0 8px rgba(192,192,192,0.5); }
.rank-num.bronze { color: #cd7f32; text-shadow: 0 0 8px rgba(205,127,50,0.5); }

.rank-cover {
  width: 48px;
  height: 64px;
  border-radius: 4px;
  flex-shrink: 0;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-family: var(--font-kai);
  font-size: 11px;
  font-weight: bold;
  text-align: center;
  padding: 4px;
  line-height: 1.1;
}
.rank-info {
  flex: 1;
  min-width: 0;
}
.rank-title {
  font-size: 15px;
  font-weight: 600;
  font-family: var(--font-kai);
  color: var(--text-primary);
  margin-bottom: 4px;
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: 0.5px;
}
.rank-meta {
  font-size: 12px;
  color: var(--text-muted);
  display: flex;
  gap: 12px;
}
.rank-hot {
  font-size: 13px;
  color: var(--primary);
  font-weight: 600;
  flex-shrink: 0;
}

/* ========== Search Page ========== */
.search-header {
  margin-bottom: 20px;
}
.search-query {
  font-size: 18px;
  color: var(--text-secondary);
}
.search-query strong {
  color: var(--primary);
}
.search-count {
  font-size: 13px;
  color: var(--text-muted);
  margin-top: 4px;
}

/* ========== Detail Page ========== */
.detail-container {
  background: var(--bg-card);
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 30px;
  margin-bottom: 20px;
}
.detail-top {
  display: flex;
  gap: 24px;
  margin-bottom: 24px;
}
.detail-cover {
  width: 160px;
  height: 210px;
  border-radius: 8px;
  flex-shrink: 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  color: #fff;
  font-family: var(--font-kai);
  font-size: 20px;
  font-weight: bold;
  text-align: center;
  padding: 16px;
  line-height: 1.3;
  box-shadow: 0 8px 24px var(--shadow);
  letter-spacing: 1px;
}
.detail-cover small {
  font-size: 13px;
  font-weight: normal;
  opacity: 0.85;
  margin-top: 10px;
}

.detail-main { flex: 1; min-width: 0; }
.detail-title {
  font-size: 26px;
  font-weight: bold;
  font-family: var(--font-kai);
  color: var(--text-primary);
  margin-bottom: 8px;
  letter-spacing: 1px;
}
.detail-author {
  font-size: 15px;
  color: var(--text-secondary);
  margin-bottom: 12px;
}
.detail-tags {
  display: flex;
  flex-wrap: wrap;
  gap: 8px;
  margin-bottom: 14px;
}
.tag {
  display: inline-block;
  padding: 3px 10px;
  background: var(--tag-bg);
  color: var(--tag-text);
  border-radius: 4px;
  font-size: 12px;
}
.tag-clickable {
  cursor: pointer;
  user-select: none;
  border: 1px solid transparent;
  transition: transform .12s ease, box-shadow .12s ease, background .12s ease;
}
.tag-clickable:hover {
  transform: translateY(-1px);
  box-shadow: 0 2px 6px rgba(0,0,0,.12);
  background: var(--primary);
  color: #fff;
}
.tag-clickable:active { transform: translateY(0); }
.detail-stats {
  display: flex;
  gap: 24px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.stat-item {
  text-align: center;
}
.stat-value {
  font-size: 18px;
  font-weight: bold;
  color: var(--primary);
}
.stat-label {
  font-size: 12px;
  color: var(--text-muted);
  margin-top: 2px;
}
.detail-actions {
  display: flex;
  gap: 12px;
  margin-bottom: 16px;
  flex-wrap: wrap;
}
.btn {
  padding: 10px 24px;
  border-radius: 6px;
  font-size: 14px;
  font-weight: 500;
  cursor: pointer;
  transition: all 0.2s;
  border: 1px solid transparent;
  display: inline-flex;
  align-items: center;
  gap: 6px;
}
.btn-primary {
  background: var(--primary);
  color: #fff;
}
.btn-primary:hover { background: var(--primary-light); }
.btn-outline {
  background: transparent;
  border-color: var(--border);
  color: var(--text-primary);
}
.btn-outline:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.btn-added {
  background: var(--tag-bg);
  color: var(--tag-text);
  border-color: var(--primary);
}

.detail-desc-section {
  margin-top: 8px;
}
.detail-desc-title {
  font-size: 16px;
  font-weight: 600;
  font-family: var(--font-kai);
  margin-bottom: 10px;
  color: var(--text-primary);
  letter-spacing: 1px;
}
.detail-desc {
  font-size: 14px;
  line-height: 1.8;
  font-family: var(--font-serif);
  color: var(--text-secondary);
  overflow: hidden;
  transition: max-height 0.3s;
}
.detail-desc.collapsed {
  display: -webkit-box;
  -webkit-line-clamp: 3;
  -webkit-box-orient: vertical;
}
.desc-toggle {
  color: var(--primary);
  font-size: 13px;
  cursor: pointer;
  margin-top: 6px;
  display: inline-block;
}

/* Chapter List */
.chapter-section {
  background: var(--bg-card);
  border-radius: 10px;
  border: 1px solid var(--border);
  padding: 20px 30px;
  margin-bottom: 20px;
}
.chapter-section-header {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
}
.chapter-section-title {
  font-size: 18px;
  font-weight: 600;
  font-family: var(--font-kai);
  letter-spacing: 1px;
}
.chapter-toggle {
  font-size: 13px;
  color: var(--primary);
  cursor: pointer;
}
.latest-chapters {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 8px 24px;
}
.chapter-item {
  padding: 8px 0;
  border-bottom: 1px dashed var(--border);
  font-size: 14px;
  font-family: var(--font-kai);
  color: var(--text-secondary);
  cursor: pointer;
  display: flex;
  justify-content: space-between;
  align-items: center;
  transition: color 0.2s;
  letter-spacing: 0.5px;
}
.chapter-item:hover { color: var(--primary); }
.chapter-item:last-child { border-bottom: none; }
.chapter-item span {
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
}
.chapter-num {
  font-size: 12px;
  color: var(--text-muted);
}

.all-chapters-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 4px 24px;
  max-height: 400px;
  overflow-y: auto;
  padding-right: 10px;
}
.all-chapters-grid .chapter-item {
  padding: 6px 0;
  font-size: 13px;
}

/* scrollbar */
.all-chapters-grid::-webkit-scrollbar { width: 6px; }
.all-chapters-grid::-webkit-scrollbar-track { background: var(--bg-secondary); border-radius: 3px; }
.all-chapters-grid::-webkit-scrollbar-thumb { background: var(--border); border-radius: 3px; }
.all-chapters-grid::-webkit-scrollbar-thumb:hover { background: var(--text-muted); }

/* ========== Reader ========== */
.reader {
  position: fixed;
  top: 0;
  left: 0;
  right: 0;
  bottom: 0;
  z-index: 200;
  background: var(--reader-bg);
  color: var(--reader-text);
  display: flex;
  flex-direction: column;
  transition: background 0.3s, color 0.3s;
}
.reader-header {
  display: flex;
  align-items: center;
  padding: 12px 20px;
  background: var(--bg-card);
  border-bottom: 1px solid var(--border);
  transition: transform 0.3s, opacity 0.3s;
  flex-shrink: 0;
}
.reader-header.hidden {
  transform: translateY(-100%);
  opacity: 0;
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
}
.reader-back {
  height: 36px;
  padding: 0 16px;
  border-radius: 18px;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 6px;
  font-size: 14px;
  font-family: var(--font-sans);
  white-space: nowrap;
  flex-shrink: 0;
  color: var(--text-secondary);
  cursor: pointer;
  transition: background 0.2s;
}
.reader-back:hover { background: var(--hover); }
.reader-book-title {
  flex: 1;
  text-align: center;
  font-size: 16px;
  font-weight: 600;
  font-family: var(--font-kai);
  color: var(--text-primary);
  overflow: hidden;
  text-overflow: ellipsis;
  white-space: nowrap;
  letter-spacing: 1px;
}
.reader-chapter-btn {
  font-size: 13px;
  color: var(--primary);
  cursor: pointer;
}

.reader-content {
  flex: 1;
  overflow-y: auto;
  padding: 30px 20px;
  max-width: 720px;
  margin: 0 auto;
  width: 100%;
  cursor: pointer;
}
.reader-chapter-title {
  font-size: 22px;
  font-weight: bold;
  font-family: var(--font-kai);
  text-align: center;
  margin-bottom: 24px;
  color: var(--reader-text);
  letter-spacing: 2px;
  position: relative;
  padding-bottom: 16px;
}
.reader-chapter-title::after {
  content: "";
  position: absolute;
  bottom: 0;
  left: 50%;
  transform: translateX(-50%);
  width: 60px;
  height: 2px;
  background: linear-gradient(90deg, transparent, var(--primary), transparent);
  border-radius: 1px;
}
.reader-text {
  font-size: 18px;
  line-height: 2;
  text-indent: 2em;
  color: var(--reader-text);
  font-family: var(--font-serif);
}
.reader-text p {
  margin-bottom: 1em;
}

.reader-footer {
  background: var(--bg-card);
  border-top: 1px solid var(--border);
  padding: 12px 20px;
  transition: transform 0.3s, opacity 0.3s;
  flex-shrink: 0;
}
.reader-footer.hidden {
  transform: translateY(100%);
  opacity: 0;
  position: absolute;
  bottom: 0;
  left: 0;
  right: 0;
}
.reader-nav {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 12px;
  margin-bottom: 10px;
}
.reader-nav-btn {
  padding: 6px 18px;
  border: 1px solid var(--border);
  border-radius: 4px;
  font-size: 13px;
  color: var(--text-secondary);
  cursor: pointer;
  transition: all 0.2s;
  background: var(--bg-secondary);
}
.reader-nav-btn:hover:not(:disabled) {
  border-color: var(--primary);
  color: var(--primary);
}
.reader-nav-btn:disabled {
  opacity: 0.4;
  cursor: not-allowed;
}
.reader-progress-wrap {
  flex: 1;
  text-align: center;
  position: relative;
  height: 20px;
  display: flex;
  align-items: center;
  justify-content: center;
}
.reader-progress-bar {
  position: absolute;
  left: 0;
  top: 50%;
  height: 4px;
  background: var(--primary);
  opacity: 0.6;
  border-radius: 2px;
  transform: translateY(-50%);
  transition: width 0.3s;
}
.reader-progress-text {
  position: relative;
  z-index: 1;
  font-size: 12px;
  color: var(--text-muted);
  background: var(--bg-card);
  padding: 0 8px;
}
.reader-tools {
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 16px;
  flex-wrap: wrap;
}
.reader-tool-group {
  display: flex;
  align-items: center;
  gap: 6px;
}
.reader-tool-label {
  font-size: 12px;
  color: var(--text-muted);
}
.theme-options {
  display: flex;
  gap: 6px;
}
.theme-option {
  width: 28px;
  height: 28px;
  border-radius: 50%;
  border: 2px solid transparent;
  cursor: pointer;
  transition: border-color 0.2s;
  display: flex;
  align-items: center;
  justify-content: center;
  font-size: 10px;
  color: #fff;
}
.theme-option.active {
  border-color: var(--primary);
}
.theme-option.theme-light { background: #f5efe0; color: #2c1810; }
.theme-option.theme-dark { background: #1a1510; color: #e8dcc8; }
.theme-option.theme-paper { background: #c7edcc; color: #2c3e2c; }
.theme-option.theme-night { background: #0d0d1a; color: #6b7db3; }

.font-size-control {
  display: flex;
  align-items: center;
  gap: 6px;
}
.font-btn {
  width: 28px;
  height: 28px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg-secondary);
  color: var(--text-secondary);
  font-size: 14px;
  display: flex;
  align-items: center;
  justify-content: center;
  cursor: pointer;
}
.font-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.font-size-val {
  min-width: 32px;
  text-align: center;
  font-size: 13px;
  color: var(--text-secondary);
}
.font-family-options {
  display: flex;
  gap: 4px;
}
.ff-btn {
  padding: 4px 10px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg-secondary);
  color: var(--text-secondary);
  font-size: 12px;
  cursor: pointer;
  transition: all 0.2s;
  font-family: inherit;
}
.ff-btn:hover {
  border-color: var(--primary);
  color: var(--primary);
}
.ff-btn.active {
  background: var(--primary);
  color: #fff;
  border-color: var(--primary);
}
.reader-shelf-btn {
  padding: 6px 14px;
  border: 1px solid var(--primary);
  border-radius: 4px;
  font-size: 12px;
  color: var(--primary);
  cursor: pointer;
  transition: all 0.2s;
}
.reader-shelf-btn:hover {
  background: var(--primary);
  color: #fff;
}

.reader-shelf-btn:disabled {
  opacity: 0.45;
  cursor: not-allowed;
}
.reader-shelf-btn:disabled:hover {
  background: var(--bg-secondary);
  color: var(--primary);
}

/* ==================== 有声书朗读 TTS ==================== */
.tts-select {
  height: 28px;
  max-width: 158px;
  border: 1px solid var(--border);
  border-radius: 4px;
  background: var(--bg-secondary);
  color: var(--text-secondary);
  font-size: 12px;
  font-family: inherit;
  padding: 0 4px;
  cursor: pointer;
}
.tts-select:focus { outline: none; border-color: var(--primary); }

/* 不支持语音时的引导层 */
.tts-help-mask {
  position: fixed;
  inset: 0;
  z-index: 3000;
  background: rgba(0, 0, 0, 0.55);
  display: none;
  align-items: center;
  justify-content: center;
  padding: 24px;
  animation: ttsFade 0.2s;
}
.tts-help-mask.show { display: flex; }
.tts-help-card {
  width: 100%;
  max-width: 440px;
  max-height: 82vh;
  overflow: auto;
  background: var(--bg-card, #fff);
  border: 1px solid var(--border, #e5e0d5);
  border-radius: 14px;
  padding: 22px 22px 18px;
  box-shadow: 0 18px 60px rgba(0, 0, 0, 0.35);
  font-family: var(--font-sans);
}
.tts-help-title { font-size: 17px; font-weight: 700; color: var(--text-primary, #222); margin-bottom: 12px; }
.tts-help-body { font-size: 14px; line-height: 1.7; color: var(--text-secondary, #555); }
.tts-help-body p { margin: 0 0 10px; }
.tts-help-body b { color: var(--text-primary, #222); }
.tts-help-tip { font-size: 12.5px; opacity: 0.82; }
.tts-help-ok {
  display: block;
  margin: 6px auto 0;
  min-width: 120px;
  height: 38px;
  border: none;
  border-radius: 19px;
  background: var(--primary, #d4a84b);
  color: #fff;
  font-size: 14px;
  cursor: pointer;
}
.tts-help-ok:active { opacity: 0.85; }
@keyframes ttsFade { from { opacity: 0; } to { opacity: 1; } }

/* 正在朗读的段落高亮 */
.reader-text p.tts-active {
  background: rgba(212, 168, 75, 0.20);
  border-radius: 4px;
  box-shadow: 0 0 0 3px rgba(212, 168, 75, 0.10);
  transition: background 0.3s;
}

/* 悬浮听书播放条 */
.tts-bar {
  position: absolute;
  left: 50%;
  bottom: 92px;
  transform: translateX(-50%) translateY(16px);
  display: flex;
  align-items: center;
  gap: 14px;
  padding: 8px 12px 8px 18px;
  background: var(--bg-card);
  border: 1px solid var(--border);
  border-radius: 999px;
  box-shadow: 0 8px 28px rgba(0, 0, 0, 0.28);
  z-index: 40;
  opacity: 0;
  pointer-events: none;
  transition: opacity 0.25s, transform 0.25s;
  max-width: calc(100% - 24px);
}
.tts-bar.show {
  opacity: 1;
  pointer-events: auto;
  transform: translateX(-50%) translateY(0);
}
.tts-bar-info {
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 13px;
  color: var(--text-primary);
  font-family: var(--font-sans);
  white-space: nowrap;
}
.tts-bar-icon { font-size: 15px; }
.tts-bar-actions { display: flex; align-items: center; gap: 6px; }
.tts-bar-btn {
  width: 32px;
  height: 32px;
  border-radius: 50%;
  border: 1px solid var(--border);
  background: var(--bg-secondary);
  color: var(--text-primary);
  font-size: 13px;
  cursor: pointer;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: all 0.2s;
}
.tts-bar-btn:hover { border-color: var(--primary); color: var(--primary); }
.tts-bar-main {
  width: 38px;
  height: 38px;
  font-size: 15px;
  background: var(--primary);
  border-color: var(--primary);
  color: #fff;
}
.tts-bar-main:hover { color: #fff; opacity: 0.88; }

@media (max-width: 480px) {
  .tts-select { max-width: 108px; }
  .tts-bar { bottom: 84px; gap: 8px; padding: 6px 10px 6px 14px; }
  .tts-bar-info { font-size: 12px; }
  .tts-bar-btn { width: 30px; height: 30px; }
  .tts-bar-main { width: 34px; height: 34px; }
}

/* 音源（引擎）选择弹窗选项 */
.tts-engine-opt {
  border: 1.5px solid var(--border, #e5e0d5);
  border-radius: 12px;
  padding: 12px 14px;
  margin: 10px 0;
  cursor: pointer;
  transition: all 0.18s;
  background: var(--bg-secondary, #faf7f0);
}
.tts-engine-opt:hover, .tts-engine-opt:active {
  border-color: var(--primary, #d4a84b);
  background: rgba(212, 168, 75, 0.10);
}
.tts-engine-opt-t { font-size: 15px; font-weight: 700; color: var(--text-primary, #222); margin-bottom: 4px; }
.tts-engine-opt-d { font-size: 12.5px; line-height: 1.6; color: var(--text-secondary, #666); }

/* 离线引擎加载进度卡（非模态） */
.tts-load-card {
  position: fixed;
  right: 14px;
  bottom: 16px;
  z-index: 2900;
  width: 268px;
  max-width: calc(100vw - 28px);
  background: var(--bg-card, #fff);
  border: 1px solid var(--border, #e5e0d5);
  border-radius: 12px;
  box-shadow: 0 10px 34px rgba(0,0,0,0.25);
  padding: 12px 14px;
  font-family: var(--font-sans);
  opacity: 0;
  pointer-events: none;
  transform: translateY(12px);
  transition: opacity 0.25s, transform 0.25s;
}
.tts-load-card.show { opacity: 1; pointer-events: none; transform: translateY(0); }
/* 内容保护遮罩：页面切到后台/隐藏时盖住正文（网页无法真正拦截系统截屏，此为防后台预览/录屏的软防护） */
.bq-shot-shield {
  position: fixed; inset: 0; z-index: 99999; display: none;
  align-items: center; justify-content: center; flex-direction: column; gap: 14px;
  background: var(--bg-card, #f4efe2); color: var(--text-muted, #9a9384);
  font-size: 15px; line-height: 1.7; text-align: center; padding: 32px;
}
.bq-shot-shield.show { display: flex; }
.bq-shot-shield .ico { font-size: 42px; }
.tts-load-t { font-size: 13px; font-weight: 700; color: var(--text-primary, #222); display: flex; justify-content: space-between; }
.tts-load-t span { color: var(--primary, #d4a84b); }
.tts-load-track { height: 6px; border-radius: 3px; background: var(--bg-secondary, #eee); margin: 8px 0 6px; overflow: hidden; }
.tts-load-fill { height: 100%; width: 0; background: var(--primary, #d4a84b); border-radius: 3px; transition: width 0.2s; }
.tts-load-msg { font-size: 11.5px; color: var(--text-muted, #999); line-height: 1.5; }

/* 录入我的声音（克隆样本）面板 */
.clone-timer { font-size: 26px; font-weight: 700; text-align: center; color: var(--primary, #d4a84b); font-variant-numeric: tabular-nums; margin: 6px 0 2px; }
.clone-hint { font-size: 12.5px; line-height: 1.7; color: var(--text-secondary, #666); margin: 4px 0 10px; }
.clone-status { font-size: 12.5px; color: var(--text-secondary, #666); text-align: center; min-height: 18px; margin-bottom: 8px; }
.clone-status.rec { color: #d44; font-weight: 700; }
.clone-btns { display: flex; flex-wrap: wrap; gap: 8px; justify-content: center; }
.clone-btn { border: 1.5px solid var(--border, #e5e0d5); background: var(--bg-secondary, #faf7f0); color: var(--text-primary, #222); border-radius: 10px; padding: 9px 14px; font-size: 13.5px; cursor: pointer; font-family: var(--font-sans); }
.clone-btn.primary { border-color: var(--primary, #d4a84b); background: var(--primary, #d4a84b); color: #fff; }
.clone-btn.danger { border-color: #d98b8b; color: #c0504d; }
.clone-btn:disabled { opacity: 0.45; cursor: not-allowed; }
.clone-saved-tip { font-size: 12px; color: #2e7d32; text-align: center; margin-top: 8px; }
.clone-audio { width: 100%; margin: 6px 0; }

/* 阅读器底部“更多”收纳面板 */
.reader-more-wrap { position: relative; }
.reader-more-panel {
  display: none;
  position: absolute;
  bottom: calc(100% + 8px);
  right: 0;
  z-index: 2400;
  flex-direction: column;
  gap: 10px;
  padding: 12px 14px;
  min-width: 280px;
  max-width: 88vw;
  background: var(--bg-card, #fff);
  border: 1px solid var(--border, #e5e0d5);
  border-radius: 14px;
  box-shadow: 0 12px 36px rgba(0,0,0,0.22);
}
.reader-more-panel.show { display: flex; }
.reader-more-panel .reader-tool-group { flex-wrap: wrap; }

/* B1 本地账号锁 */
.auth-lock {
  position: fixed; inset: 0; z-index: 99999;
  display: none;
  align-items: center; justify-content: center;
  padding: 20px;
  background: linear-gradient(160deg, #f5efe2 0%, #ece1cc 100%);
  overflow: auto;
}
.auth-lock.show { display: flex; }
.auth-card {
  width: 100%; max-width: 380px;
  background: var(--bg-card, #fffdf8);
  border: 1px solid var(--border, #e5dcc8);
  border-radius: 18px;
  padding: 28px 24px 22px;
  box-shadow: 0 18px 50px rgba(90, 70, 30, 0.18);
  text-align: center;
}
.auth-logo { font-size: 46px; line-height: 1; }

// Precompute chapter counts per book and generate chapter titles

  // 优先使用爬虫下载的真实章节标题
  const book = getBookById(bookId);
  if (book && book.realContent && book.realContent[chapterNum - 1]) {
    return book.realContent[chapterNum - 1].title;
  }
  const titles = [
    '楔子', '第一章 初入江湖', '第二章 意外之喜', '第三章 暗流涌动', '第四章 风云际会',
    '第五章 初露锋芒', '第六章 狭路相逢', '第七章 秘境开启', '第八章 机缘巧合', '第九章 实力大增',
    '第十章 暗流涌动', '第十一章 世家子弟', '第十二章 正面冲突', '第十三章 一战成名',
    '第十四章 声名鹊起', '第十五章 阴谋诡计', '第十六章 化险为夷', '第十七章 新的征程',
    '第十八章 深山奇遇', '第十九章 上古传承', '第二十章 功法大成', '第二十一章 出山',
    '第二十二章 路见不平', '第二十三章 拔刀相助', '第二十四章 结识英豪', '第二十五章 酒楼议事',
    '第二十六章 神秘组织', '第二十七章 暗夜追踪', '第二十八章 深入虎穴', '第二十九章 机关重重',
    '第三十章 绝处逢生',
  ];
  if (chapterNum < titles.length) return titles[chapterNum];
  const suffixes = [
    '章 风云变幻','章 暗流汹涌','章 雷霆万钧','章 步步惊心','章 柳暗花明',
    '章 峰回路转','章 惊涛骇浪','章 力挽狂澜','章 绝世一战','章 王者归来',
    '章 天地变色','章 神魔共舞','章 大道初成','章 问鼎巅峰','章 终极一战',
  ];
  const i = (chapterNum + bookId * 7) % suffixes.length;
  const numStr = formatChapterNum(chapterNum);
  return '第' + numStr + suffixes[i];
}

function formatChapterNum(n) {
  const cnNums = ['零','一','二','三','四','五','六','七','八','九'];
  const units = ['','十','百','千'];
  if (n < 10) return cnNums[n];
  if (n < 20) return '十' + (n % 10 === 0 ? '' : cnNums[n % 10]);
  if (n < 100) {
    const t = Math.floor(n / 10);
    const o = n % 10;
    return cnNums[t] + '十' + (o === 0 ? '' : cnNums[o]);
  }
  if (n < 1000) {
    const h = Math.floor(n / 100);
    const t = Math.floor((n % 100) / 10);
    const o = n % 10;
    let r = cnNums[h] + '百';
    if (t === 0 && o === 0) return r;
    if (t === 0) return r + '零' + cnNums[o];
    r += cnNums[t] + '十';
    if (o !== 0) r += cnNums[o];
    return r;
  }
  return n + '';
}

// Generate chapter content
function generateChapterContent(bookId, chapterNum) {
  // 优先使用爬虫下载的真实章节内容
  const book = getBookById(bookId);
  if (book && book.realContent && book.realContent[chapterNum - 1]) {
    const real = book.realContent[chapterNum - 1];
    if (real.paragraphs && real.paragraphs.length > 0) {
      return real.paragraphs;
    }
  }
  const paragraphs = [];
  const seed = bookId * 10000 + chapterNum;
  const openings = [
    '夜幕低垂，月华如水。',
    '时间流逝，转眼间便是数日过去。',
    '翌日清晨，天刚蒙蒙亮。',

    '夜色如墨，万籁俱寂。',
    '正午时分，骄阳似火。',
    '春去秋来，寒来暑往。',
    '这一日，天空格外晴朗。',
    '夜半三更，月黑风高。',
  ];
  const contents = [
    '主角缓步走在长廊之上，心中思绪万千。此番变故来得太过突然，让他有些措手不及。但他知道，越是这个时候，就越是要冷静。只有保持清醒的头脑，才能在这纷乱的局面中找到一线生机。',
    '大殿之中，众人各怀心思。有人忧心忡忡，有人暗自窃喜，有人面无表情，有人眼中闪过一丝不屑。这便是江湖，这便是人心。你永远不知道别人笑脸之下，藏着的是一把刀，还是一颗糖。',
    '他深吸一口气，压下心中的波澜。事已至此，多想无益。当务之急，是提升自己的实力。在这个世界，实力才是硬道理。没有实力，一切都是空谈。有了实力，才能保护自己想要保护的人，才能做到自己想做的事。',
    '远处山峰之上，一道身影负手而立。山风吹起他的衣袍，猎猎作响。他的目光穿越了重重云雾，落在了远方的某个方向。良久，他轻轻叹息一声，似是感慨，又似是无奈。岁月悠悠，沧海桑田，这世间又有几人能够看透？',
    '战鼓擂响，杀声震天。两军对垒，旌旗猎猎。这是一场决定命运的战争，胜者王侯败者寇。没有人愿意成为失败者，但战争终归要有胜负。在这乱世之中，每个人都在用自己的方式挣扎着、生存着、奋斗着。',
    '密室之中，光芒大放。一股强大的气息从主角身上散发出来，越来越强，越来越盛。他的体内，仿佛有什么东西正在觉醒、正在蜕变。这是一次质的飞跃，一次脱胎换骨的变化。当光芒散尽之时，他缓缓睁开了双眼，眼中闪过一丝精光。',
    '酒楼之上，人声鼎沸。三教九流，各色人等齐聚于此。有人高谈阔论，有人低声细语，有人推杯换盏，有人独酌自饮。这里是消息最灵通的地方，也是是非最多的地方。往往一个不起眼的小人物，却可能掌握着惊天的秘密。',
    '群山连绵，万壑争流。在这片古老的山脉中，隐藏着无数的秘密和机缘。自古以来，不知有多少人来此探险寻宝，又不知有多少人葬身于此。危险与机遇并存，这是这片大山永恒的主题。而今天，又有一群年轻的身影，踏入了这片神秘的土地。',
  ];
  const endings = [
    '想到这里，他的眼神变得坚定起来。无论前方有多少艰难险阻，他都要走下去。因为他知道，这条路的尽头，有他想要的答案。',
    '夜色渐深，故事还在继续。谁也不知道明天会发生什么，但每个人都在期待着。期待着新的一天，期待着新的故事，期待着新的奇迹。',
    '这一切，才刚刚开始。',
    '而就在这时，远处突然传来了一声巨响。众人脸色骤变，纷纷循声望去。只见远方的天空中，一道耀眼的光芒冲天而起……',

    '他站起身来，望向窗外。天边泛起了鱼肚白，新的一天，又要开始了。',
  ];

  const numParagraphs = 5 + (seed % 8);
  paragraphs.push(openings[seed % openings.length]);
  for (let i = 0; i < numParagraphs; i++) {
    paragraphs.push(contents[(seed + i * 3) % contents.length]);
  }
  paragraphs.push(endings[seed % endings.length]);

  return paragraphs;
}

// ==================== Storage ====================
function getShelf() {
  try {
    return JSON.parse(localStorage.getItem('biquge_shelf') || '[]');
  } catch (e) { return []; }
}
function saveShelf(shelf) {
  try {
    localStorage.setItem('biquge_shelf', JSON.stringify(shelf));
  } catch (e) {
    showToast('保存失败：存储空间不足');
  }
}
function isInShelf(bookId) {
  return getShelf().some(b => b.id === bookId);
}
function addToShelf(bookId) {
  const shelf = getShelf();
  const book = BOOKS_DATA.find(b => b.id === bookId);
  if (!book) return false;
  if (shelf.some(b => b.id === bookId)) return false;
  shelf.unshift({ id: bookId, lastChapter: 1, lastTime: Date.now() });
  saveShelf(shelf);
  return true;
}
function removeFromShelf(bookId) {
  const shelf = getShelf().filter(b => b.id !== bookId);
  saveShelf(shelf);
}
function getReadProgress(bookId) {
  try {
    const map = JSON.parse(localStorage.getItem('biquge_progress') || '{}');
    return map[bookId] || 1;
  } catch (e) { return 1; }
}
function saveReadProgress(bookId, chapterNum) {
  try {
    const map = JSON.parse(localStorage.getItem('biquge_progress') || '{}');
    map[bookId] = chapterNum;
    localStorage.setItem('biquge_progress', JSON.stringify(map));
  } catch (e) {}
  try {
    const shelf = getShelf();
    const idx = shelf.findIndex(b => b.id === bookId);
    if (idx >= 0) {
      shelf[idx].lastChapter = chapterNum;
      shelf[idx].lastTime = Date.now();
      saveShelf(shelf);
    }
  } catch (e) {}
}

// ==================== Favorites & Likes ====================
function getFavorites() {
  try { return JSON.parse(localStorage.getItem('biquge_favorites') || '[]'); }
  catch (e) { return []; }
}
function saveFavorites(ids) {
  localStorage.setItem('biquge_favorites', JSON.stringify(ids));
}
function isFavorite(bookId) {
  return getFavorites().includes(bookId);
}
function toggleFavorite(bookId) {
  let favs = getFavorites();
  if (favs.includes(bookId)) {
    favs = favs.filter(id => id !== bookId);
    saveFavorites(favs);
    return false;
  }
  favs.push(bookId);
  saveFavorites(favs);
  if (!isInShelf(bookId)) addToShelf(bookId);
  return true;
}

function getLikes() {
  try { return JSON.parse(localStorage.getItem('biquge_likes') || '[]'); }
  catch (e) { return []; }
}
function saveLikes(ids) {
  localStorage.setItem('biquge_likes', JSON.stringify(ids));
}
function isLiked(bookId) {
  return getLikes().includes(bookId);
}
function toggleLike(bookId) {
  let likes = getLikes();
  if (likes.includes(bookId)) {
    likes = likes.filter(id => id !== bookId);
    saveLikes(likes);
    return false;
  }
  likes.push(bookId);
  saveLikes(likes);
  if (!isInShelf(bookId)) addToShelf(bookId);
  return true;
}

// 自动将爬虫小说加入书架和喜欢（每本只自动添加一次，用户可手动取消）
function autoLikeCrawlerBooks() {
  try {
    const seen = JSON.parse(localStorage.getItem('biquge_seen_crawler') || '[]');
    const likes = getLikes();
    const shelf = getShelf();
    let likesChanged = false;
    let shelfChanged = false;

    BOOKS_DATA.forEach(book => {
      if (book.source === 'crawler' && !seen.includes(book.id)) {
        seen.push(book.id);
        if (!likes.includes(book.id)) {
          likes.push(book.id);
          likesChanged = true;
        }
        if (!shelf.some(b => b.id === book.id)) {
          shelf.unshift({ id: book.id, lastChapter: 1, lastTime: Date.now() });
          shelfChanged = true;
        }
      }
    });

    localStorage.setItem('biquge_seen_crawler', JSON.stringify(seen));
    if (likesChanged) saveLikes(likes);
    if (shelfChanged) saveShelf(shelf);
  } catch (e) {
    console.warn('[墨渊阁] 自动收藏爬虫小说失败:', e);
  }
}

// ==================== Navigation ====================
let navHistory = [];
let _isNavigatingBack = false;

function navigate(page, params) {
  // 记录导航历史（回退导航和阅读页不记录，阅读页是覆盖层）
  if (!_isNavigatingBack && currentPage !== 'reader' && page !== currentPage) {
    navHistory.push({
      page: currentPage,
      bookId: currentBookId,
      category: currentCategory,
      query: searchQuery,
      tag: currentTag,
      chapter: currentChapterNum,
      shelfTab: shelfTab,
    });
    if (navHistory.length > 50) navHistory.shift();
  }

  currentPage = page;
  if (params) {
    if (params.bookId) currentBookId = params.bookId;
    if (params.category) currentCategory = params.category;
    if (params.query !== undefined) searchQuery = params.query;
    if (params.tag !== undefined) currentTag = params.tag;
    if (params.chapter !== undefined) currentChapterNum = params.chapter;
  }
  if (page === 'detail') {
    descExpanded = false;
    showAllChapters = false;
  }

  document.querySelectorAll('.nav-item').forEach(item => {
    item.classList.toggle('active', item.dataset.page === page ||
      (page === 'detail' && item.dataset.page === 'home') ||
      (page === 'search' && item.dataset.page === 'home') ||
      (page === 'tag' && item.dataset.page === 'home') ||
      (page === 'reader' && item.dataset.page === 'home'));
  });

  render();
  window.scrollTo(0, 0);
}

function goBack() {
  if (navHistory.length > 0) {
    const prev = navHistory.pop();
    _isNavigatingBack = true;
    currentBookId = prev.bookId;
    currentCategory = prev.category;
    searchQuery = prev.query;
    currentTag = prev.tag || '';
    currentChapterNum = prev.chapter;
    shelfTab = prev.shelfTab || 'all';
    navigate(prev.page);
    _isNavigatingBack = false;
  } else {
    location.href = 'index.html';
  }
}

function handleSearchKey(e) {
  if (e.key === 'Enter') {
    const query = e.target.value.trim();
    if (query) {
      navigate('search', { query });
    }
  }
}
function toggleSearchClear(val) {
  const btn = document.getElementById('searchClearBtn');
  if (btn) btn.style.display = val ? 'flex' : 'none';
}
function clearSearch() {
  const input = document.getElementById('searchInput');
  if (input) {
    input.value = '';
    input.focus();
    toggleSearchClear('');
  }
  if (currentPage === 'search') navigate('home');
}

// ==================== Helpers ====================
function escapeHtml(text) {
  if (!text) return '';
  const div = document.createElement('div');
  div.textContent = text;
  return div.innerHTML;
}
function getBookById(id) {
  return BOOKS_DATA.find(b => b.id === id || String(b.id) === String(id));
}
// 把书籍 id 渲染成可内联进 onclick 的 JS 字面量：数字原样，字符串(本地导入书 local_xxx)加单引号，避免 ReferenceError 导致点不开
function JID(id) {
  if (typeof id === 'number') return String(id);
  return "'" + String(id).replace(/\\/g, '\\\\').replace(/'/g, "\\'") + "'";
}
function getCategoryName(id) {
  const cat = CATEGORIES.find(c => c.id === id);
  return cat ? cat.name : id;
}
function getCategoryIcon(id) {
  const cat = CATEGORIES.find(c => c.id === id);
  return cat ? cat.icon : '📖';
}
function gradientStyle(colors) {
  return `linear-gradient(135deg, ${colors[0]} 0%, ${colors[1]} 50%, ${colors[2]} 100%)`;
}
function formatNumber(n) {
  if (n >= 10000) return (n / 10000).toFixed(1) + '万';
  return n.toLocaleString();
}

// ==================== Render: Bookshelf ====================
function renderBookshelf() {
  const shelf = getShelf();
  const favorites = getFavorites();
  const likes = getLikes();

  const shelfBooks = shelf.map(s => {
    const book = getBookById(s.id);
    if (!book) return null;
    const progress = getReadProgress(s.id);
    return {
      ...book,
      lastChapter: Math.max(s.lastChapter || 1, progress),
      lastTime: s.lastTime,
      isFav: favorites.includes(s.id),
      isLike: likes.includes(s.id),
    };
  }).filter(b => b);

  const counts = {
    all: shelfBooks.length,
    favorites: shelfBooks.filter(b => b.isFav).length,
    likes: shelfBooks.filter(b => b.isLike).length,
  };

  let filteredBooks = shelfBooks;
  if (shelfTab === 'favorites') {
    filteredBooks = shelfBooks.filter(b => b.isFav);
  } else if (shelfTab === 'likes') {
    filteredBooks = shelfBooks.filter(b => b.isLike);
  }

  const tabsHtml = `
    <div class="shelf-tabs">
      <button class="shelf-tab ${shelfTab === 'all' ? 'active' : ''}" onclick="switchShelfTab('all')">
        全部<span class="shelf-tab-count">${counts.all}</span>
      </button>
      <button class="shelf-tab ${shelfTab === 'favorites' ? 'active' : ''}" onclick="switchShelfTab('favorites')">
        ★ 收藏<span class="shelf-tab-count">${counts.favorites}</span>

  shelfTab = tab;

function removeShelfBook(bookId) {
  const book = getBookById(bookId);
  const bookTitle = book ? book.title : '该小说';
  if (!confirm(`确定将《${bookTitle}》移出书架吗？` +
    (book && book.source === 'crawler' ? '\n\n提示：移出后可点击「导出书架状态」并运行 cleanup_shelf.py 清理本地缓存文件。' : ''))) {
    return;
  }

  removeFromShelf(bookId);
  // 同时从收藏和喜欢中移除
  saveFavorites(getFavorites().filter(id => id !== bookId));
  saveLikes(getLikes().filter(id => id !== bookId));

  showToast('已移出书架');
  render();
}

function exportShelfState() {
  const shelf = getShelf();
  const favorites = getFavorites();
  const likes = getLikes();

  // 只导出爬虫小说（有本地缓存的），同时包含完整书架信息
  const crawlerBooks = shelf
    .map(s => getBookById(s.id))
    .filter(b => b && b.source === 'crawler')
    .map(b => ({
      id: b.id,
      title: b.title,
      author: b.author,
      favorite: favorites.includes(b.id),
      liked: likes.includes(b.id),
    }));

  const state = {
    exportTime: new Date().toISOString(),
    shelfCrawlerBooks: crawlerBooks,
    allShelfIds: shelf.map(s => s.id),
    favorites: favorites,
    likes: likes,
  };

  const blob = new Blob([JSON.stringify(state, null, 2)], { type: 'application/json' });
  const url = URL.createObjectURL(blob);
  const a = document.createElement('a');
  a.href = url;
  a.download = 'bookshelf_state.json';
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  URL.revokeObjectURL(url);
  showToast('已导出 bookshelf_state.json（书架/收藏/喜欢清单备份）');
}

// 精确匹配某标签下的书；状态/来源类标签走对应字段
function booksByTag(tag) {
  const t = String(tag || '').trim().toLowerCase();
  if (!t) return [];
  return BOOKS_DATA.filter(b => {
    if (t === '已完结' || t === '完结') return b.status !== '连载';
    if (t === '连载中' || t === '连载') return b.status === '连载';
    if (t === '公版全文' || t === '公版书') return b.source === 'crawler';
    return (b.tags || []).some(x => String(x).toLowerCase() === t);
  });
}
function openTag(enc) {
  const tag = decodeURIComponent(enc);
  navigate('tag', { tag });
}
function renderTag() {

function generateChapterList(book) {
  let html = '';
  const total = book.chapters;
  const showAll = total <= 500;

  if (showAll) {
    for (let i = 1; i <= total; i++) {
      html += `<div class="chapter-item" onclick="openReader(${JID(book.id)}, ${i})">
        <span>${generateChapterTitle(book.id, i)}</span>
      </div>`;
    }
  } else {
    for (let i = 1; i <= 100; i++) {
      html += `<div class="chapter-item" onclick="openReader(${JID(book.id)}, ${i})">
        <span>${generateChapterTitle(book.id, i)}</span>
      </div>`;
    }
    html += `<div style="grid-column:1/-1;text-align:center;padding:12px;color:var(--text-muted);font-size:13px;">
      中间章节请在阅读页目录中查看
    </div>`;
    for (let i = total - 99; i <= total; i++) {
      html += `<div class="chapter-item" onclick="openReader(${JID(book.id)}, ${i})">
        <span>${generateChapterTitle(book.id, i)}</span>
      </div>`;
    }
  }
  return html;
}

function toggleDesc() {
  descExpanded = !descExpanded;
  const el = document.getElementById('descText');
  if (el) {
    el.classList.toggle('collapsed', !descExpanded);

function renderChapterModal(book) {
  const total = book.chapters;
  let items = '';
  for (let i = 1; i <= Math.min(200, total); i++) {
    items += `<div class="chapter-modal-item ${i === currentChapterNum ? 'current' : ''}" onclick="goToChapter(${i})">
      <span>${generateChapterTitle(book.id, i)}</span>
    </div>`;
  }
  if (total > 200) {
    items += `<div style="padding:12px;text-align:center;color:var(--text-muted);font-size:12px;">... 共 ${total} 章 ...</div>`;
    for (let i = total - 99; i <= total; i++) {
      items += `<div class="chapter-modal-item ${i === currentChapterNum ? 'current' : ''}" onclick="goToChapter(${i})">
        <span>${generateChapterTitle(book.id, i)}</span>
      </div>`;
    }
  }

  return `
    <div class="chapter-modal-backdrop" onclick="toggleChapterModal()">
      <div class="chapter-modal" onclick="event.stopPropagation()">
        <div class="chapter-modal-header">
          <div class="chapter-modal-title">章节目录 (${total}章)</div>
          <div class="chapter-modal-close" onclick="toggleChapterModal()">✕</div>
        </div>
        <div class="chapter-modal-jump">
          <input type="number" id="chapterJumpInput" min="1" max="${total}" value="${currentChapterNum}" placeholder="跳转到第...章" onkeypress="handleChapterJump(event, ${total})">
          <button onclick="doChapterJump(${total})">跳转</button>
        </div>
        <div class="chapter-modal-body" id="chapterModalBody">
          ${items}
        </div>
      </div>
    </div>
  `;
}

function toggleReaderTools() {
  readerToolsVisible = !readerToolsVisible;
  const header = document.getElementById('readerHeader');
  const footer = document.getElementById('readerFooter');
  if (header) header.classList.toggle('hidden', !readerToolsVisible);
  if (footer) footer.classList.toggle('hidden', !readerToolsVisible);
}

function setReaderTheme(t) {
  readerTheme = t;
  localStorage.setItem('biquge_reader_theme', t);
  render();
}

const READER_FONTS = {
  sans:  { label: '黑体', family: 'var(--font-sans)' },
  serif: { label: '宋体', family: 'var(--font-serif)' },
  kai:   { label: '楷体', family: 'var(--font-kai)' },
};
function setReaderFontFamily(ff) {
  readerFontFamily = ff;
  localStorage.setItem('biquge_reader_font', ff);
  render();
}

function changeFontSize(delta) {
  const newSize = readerFontSize + delta;
  if (newSize >= 14 && newSize <= 28) {
    readerFontSize = newSize;
    localStorage.setItem('biquge_font_size', newSize);
    render();
  }
}

function prevChapter() {
  if (currentChapterNum > 1) {
    currentChapterNum--;
    saveReadProgress(currentBookId, currentChapterNum);
    render();
    document.querySelector('.reader-content')?.scrollTo(0, 0);
  }
}

function nextChapter() {
  const book = getBookById(currentBookId);
  if (book && currentChapterNum < book.chapters) {
    currentChapterNum++;
    saveReadProgress(currentBookId, currentChapterNum);
    render();
    document.querySelector('.reader-content')?.scrollTo(0, 0);
  }
}

function goToChapter(num) {
  const book = getBookById(currentBookId);
  if (!book) return;
  const n = Math.max(1, Math.min(book.chapters, num));
  currentChapterNum = n;
  saveReadProgress(currentBookId, n);
  showChapterModal = false;
  render();
  document.querySelector('.reader-content')?.scrollTo(0, 0);
}

function toggleChapterModal() {
  showChapterModal = !showChapterModal;
  render();
  if (showChapterModal) {
    setTimeout(() => {
      const body = document.getElementById('chapterModalBody');
      if (body) {
        const current = body.querySelector('.chapter-modal-item.current');
        if (current) current.scrollIntoView({ block: 'center', behavior: 'smooth' });
      }
      const input = document.getElementById('chapterJumpInput');
      if (input) input.focus();
    }, 50);
  }
}
function handleChapterJump(e, total) {
  if (e.key === 'Enter') doChapterJump(total);
}
function doChapterJump(total) {
  const input = document.getElementById('chapterJumpInput');
  if (!input) return;
  const val = parseInt(input.value, 10);
  if (!isNaN(val) && val >= 1 && val <= total) {
    goToChapter(val);
  } else {
    showToast(`请输入 1-${total} 之间的章节号`);
  }
}

function closeReader() {
  navigate('detail', { bookId: currentBookId });
}

// ==================== 有声书朗读（三引擎：系统语音 / 在线云端 / 离线神经） ====================

function ttsHasSynth() {
  return !!window.speechSynthesis && typeof window.SpeechSynthesisUtterance !== 'undefined';
}

// ---------- 各类浮层：旧“不支持引导层 / 引擎选择 / 离线加载进度” ----------

      '</div>' +
      '<p class="tts-help-tip">之后可在听书栏「音源」随时切换；离线引擎会在本机缓存，第二次打开无需再下载。</p>' +

function ttsChooseEngine(eng) {
  tts.enginePref = eng;
  tts.engine = eng;
  try { localStorage.setItem('biquge_tts_engine', eng); } catch (e) {}
  ttsHideEnginePicker();
  ttsPopulateEngineSelect();
  ttsPopulateVoiceSelect();
  if (eng === 'offline') {
    ttsUnlockAudio();
    ttsOfflineEnsure(false);
  } else if (eng === 'online') {
    ttsOfflineEnsure(true); // 选在线也在后台静默备好离线引擎
  }
  showToast(eng === 'offline' ? '已选择离线引擎，首次加载约 45MB，请稍候…' : (eng === 'online' ? '已选择在线语音，即点即读' : '已选择系统语音'));
  const from = (typeof tts._resumeFrom === 'number') ? tts._resumeFrom : 0;
  tts._resumeFrom = null;
  ttsStartChapter(from);
}

// 离线加载进度浮层（非模态，不阻塞阅读）
function ttsBuildLoadBar() {
  ttsEl('ttsLoadCard', 'tts-load-card',

}
function ttsUpdateLoadBar(pct, msg) {

  const c = document.getElementById('ttsLoadCard');
  if (c) c.classList.add('show');
  const f = document.getElementById('ttsLoadFill');

  if (f) f.style.width = Math.max(0, Math.min(100, pct)) + '%';

function ttsHideLoadBar() {

  if (c) c.classList.remove('show');
}

function ttsInit() {
  ttsPersistStorage();
  ensureFflate(function () {}); // 预热压缩库并让其进入 SW 缓存，保证离线时也能导入离线包
  ttsBuildHelp();
  ttsBuildEnginePicker();
  ttsBuildLoadBar();
  ttsBindTapToClearSelection();
  ttsBindTapParagraph();
  // 读回本机已保存的克隆录音样本（仅更新入口状态）
  cloneLoad().then(function () { ttsPopulateVoiceSelect(); }).catch(function () {});
  window.addEventListener('beforeunload', ttsStop);
  window.addEventListener('pagehide', ttsStop);
  if (ttsHasSynth()) {
    ttsLoadVoices();
    try { window.speechSynthesis.addEventListener('voiceschanged', ttsLoadVoices); } catch (e) {}
  } else {
    let tries = 0;
    const timer = setInterval(function () {
      tries++;
      if (ttsHasSynth()) {
        clearInterval(timer);
        ttsLoadVoices();
        try { window.speechSynthesis.addEventListener('voiceschanged', ttsLoadVoices); } catch (e) {}
        ttsPopulateEngineSelect();
      } else if (tries > 20) {
        clearInterval(timer);
      }
    }, 500);
  }
  ttsPopulateEngineSelect();
  // 断网保底：默认引擎不是系统语音时（含 QQ/微信等默认“在线”的受限内核），
  // 都在后台静默把离线引擎(约45MB)提前下好缓存；当前就要用离线才显示进度，默认在线则静默偷跑、不打扰
  setTimeout(function () {
    const engNow = ttsPickEngine();
    if (engNow === 'system') return; // 系统语音足够，无需离线包
    ttsUnlockAudio();
    if (engNow === 'offline') { off.manualOffline = true; off.fgRetries = 0; ttsOfflineEnsure(false); } // 默认离线：前台下载、可续传
    else { off.manualOffline = false; ttsOfflineEnsure(true); } // 默认在线：离线转后台静默下载
  }, 1200);
}

// ---------- 引擎选择 ----------
function ttsEngineLabel(e) {
  if (e === 'system') return '🖥 系统语音·免流量';
  if (e === 'online') return '📶 在线语音·需联网';
  if (e === 'offline') return '💾 离线引擎·可断网';
  return e;
}
function ttsPopulateEngineSelect() {
  const sel = document.getElementById('ttsEngineSelect');
  if (!sel) return;
  const opts = [];
  if (ttsHasSynth()) opts.push(['system', '🖥 系统语音（免流量）']);
  opts.push(['online', '📶 在线语音（联网即用）']);
  opts.push(['offline', '💾 离线引擎（可断网）']);
  sel.innerHTML = opts.map(o => '<option value="' + o[0] + '">' + o[1] + '</option>').join('');
  const cur = tts.engine || tts.enginePref || (ttsHasSynth() ? 'system' : 'online');
  sel.value = cur;
}
function ttsOnEngineChange(eng) {
  const wasPlaying = tts.playing;
  const cur = tts.index;
  tts.enginePref = eng;
  try { localStorage.setItem('biquge_tts_engine', eng); } catch (e) {}
  tts.speakToken++;
  ttsEngineQuiet();
  if (eng === 'system' && !ttsHasSynth()) {
    showToast('当前环境无系统语音，请选在线或离线音源');
    ttsPopulateEngineSelect();
    return;
  }
  tts.engine = eng;
  if (eng === 'offline') {
    // 用户手动选离线：前台可见进度、快速下载（不放进后台），下载期间仍可翻书，且不擅自切到在线
    off.manualOffline = true; off.fgRetries = 0; off.bgRetries = 0;
    ttsUnlockAudio(); ttsOfflineEnsure(false);
  } else if (eng === 'online') {
    // 用户手动选在线：离线模型转后台静默下载，断网时再保底
    off.manualOffline = false; ttsOfflineEnsure(true);
  } else {
    off.manualOffline = false;
  }
  ttsPopulateVoiceSelect();
  if (wasPlaying) ttsStartChapter(cur); else ttsRefreshUI();
}
// 返回本次应用的引擎：优先用户手动选择；否则按浏览器能力给默认
// 条件足够（有系统语音）→ 系统语音；条件不足（如微信/QQ 内置浏览器）→ 离线引擎
// 是否处于 App 内置 WebView（QQ/微信/微博/抖音等，多为 X5/TBS 内核，无系统语音、大 WASM 易卡）
function ttsIsRestrictedWebView() {
  const ua = navigator.userAgent || '';
  return /MicroMessenger|MQQBrowser|QQBrowser|QQ\/|QHBrowser|Weibo|Alipay|Douyin|aweme|ByteSDK|XWEB|TBS|MiuiBrowser/i.test(ua);
}
function ttsPickEngine() {
  let pref = tts.enginePref;
  if (pref === 'system' && !ttsHasSynth()) pref = null;
  if (pref) return pref;
  if (ttsHasSynth()) return 'system';
  // 无系统语音时：App 内置内核默认走在线（已修复、即点即用、免下载），普通浏览器才默认离线
  return ttsIsRestrictedWebView() ? 'online' : 'offline';
}
// 是否将默认使用离线引擎（口径与 ttsPickEngine 一致）
function ttsDefaultIsOffline() { return ttsPickEngine() === 'offline'; }

// ---------- 系统语音音色 ----------
function ttsLoadVoices() {
  if (!ttsHasSynth()) return;
  let voices = [];
  try { voices = window.speechSynthesis.getVoices() || []; } catch (e) { voices = []; }
  voices.sort(function (a, b) {
    const az = /^zh/i.test(a.lang) ? 0 : 1;
    const bz = /^zh/i.test(b.lang) ? 0 : 1;
    if (az !== bz) return az - bz;
    return String(a.name).localeCompare(String(b.name));
  });
  ttsVoices = voices;
  ttsPopulateVoiceSelect();
}
function ttsVoiceLabel(v) {
  const lang = String(v.lang || '').replace('_', '-');
  return '🎙 ' + v.name + '（' + lang + '）' + (v.localService ? '' : ' ·在线');
}
function ttsPopulateVoiceSelect() {
  const sel = document.getElementById('ttsVoiceSelect');
  if (!sel) return;
  const eng = tts.engine || tts.enginePref || (ttsHasSynth() ? 'system' : 'online');
  let html = '';
  if (eng === 'offline') {
    html = TTS_OFFLINE_VOICES.map(s =>

    if (other.length) html += '<optgroup label="其他音色">' + other.map(v =>

}
function ttsOnVoiceChange(val) {

    ttsRefreshUI();

function ttsCurrentParagraphs() {
  const arr = generateChapterContent(currentBookId, currentChapterNum);
  if (!Array.isArray(arr)) return [];
  return arr.map(p => String(p == null ? '' : p).trim()).filter(Boolean);
}

// ---------- 会话控制 ----------
function ttsStartChapter(fromIndex) {
  const eng = ttsPickEngine();
  if (!eng) { tts._resumeFrom = (typeof fromIndex === 'number') ? fromIndex : 0; return; }
  const paras = ttsCurrentParagraphs();
  if (!paras.length) { showToast('本章暂无可朗读内容'); return; }
  tts.engine = eng;
  tts.paragraphs = paras;
  tts.bookId = currentBookId;
  tts.chapterNum = currentChapterNum;
  tts.index = (typeof fromIndex === 'number') ? Math.max(0, Math.min(fromIndex, paras.length - 1)) : 0;
  tts.chapterEnded = false;
  tts.playing = true;
  tts.paused = false;
  tts.waitingEngine = false;
  tts.speakToken++;
  ttsEngineQuiet();
  if (eng === 'system') { try { window.speechSynthesis.cancel(); } catch (e) {} }
  if (eng === 'offline') { ttsUnlockAudio(); ttsOfflineEnsure(true); }
  // online:clone 由 cl 克隆引擎直接处理（本地 ZipVoice），无需回落
  ttsPopulateEngineSelect();
  ttsPopulateVoiceSelect();
  ttsSpeak();
  ttsRefreshUI();
}
function ttsStart() {
  if (tts.playing) return;
  ttsStartChapter(0);
}

// 统一发声调度
function ttsStale(token, myIndex) {
  return !tts.playing || tts.paused || token !== tts.speakToken || myIndex !== tts.index;
}
function ttsSpeak() {
  if (!tts.playing || tts.paused) return;
  if (tts.index >= tts.paragraphs.length) { ttsOnChapterEnd(); return; }
  const text = tts.paragraphs[tts.index];
  const myIndex = tts.index;
  const token = tts.speakToken;
  ttsHighlight(myIndex);
  ttsRefreshUI();
  const cb = {
    end: function () {
      if (ttsStale(token, myIndex)) return;
      tts.index++;
      ttsSpeak();
    },
    fail: function (msg) {
      if (ttsStale(token, myIndex)) return;
      ttsHandleEngineFail(msg);
    }
  };
  if (tts.engine === 'system') sysSpeak(text, token, cb);
  else if (tts.engine === 'online') { if (tts.onlineVoice === 'clone') clSpeak(text, token, cb); else onlineSpeak(text, token, cb); }
  else offlineSpeak(text, token, cb);
}

// ---------- 引擎 A0：系统语音 ----------
function sysSpeak(text, token, cb) {
  if (!ttsHasSynth()) { cb.fail('无系统语音'); return; }
  const startedAt = Date.now();
  const u = new SpeechSynthesisUtterance(text);
  const voice = ttsGetVoice();
  if (voice) { try { u.voice = voice; } catch (e) {} u.lang = voice.lang || 'zh-CN'; }
  else u.lang = 'zh-CN';
  u.rate = tts.rate; u.pitch = 1; u.volume = 1;
  u.onstart = function () { if (!ttsStale(token, tts.index)) ttsHighlight(tts.index); };
  u.onend = function () {
    if (ttsStale(token, tts.index)) return;
    if (text.length >= 12 && Date.now() - startedAt < 250) {
      cb.fail('语音未能正常发声，请检查系统语音包或改用在线/离线音源');
      return;
    }
    cb.end();
  };
  u.onerror = function (e) {
    if (ttsStale(token, tts.index)) return;
    if (e && (e.error === 'interrupted' || e.error === 'canceled')) return;
    cb.fail('系统语音启动失败' + (e && e.error ? '（' + e.error + '），可切换在线/离线音源' : ''));
  };
  ttsStartWatchdog();
  try { window.speechSynthesis.speak(u); } catch (e) { cb.fail('系统语音启动失败：' + e.message); }
}

// ---------- 录入我的声音（克隆样本：录音/试听/本机保存；克隆合成待引擎接入后打通） ----------
const clone = {
  db: null, blob: null, mime: '', url: null, hasRecording: false, refText: '',

const CLONE_DB = 'biquge_db', CLONE_STORE = 'kv', CLONE_KEY = 'my_voice', CLONE_AUDIO_STORE = 'clone_audio';
function cloneOpenDB() {
  return new Promise(function (res) {
    if (clone.db) return res(clone.db);
    if (!window.indexedDB) return res(null);
    let req;
    try { req = indexedDB.open(CLONE_DB, 2); } catch (e) { return res(null); }
    req.onupgradeneeded = function (ev) {
      const db = ev.target.result;
      if (!db.objectStoreNames.contains(CLONE_STORE)) db.createObjectStore(CLONE_STORE);
      if (!db.objectStoreNames.contains(CLONE_AUDIO_STORE)) db.createObjectStore(CLONE_AUDIO_STORE);

  });
}

  const db = await cloneOpenDB(); if (!db) return;

        const rec = tx.result;
        if (rec && rec.blob) { clone.blob = rec.blob; clone.mime = rec.mime || ''; clone.hasRecording = true; clone.refText = rec.refText || ''; clone.url = URL.createObjectURL(rec.blob); }

}
function clonePersist() {

        const tx = db.transaction(CLONE_STORE, 'readwrite').objectStore(CLONE_STORE)
          .put({ blob: clone.blob, mime: clone.mime, refText: clone.refText, at: Date.now() }, CLONE_KEY);
        tx.onsuccess = function () { res(true); }; tx.onerror = function () { res(false); };
      } catch (e) { res(false); }
    });
  });
}
function cloneErase() {
  return new Promise(function (res) {
    cloneOpenDB().then(function (db) {
      if (!db) return res();
      try {
        const tx = db.transaction(CLONE_STORE, 'readwrite').objectStore(CLONE_STORE).delete(CLONE_KEY);

    });

}
function cloneSupported() {

function cloneFmt(s) { s = Math.max(0, Math.floor(s)); return ('0' + Math.floor(s / 60)).slice(-2) + ':' + ('0' + (s % 60)).slice(-2); }
function cloneSetStatus(txt, isRec) { const el = document.getElementById('cloneStatus'); if (el) { el.textContent = txt; el.className = 'clone-status' + (isRec ? ' rec' : ''); } }

function cloneStopStream() {

  try { if (clone.mr && clone.mr.state !== 'inactive') clone.mr.stop(); } catch (e) {}

}
async function cloneToggleRec() {

    ['audio/webm;codecs=opus', 'audio/webm', 'audio/mp4', 'audio/ogg;codecs=opus'].forEach(function (c) {

    }, 250);

    cloneSetStatus('正在录音…再次点击停止', true);
  } catch (err) {

}
function cloneStopRec() {

// ---------- 引擎 A：百度在线 TTS ----------
const online = { audio: null, sentences: [], si: 0, retry: 0, watchdog: null };
function onlineClearDog() { if (online.watchdog) { clearTimeout(online.watchdog); online.watchdog = null; } }
function onlineSplit(text) {
  const out = [];
  const LIMIT = 150;
  // 先按强标点断句，保留分隔符
  const parts = String(text).split(/(?<=[。！？!?\n])/);
  for (let p of parts) {
    p = p.trim();
    if (!p) continue;
    if (p.length <= LIMIT) { out.push(p); continue; }
    // 过长再按弱标点切
    const subs = p.split(/(?<=[，；、,;：:])/);
    let buf = '';
    for (let s of subs) {
      if ((buf + s).length <= LIMIT) buf += s;
      else { if (buf) out.push(buf); if (s.length <= LIMIT) buf = s; else { while (s.length) { out.push(s.slice(0, LIMIT)); s = s.slice(LIMIT); } } buf = s; }
    }
    if (buf) out.push(buf);
  }
  return out.length ? out : [String(text)];
}
function onlineSpd() {
  const r = tts.rate;
  if (r <= 0.85) return 2;
  if (r <= 1.15) return 3;
  if (r <= 1.5) return 4;
  return 5;
}
function onlineSpeak(text, token, cb) {
  online.sentences = onlineSplit(text);
  online.si = 0; online.retry = 0;
  onlinePlayNext(token, cb);
}
function onlinePlayNext(token, cb) {
  if (ttsStale(token, tts.index)) return;

  if (online.si >= online.sentences.length) { cb.end(); return; }
  const s = online.sentences[online.si];
  const url = 'https://fanyi.baidu.com/gettts?lan=zh&spd=' + onlineSpd() + '&source=web&text=' + encodeURIComponent(s);
  if (!online.audio) online.audio = new Audio();
  const a = online.audio;
  // 关键：媒体请求不带 Referer，否则百度 gettts 对第三方来源返回空(手机流量/微信内同样适用)；老内核不支持该属性则由 <meta name=referrer> 兜底
  try { a.referrerPolicy = 'no-referrer'; } catch (e) {}
  let advanced = false;
  const advance = function () {
    if (advanced || ttsStale(token, tts.index)) return;
    advanced = true; onlineClearDog(); online.si++; online.retry = 0; onlinePlayNext(token, cb);
  };
  const retryOrFail = function (why) {
    if (advanced || ttsStale(token, tts.index)) return;
    if (online.retry < 2) {
      online.retry++;
      onlineClearDog();
      online.watchdog = setTimeout(function () { onlinePlayNext(token, cb); }, 400);
    } else {
      onlineClearDog(); cb.fail(why || '在线语音获取失败（网络受限？），可切换离线引擎');
    }
  };
  // 看门狗：15 秒内既未播完也未报错，判定卡死并重试（避免弱网 stalled 永久挂起）
  online.watchdog = setTimeout(function () {
    try { a.pause(); } catch (e) {}
    retryOrFail('在线语音加载超时，已尝试切换');
  }, 15000);
  a.onended = advance;
  a.onerror = function () { retryOrFail('在线语音获取失败（网络受限？），可切换离线引擎'); };
  try {
    a.src = url;
    const p = a.play();
    if (p && p.catch) p.catch(function (err) {
      // 无用户手势等场景：交给看门狗/重试，不立即判死
      if (err && err.name === 'NotAllowedError') { return; }
      retryOrFail('在线语音播放被阻止，请重试或切换离线引擎');
    });

}
function onlinePause() { onlineClearDog(); try { online.audio && online.audio.pause(); } catch (e) {} }
function onlineResume() { try { if (online.audio) { const p = online.audio.play(); if (p && p.catch) p.catch(function(){}); } } catch (e) {} }
function onlineStop() {
  onlineClearDog();
  try {
    if (online.audio) {
      online.audio.onended = null; online.audio.onerror = null;
      online.audio.pause(); online.audio.removeAttribute('src');
    }
  } catch (e) {}
  online.sentences = []; online.si = 0; online.retry = 0;
}

const off = { worker: null, state: 'idle', numSpeakers: 174, actx: null, source: null,

    tts.engine = 'online'; tts.enginePref = 'online';
    try { localStorage.setItem('biquge_tts_engine', 'online'); } catch (e) {}
    ttsPopulateEngineSelect(); ttsPopulateVoiceSelect();

    return;
  }
  ttsFail(msg || '语音朗读失败，可尝试切换音源');
}
function ttsJumpPara(delta) {
  if (!tts.playing) { ttsStart(); return; }
  const next = tts.index + delta;
  if (next < 0) { showToast('已经是本章第一段'); return; }
  tts.speakToken++;
  ttsEngineQuiet();
  tts.paused = false;
  tts.index = next;
  ttsSpeak();
}
// 绝对跳转到指定段落（点击正文段落用），idx 为过滤空段后的朗读序号
function ttsJumpTo(idx) {
  if (!tts.playing) return false;
  if (typeof idx !== 'number' || isNaN(idx)) return false;
  if (idx < 0 || idx >= tts.paragraphs.length) return false;
  tts.speakToken++;
  ttsEngineQuiet();
  tts.paused = false;
  tts.waitingEngine = false;
  tts.index = idx;
  ttsSpeak();
  return true;
}
// 手机：选中文字后轻点屏幕任意处即取消选中（QQ/微信 X5 内点击不会自动收起选区，需手动 removeAllRanges）
// 注册在“点段落朗读”之前；命中取消时拦截本次轻点，避免同时触发朗读跳转或工具栏显隐
function ttsBindTapToClearSelection() {
  let startHasSel = false, sx = 0, sy = 0, moved = false;
  function selActive() {
    const s = window.getSelection();
    return !!(s && !s.isCollapsed && s.toString().length > 0);
  }
  function isEditable(t) {
    if (!t || !t.tagName) return false;
    return t.tagName === 'INPUT' || t.tagName === 'TEXTAREA' || !!t.isContentEditable;
  }
  document.addEventListener('touchstart', function (e) {
    if (isEditable(e.target)) { startHasSel = false; return; }
    startHasSel = selActive(); moved = false;
    const t0 = e.touches && e.touches[0];
    if (t0) { sx = t0.clientX; sy = t0.clientY; }
  }, true);
  document.addEventListener('touchmove', function (e) {
    const t0 = e.touches && e.touches[0];
    if (t0) { const dx = t0.clientX - sx, dy = t0.clientY - sy; if (dx * dx + dy * dy > 120) moved = true; }
  }, true);
  document.addEventListener('touchend', function (e) {
    if (isEditable(e.target)) return;
    if (startHasSel && !moved) { // 按下前已有选区且为轻点：本次只负责取消选中
      const s = window.getSelection();
      try { s && s.removeAllRanges(); } catch (_) {}
      e.preventDefault(); e.stopPropagation(); e.stopImmediatePropagation();
    }
    startHasSel = false;
  }, true);
  // 桌面/鼠标兜底：按下时若存在选区则清除（不拦截正常点击）
  document.addEventListener('mousedown', function (e) {
    if (isEditable(e.target)) return;
    if (selActive()) { const s = window.getSelection(); try { s.removeAllRanges(); } catch (_) {} }
  }, true);
}
// 开启听书后：点哪段就读哪段（捕获阶段拦截，避免冒泡触发工具栏显隐）
function ttsBindTapParagraph() {
  document.addEventListener('click', function (e) {
    if (!tts.playing) return;
    let p = null;
    try { p = e.target.closest ? e.target.closest('.reader-text p[data-tts-idx]') : null; } catch (err) { p = null; }
    if (!p) return;
    const idx = parseInt(p.getAttribute('data-tts-idx'), 10);
    if (isNaN(idx)) return;
    e.stopPropagation();
    e.preventDefault();
    if (idx !== tts.index && ttsJumpTo(idx)) showToast('从本段开始朗读');
  }, true);
}
function ttsStartWatchdog() {
  ttsStopWatchdog();

    if (tts.playing && !tts.paused && tts.engine === 'system') {

}
function ttsStopWatchdog() {
  if (tts.watchdog) { clearInterval(tts.watchdog); tts.watchdog = null; }
}
function ttsHighlight(i) {

function ttsRefreshUI() {
  const toggleBtn = document.getElementById('ttsToggleBtn');
  if (toggleBtn) toggleBtn.textContent = tts.playing ? (tts.paused ? '▶ 继续' : '⏸ 暂停') : '🔊 开始听书';

  const rateSel = document.getElementById('ttsRateSelect');

    else {

      let prefix = tts.paused ? '已暂停 · ' : '正在朗读 · ';
      if (tts.waitingEngine) prefix = '引擎加载中 · ';
      barText.textContent = prefix + '第 ' + pos + '/' + total + ' 段';
