<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="other">
<meta name="theme-color" content="#12141c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>密码生成器 — 妙搭小站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#12141c; --txt:#e9eef7; --sub:#8b97b0; --gold:#e8c77a; --c:#46c39a; }
  html,body{background:var(--bg);}
  body{min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt);
    display:flex;flex-direction:column;align-items:center;padding:28px 14px 34px;
    background:radial-gradient(ellipse at 12% 0%,rgba(70,195,154,.14) 0%,transparent 52%),
      radial-gradient(ellipse at 88% 6%,rgba(232,199,122,.10) 0%,transparent 50%),var(--bg);}
  .top{width:100%;max-width:700px;display:flex;justify-content:flex-start;margin-bottom:16px;}
  .back{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;text-decoration:none;
    background:rgba(33,41,62,.85);border:1px solid #2c3650;color:var(--sub);font-size:13.5px;transition:.2s;min-height:44px;}
  .back:hover{background:rgba(232,199,122,.12);border-color:var(--gold);color:var(--gold);}
  .head{text-align:center;margin:6px 0 4px;}
  .head h1{font-family:"STKaiti","KaiTi","楷体",serif;font-size:36px;letter-spacing:8px;margin-bottom:8px;
    background:linear-gradient(135deg,#7fe0c0,#46c39a 50%,#bdf0dd);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .head p{color:var(--sub);font-size:13.5px;letter-spacing:1px;line-height:1.8;}
  .output{width:100%;max-width:700px;margin:18px 0 6px;padding:18px 20px;border-radius:14px;
    background:rgba(255,255,255,.04);border:1px solid rgba(70,195,154,.3);display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  #pwd{font-size:26px;letter-spacing:2px;color:var(--txt);word-break:break-all;font-family:Consolas,monospace;flex:1;min-width:200px;}
  .copy{padding:11px 18px;border-radius:9px;font-size:14px;letter-spacing:1px;color:#12141c;background:var(--gold);
    border:none;cursor:pointer;font-weight:600;min-height:44px;}
  .copy:active{transform:scale(.97);}
  .strength{width:100%;max-width:700px;display:flex;align-items:center;gap:12px;margin:8px 0 16px;}
  .bar{flex:1;height:8px;border-radius:4px;background:rgba(255,255,255,.08);overflow:hidden;}
  .bar i{display:block;height:100%;width:0;border-radius:4px;transition:width .3s,background .3s;}
  .stxt{font-size:13px;color:var(--sub);min-width:60px;text-align:right;}
  .opts{width:100%;max-width:700px;display:flex;flex-direction:column;gap:14px;padding:20px;border-radius:14px;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.1);}
  .opt-row{display:flex;align-items:center;justify-content:space-between;gap:12px;flex-wrap:wrap;}
  .opt-row label{color:var(--sub);font-size:14.5px;}
  .opt-row input[type=number]{width:86px;padding:10px;border-radius:8px;background:#1b1f2c;border:1px solid #2c3650;
    color:var(--txt);font-size:15px;text-align:center;outline:none;min-height:44px;}
  .opt-row input[type=number]:focus{border-color:var(--gold);}
  .chk-row{display:flex;flex-wrap:wrap;gap:10px;}
  .chk{display:flex;align-items:center;gap:8px;padding:10px 14px;border-radius:9px;cursor:pointer;
    background:rgba(33,41,62,.85);border:1px solid #2c3650;color:var(--sub);font-size:13.5px;user-select:none;min-height:44px;transition:.2s;}
  .chk.on{color:var(--txt);border-color:var(--gold);}
  .chk input{display:none;}
  .gen-row{width:100%;max-width:700px;display:flex;gap:10px;justify-content:center;margin-top:16px;flex-wrap:wrap;}
  .btn{padding:13px 26px;border-radius:10px;font-size:15px;letter-spacing:2px;cursor:pointer;transition:.2s;min-height:48px;}
  .btn.primary{background:var(--gold);color:#12141c;border:none;font-weight:600;}
  .btn.ghost{background:rgba(33,41,62,.85);border:1px solid #2c3650;color:var(--txt);}
  .btn:hover{transform:translateY(-2px);}
  .list{width:100%;max-width:700px;margin-top:16px;display:flex;flex-direction:column;gap:6px;}
  .lrow{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;border-radius:9px;
    background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.07);font-family:Consolas,monospace;font-size:14px;gap:10px;}
  .lrow button{background:none;border:none;color:var(--gold);cursor:pointer;font-size:13px;min-height:40px;padding:0 8px;}
  .foot{margin-top:26px;color:#566079;font-size:12px;letter-spacing:2px;text-align:center;}
  @media (max-width:520px){.head h1{font-size:29px;letter-spacing:5px;}#pwd{font-size:20px;}}
</style>
</head>
<body>
  <div class="top"><a class="back" href="tools-hub.html">← 返回效率</a></div>
  <div class="head">
    <h1>密码生成器</h1>
    <p>强随机 · 可定制 —— 大小写、数字、符号自由组合，强度实时评估</p>
  </div>

  <div class="output">
    <span id="pwd">••••••••••••</span>
    <button class="copy" id="copyBtn">复制</button>
  </div>
  <div class="strength">
    <div class="bar"><i id="bar"></i></div>
    <span class="stxt" id="stxt">—</span>
  </div>

  <div class="opts">
    <div class="opt-row"><label>密码长度</label><input id="len" type="number" min="4" max="128" value="16"></div>
    <div class="opt-row"><label>生成数量</label><input id="count" type="number" min="1" max="12" value="5"></div>
    <div class="chk-row">
      <label class="chk on" id="cUpper"><input type="checkbox" checked>大写 A-Z</label>
      <label class="chk on" id="cLower"><input type="checkbox" checked>小写 a-z</label>
      <label class="chk on" id="cDigit"><input type="checkbox" checked>数字 0-9</label>
      <label class="chk on" id="cSym"><input type="checkbox" checked>符号 !@#$%</label>
      <label class="chk" id="cNoAmb"><input type="checkbox">排除易混字符（0O1lI）</label>
    </div>
  </div>
  <div class="gen-row">
    <button class="btn primary" id="genBtn">生成密码</button>
    <button class="btn ghost" id="clearBtn">清空列表</button>
  </div>
  <div class="list" id="list"></div>

  <div class="foot">妙搭小站 · 密码生成器 · 纯本地随机，绝不联网</div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  var CH={'upper':'ABCDEFGHIJKLMNOPQRSTUVWXYZ','lower':'abcdefghijklmnopqrstuvwxyz','digit':'0123456789','sym':'!@#$%^&*()-_=+[]{};:,.?/|'};
  var AMB={'upper':'ABCDEFGHJKLMNPQRSTUVWXYZ','lower':'abcdefghijkmnopqrstuvwxyz','digit':'23456789','sym':'!@#$%^&*()-_=+[]{};:,.?/|'};

  function randomChar(pool){
    var a=new Uint32Array(1);
    crypto.getRandomValues(a);
    return pool[a[0]%pool.length];
  }
  function entropy(len,sets){
    if(!sets.length)return 0;
    var space=0;
    sets.forEach(function(s){space+=CH[s].length;});
    return len*Math.log2(space);
  }
  function strength(len,sets){
    var e=entropy(len,sets);
    if(e>=90)return {w:100,txt:'极强',c:'#46c39a'};
    if(e>=70)return {w:80,txt:'强',c:'#7ce06b'};
    if(e>=50)return {w:60,txt:'中',c:'#f0b72a'};
    if(e>=35)return {w:40,txt:'弱',c:'#ff7a59'};
    return {w:20,txt:'极弱',c:'#e8453c'};
  }
  function generate(){
    var len=Math.max(4,Math.min(128,parseInt($('len').value,10)||16));
    var sets=[];
    if($('cUpper').querySelector('input').checked)sets.push('upper');
    if($('cLower').querySelector('input').checked)sets.push('lower');
    if($('cDigit').querySelector('input').checked)sets.push('digit');
    if($('cSym').querySelector('input').checked)sets.push('sym');
    if(!sets.length){$('stxt').textContent='至少选一种字符';$('bar').style.width='0';return [];}
    var noAmb=$('cNoAmb').querySelector('input').checked;
    var pools=sets.map(function(s){return noAmb?AMB[s]:CH[s];});
    var n=Math.max(1,Math.min(12,parseInt($('count').value,10)||5));
    var out=[];
    for(var k=0;k<n;k++){
      var pwd='';
      var need=Math.min(len,sets.length);
      var part=[];
      for(var i=0;i<need;i++)part.push(randomChar(pools[i%sets.length]));
      for(var j=need;j<len;j++)part.push(randomChar(pools[Math.floor(Math.random()*pools.length)]));
      for(var m=part.length-1;m>0;m--){var q=Math.floor(Math.random()*(m+1));var tmp=part[m];part[m]=part[q];part[q]=tmp;}
      pwd=part.join('');
      out.push(pwd);
    }
    var s=strength(len,sets);
    $('bar').style.width=s.w+'%';$('bar').style.background=s.c;
    $('stxt').textContent=s.txt+' · '+entropy(len,sets).toFixed(0)+' bit';
    return out;
  }
  function render(list){
    var box=$('list');box.innerHTML='';
    list.forEach(function(p){
      var row=document.createElement('div');row.className='lrow';
      var t=document.createElement('span');t.textContent=p;
      var b=document.createElement('button');b.textContent='复制';
      b.addEventListener('click',function(){
        navigator.clipboard.writeText(p).then(function(){
          b.textContent='✓ 已复制';setTimeout(function(){b.textContent='复制';},1500);
        }).catch(function(){
          var ta=document.createElement('textarea');ta.value=p;document.body.appendChild(ta);ta.select();
          try{document.execCommand('copy');b.textContent='✓ 已复制';setTimeout(function(){b.textContent='复制';},1500);}catch(e){}
          document.body.removeChild(ta);
        });
      });
      row.appendChild(t);row.appendChild(b);
      box.appendChild(row);
    });
    if(!list.length)box.innerHTML='<div class="lrow" style="justify-content:center;color:var(--sub)">生成的密码会显示在这里</div>';
  }
  function copyMain(){
    var p=$('pwd').textContent;
    navigator.clipboard.writeText(p).then(function(){
      $('copyBtn').textContent='✓ 已复制';setTimeout(function(){$('copyBtn').textContent='复制';},1500);
    }).catch(function(){
      var ta=document.createElement('textarea');ta.value=p;document.body.appendChild(ta);ta.select();
      try{document.execCommand('copy');$('copyBtn').textContent='✓ 已复制';setTimeout(function(){$('copyBtn').textContent='复制';},1500);}catch(e){}
      document.body.removeChild(ta);
    });
  }
  function makeChk(el){
    var input=el.querySelector('input');
    el.addEventListener('click',function(){
      input.checked=!input.checked;
      el.classList.toggle('on',input.checked);
      var p=generate();
      if(p.length){$('pwd').textContent=p[0];render(p);}
    });
  }
  ['cUpper','cLower','cDigit','cSym','cNoAmb'].forEach(function(id){makeChk($(id));});
  $('genBtn').addEventListener('click',function(){
    var p=generate();
    if(p.length){$('pwd').textContent=p[0];render(p);}
  });
  $('clearBtn').addEventListener('click',function(){render([]);});
  $('copyBtn').addEventListener('click',copyMain);
  $('len').addEventListener('input',function(){var p=generate();if(p.length){$('pwd').textContent=p[0];}});
  $('count').addEventListener('change',function(){var p=generate();if(p.length){render(p);}});
  var p=generate();
  if(p.length){$('pwd').textContent=p[0];render(p);}
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>

<script src="sounds.js"></script>
</body>
</html>
