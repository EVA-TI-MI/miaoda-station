<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#0f0d08">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'%3E%3Crect width='100' height='100' rx='20' fill='%230f0d08'/%3E%3Ctext x='50' y='69' font-size='56' text-anchor='middle' fill='%23e8453c' font-family='serif'%3E%E5%BE%8B%3C/text%3E%3C/svg%3E">
<title>节奏小游戏 - 妙搭小站</title>
<style>
  *{margin:0;padding:0;box-sizing:border-box;}
  :root{--bg:#0f0d08;--paper:#16130c;--txt:#e8dcc8;--sub:#9a8868;--gold:#d4a84b;--c:#e8453c;}
  html,body{background:var(--bg);}
  body{min-height:100vh;color:var(--txt);font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    display:flex;flex-direction:column;align-items:center;padding:18px 12px 30px;
    background:radial-gradient(ellipse at 15% 0%,color-mix(in srgb,var(--c) 12%,transparent) 0%,transparent 50%),var(--bg);}
  .wrap{width:100%;max-width:680px;}
  .top{display:flex;justify-content:space-between;align-items:center;margin-bottom:14px;}
  .back{display:inline-flex;align-items:center;gap:6px;padding:8px 14px;border-radius:8px;text-decoration:none;
    background:rgba(212,168,75,.08);border:1px solid rgba(212,168,75,.3);color:var(--sub);font-size:13px;transition:.2s;}
  .back:hover{color:var(--gold);border-color:var(--gold);}
  .head{text-align:center;margin-bottom:16px;}
  .head h1{font-family:"STKaiti","KaiTi","楷体",serif;font-size:30px;letter-spacing:6px;
    background:linear-gradient(135deg,#ff9a93,#e8453c 45%,#ffc4bf);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .head p{color:var(--sub);font-size:12px;letter-spacing:4px;margin-top:6px;}
  .panel{background:var(--paper);border:1px solid color-mix(in srgb,var(--c) 26%,transparent);
    border-radius:14px;padding:16px;margin-bottom:14px;}
  .lab{font-size:12px;color:var(--sub);margin:10px 0 8px;letter-spacing:2px;}
  .seg{display:flex;border:1px solid color-mix(in srgb,var(--c) 40%,transparent);border-radius:9px;overflow:hidden;}
  .seg button{flex:1;min-width:0;min-height:44px;background:transparent;color:var(--sub);border:none;font-size:14px;cursor:pointer;}
  .seg button.on{background:color-mix(in srgb,var(--c) 22%,transparent);color:var(--c);}
  .stats{display:flex;justify-content:space-between;gap:8px;text-align:center;margin-bottom:10px;}
  .stats div{flex:1;min-width:0;background:rgba(255,255,255,.03);border-radius:10px;padding:10px 4px;}
  .stats b{display:block;font-size:20px;color:var(--c);font-variant-numeric:tabular-nums;}
  .stats span{font-size:11px;color:var(--sub);letter-spacing:1px;}
  .bigbtn{width:100%;min-height:56px;border-radius:12px;border:1px solid var(--c);font-size:17px;letter-spacing:4px;
    background:color-mix(in srgb,var(--c) 18%,transparent);color:var(--c);cursor:pointer;}
  /* 游戏区 */
  .stage{position:relative;height:380px;border-radius:12px;overflow:hidden;display:grid;grid-template-columns:repeat(3,1fr);
    background:rgba(0,0,0,.35);border:1px solid color-mix(in srgb,var(--c) 30%,transparent);}
  .lane{position:relative;border-right:1px solid rgba(255,255,255,.08);}
  .lane:last-child{border-right:none;}
  .hitline{position:absolute;left:0;right:0;bottom:0;height:4px;background:var(--gold);box-shadow:0 0 10px var(--gold);}
  .note{position:absolute;left:15%;right:15%;height:18px;border-radius:6px;
    background:linear-gradient(180deg,#ffb3ad,var(--c));box-shadow:0 0 8px color-mix(in srgb,var(--c) 60%,transparent);}
  .judge{position:absolute;left:50%;top:18%;transform:translateX(-50%);font-size:22px;letter-spacing:3px;
    font-family:"STKaiti","KaiTi",serif;opacity:0;pointer-events:none;}
  .judge.pf{color:#ffd76a;} .judge.gd{color:#9df0c8;} .judge.ms{color:#ff8a82;}
  .judge.pop{animation:pop .5s ease-out;}
  @keyframes pop{0%{opacity:0;transform:translateX(-50%) scale(.6);}20%{opacity:1;transform:translateX(-50%) scale(1.15);}100%{opacity:0;transform:translateX(-50%) scale(1);}}
  .keys{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:10px;}
  .keybtn{height:56px;border-radius:12px;border:1px solid var(--c);background:color-mix(in srgb,var(--c) 14%,transparent);
    color:var(--c);font-size:18px;font-family:"STKaiti","KaiTi",serif;letter-spacing:2px;cursor:pointer;user-select:none;-webkit-user-select:none;}
  .keybtn:active{background:color-mix(in srgb,var(--c) 40%,transparent);}
  .hidden{display:none !important;}
  .endbox{text-align:center;}
  .grade{font-family:"STKaiti","KaiTi",serif;font-size:64px;letter-spacing:6px;color:var(--c);margin:8px 0;}
  .foot{margin-top:20px;color:#6a5a3e;font-size:12px;letter-spacing:2px;text-align:center;}
  @media (min-width:600px){ .stage{height:440px;} }
</style>
</head>
<body>
<div class="wrap">
  <div class="top">
    <a class="back" href="audio-hub.html">← 返回音乐</a>
  </div>
  <div class="head">
    <h1>节奏小游戏</h1>
    <p>RHYTHM GAME · 踩准判定线</p>
  </div>

  <!-- 设置 -->
  <div class="panel" id="panelSet">
    <div class="lab">选曲</div>
    <div class="seg" id="songSeg">
      <button data-s="0" class="on">小星星</button>
      <button data-s="1">欢乐颂</button>
    </div>
    <div class="lab">速度</div>
    <div class="seg" id="spdSeg">
      <button data-s="0.8">0.8×</button>
      <button data-s="1" class="on">1×</button>
      <button data-s="1.2">1.2×</button>
    </div>
    <div class="lab">最佳纪录</div>
    <div class="stats">
      <div><b id="bestScore">0</b><span>最高分</span></div>
      <div><b id="bestCombo">0</b><span>最高连击</span></div>
      <div><b id="bestGrade">-</b><span>最佳评级</span></div>
    </div>
    <button class="bigbtn" id="btnStart">开始游戏</button>
    <div style="font-size:12px;color:var(--sub);text-align:center;margin-top:8px;line-height:1.8">桌面键盘 D / F / J 击打三轨，移动端点下方大按钮。±40ms Perfect，±100ms Good。</div>
  </div>

  <!-- 游戏 -->
  <div class="panel hidden" id="panelGame">
    <div class="stats">
      <div><b id="stScore">0</b><span>得分</span></div>
      <div><b id="stCombo">0</b><span>连击</span></div>
      <div><b id="stAcc">-</b><span>Perfect</span></div>
    </div>
    <div class="stage" id="stage">
      <div class="lane" data-l="0"><div class="hitline"></div></div>
      <div class="lane" data-l="1"><div class="hitline"></div></div>
      <div class="lane" data-l="2"><div class="hitline"></div></div>
      <div class="judge" id="judge"></div>
    </div>
    <div class="keys">
      <button class="keybtn" data-l="0">D</button>
      <button class="keybtn" data-l="1">F</button>
      <button class="keybtn" data-l="2">J</button>
    </div>
  </div>

  <!-- 结算 -->
  <div class="panel hidden endbox" id="panelEnd">
    <div class="lab" style="margin-top:4px">本局评级</div>
    <div class="grade" id="grade">C</div>
    <div style="font-size:14px;color:var(--sub);margin-bottom:16px" id="endDetail"></div>
    <button class="bigbtn" id="btnRetry">再来一局</button>
    <div style="height:10px"></div>
    <button class="bigbtn" id="btnBackSet" style="min-height:48px">返回选曲</button>
  </div>

  <div class="foot">妙搭小站 · 音乐听觉 · 听音与律动</div>
</div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  function freq(m){ return 440*Math.pow(2,(m-69)/12); }

  // ===== 谱面（公共领域旋律内联）=====
  var TWINKLE=[[0,1],[0,1],[7,1],[7,1],[9,1],[9,1],[7,2],[5,1],[5,1],[4,1],[4,1],[2,1],[2,1],[0,2]];
  var ODE=[[4,1],[4,1],[5,1],[7,1],[7,1],[5,1],[4,1],[2,1],[0,1],[0,1],[2,1],[4,1],[4,1.5],[2,.5],[2,2]];
  function buildChart(mel){
    var notes=[],beat=0,laneCycle=[0,1,2,1];
    mel.forEach(function(n,i){
      notes.push({t:beat, lane:laneCycle[i%4], n:60+n[0]});
      beat+=n[1];
    });
    return notes;
  }
  var SONGS=[buildChart(TWINKLE),buildChart(ODE)];

  // ===== 状态 =====
  var song=0,speed=1,playing=false;
  var best={score:0,combo:0,grade:'-'};
  try{ var b=JSON.parse(localStorage.getItem('miaodaRhythm')||'{}');
    best.score=b.score||0; best.combo=b.combo||0; best.grade=b.grade||'-'; }catch(e){}
  $('bestScore').textContent=best.score;
  $('bestCombo').textContent=best.combo;
  $('bestGrade').textContent=best.grade;

  // ===== 音频 =====
  var ctx=null,master=null;
  function ac(){
    if(ctx) return ctx;
    var AC=window.AudioContext||window.webkitAudioContext;
    ctx=new AC(); master=ctx.createGain(); master.gain.value=.8; master.connect(ctx.destination);
    return ctx;
  }
  function playNote(m,t){
    var o=ctx.createOscillator(),g=ctx.createGain();
    o.type='triangle'; o.frequency.value=freq(m);
    g.gain.setValueAtTime(.0001,t);
    g.gain.exponentialRampToValueAtTime(.3,t+.02);
    g.gain.exponentialRampToValueAtTime(.0001,t+.5);
    o.connect(g); g.connect(master);
    o.start(t); o.stop(t+.55);
  }

  // ===== 游戏循环 =====
  var notes=[],raf=null,gameStart=0,H=380,lead=2.2,t0Perf=0;
  var score=0,combo=0,maxCombo=0,pf=0,gd=0,ms=0,hitted=0;
  var lanes=[],judgeEl=$('judge');
  function cur(){
    // AudioContext 时钟优先；上下文被挂起（如无音频设备/静音键）时回退性能时钟，保证游戏不卡死
    if(ctx && ctx.state==='running') return ctx.currentTime;
    return (performance.now()-t0Perf)/1000;
  }

  function showPanel(n){
    $('panelSet').classList.toggle('hidden',n!=='set');
    $('panelGame').classList.toggle('hidden',n!=='game');
    $('panelEnd').classList.toggle('hidden',n!=='end');
  }

  function startGame(){
    ac(); if(ctx.state==='suspended') ctx.resume();
    var stage=$('stage');
    lanes=stage.querySelectorAll('.lane');
    H=stage.clientHeight; lead=2.2;
    // 清旧音符
    stage.querySelectorAll('.note').forEach(function(e){e.remove();});
    score=0;combo=0;maxCombo=0;pf=0;gd=0;ms=0;hitted=0;
    updateStats();
    // 生成谱面实例
    var beatDur=.5/speed;
    gameStart=ctx.currentTime+0.4;
    notes=SONGS[song].map(function(n){
      var el=document.createElement('div'); el.className='note';
      lanes[n.lane].appendChild(el);
      var inst={t:gameStart+n.t*beatDur, lane:n.lane, n:n.n, el:el, done:false};
      playNote(n.n,inst.t);
      return inst;
    });
    playing=true;
    showPanel('game');
    t0Perf=performance.now();
    clearTimeout(raf);
    raf=setTimeout(loop,16);
  }

  function loop(){
    if(!playing) return;
    var now=cur();
    var alive=0;
    for(var i=0;i<notes.length;i++){
      var nt=notes[i];
      if(nt.done) continue;
      var dy=nt.t-now;
      if(dy>lead){ nt.el.style.display='none'; continue; }
      nt.el.style.display='block';
      var y=dy/lead*(H-24);
      nt.el.style.transform='translateY('+y+'px)';
      if(dy<-0.12){ // 漏接
        nt.done=true; ms++; hitted++; combo=0;
        nt.el.remove();
        flash('MISS','ms'); updateStats();
      }else alive++;
    }
    // 结束判定
    var lastT=notes.length?notes[notes.length-1].t:0;
    if(hitted>=notes.length || (notes.length && now>lastT+1.2)){ endGame(); return; }
    raf=setTimeout(loop,16);
  }

  function hitLane(l){
    if(!playing) return;
    var now=cur(),bestN=null,bestD=999;
    for(var i=0;i<notes.length;i++){
      var nt=notes[i];
      if(nt.done||nt.lane!==l) continue;
      var d=Math.abs(nt.t-now);
      if(d<bestD){ bestD=d; bestN=nt; }
    }
    if(bestN && bestD<=0.1){
      bestN.done=true; hitted++;
      bestN.el.remove();
      if(bestD<=0.04){ pf++; score+=100+combo*2; flash('PERFECT','pf'); }
      else{ gd++; score+=50; flash('GOOD','gd'); }
      combo++; if(combo>maxCombo) maxCombo=combo;
    }else{
      // 空打不惩罚，仅中断连击
      combo=0;
    }
    updateStats();
  }

  function flash(txt,cls){
    judgeEl.textContent=txt;
    judgeEl.className='judge '+cls;
    void judgeEl.offsetWidth;
    judgeEl.classList.add('pop');
  }
  function updateStats(){
    $('stScore').textContent=score;
    $('stCombo').textContent=combo;
    $('stAcc').textContent=pf;
  }

  function endGame(){
    playing=false; clearTimeout(raf);
    $('stage').querySelectorAll('.note').forEach(function(e){e.remove();});
    var total=notes.length;
    var acc=total?(pf+gd*0.5)/total:0;
    var grade = acc>=0.9?'S':acc>=0.75?'A':acc>=0.6?'B':'C';
    $('grade').textContent=grade;
    $('endDetail').textContent='得分 '+score+' · 最高连击 '+maxCombo+' · Perfect '+pf+' / Good '+gd+' / Miss '+ms;
    if(score>best.score){ best.score=score; }
    if(maxCombo>best.combo){ best.combo=maxCombo; }
    if(grade==='S'||(best.grade==='S'?true:grade==='S')) best.grade='S';
    else if(best.grade!=='S'){
      var order=['C','B','A','S'];
      if(order.indexOf(grade)>order.indexOf(best.grade)) best.grade=grade;
    }
    try{ localStorage.setItem('miaodaRhythm',JSON.stringify({score:best.score,combo:best.combo,grade:best.grade})); }catch(e){}
    $('bestScore').textContent=best.score; $('bestCombo').textContent=best.combo; $('bestGrade').textContent=best.grade;
    showPanel('end');
  }

  // ===== 控件 =====
  $('songSeg').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    $('songSeg').querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); song=+b.dataset.s;
  });
  $('spdSeg').addEventListener('click',function(e){
    var b=e.target.closest('button'); if(!b) return;
    $('spdSeg').querySelectorAll('button').forEach(function(x){x.classList.remove('on');});
    b.classList.add('on'); speed=parseFloat(b.dataset.s);
  });
  $('btnStart').onclick=startGame;
  $('btnRetry').onclick=startGame;
  $('btnBackSet').onclick=function(){ showPanel('set'); };
  document.querySelectorAll('.keybtn').forEach(function(b){
    b.addEventListener('pointerdown',function(e){ e.preventDefault(); hitLane(+b.dataset.l); });
  });
  document.addEventListener('keydown',function(e){
    if(e.repeat) return;
    var k=e.key.toLowerCase();
    if(k==='d') hitLane(0);
    else if(k==='f') hitLane(1);
    else if(k==='j') hitLane(2);
  });
})();
</script>
<script>
// 源码保护
(function(){
  document.addEventListener('contextmenu', function(e){ e.preventDefault(); });
  document.addEventListener('dragstart', function(e){ e.preventDefault(); });
  document.addEventListener('keydown', function(e){
    var key = e.key.toLowerCase();
    if (key === 'f12') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && e.shiftKey && (key === 'i' || key === 'j' || key === 'c')) { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 'u') { e.preventDefault(); return; }
    if ((e.ctrlKey || e.metaKey) && key === 's') { e.preventDefault(); return; }
  });
  document.addEventListener('selectstart', function(e){
    if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
    e.preventDefault();
  });
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>

<script src="sounds.js"></script>
</body>
</html>
