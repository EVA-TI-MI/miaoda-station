<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="creative-medium" content="other">
<meta name="theme-color" content="#12141c">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="icon-192.png">
<title>成就 · 排行榜 — 妙搭小站</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  :root{ --bg:#12141c; --txt:#e9eef7; --sub:#8b97b0; --gold:#e8c77a; --c:#ffd76a; }
  html,body{background:var(--bg);}
  body{min-height:100vh;font-family:"PingFang SC","Microsoft YaHei",sans-serif;color:var(--txt);
    display:flex;flex-direction:column;align-items:center;padding:28px 14px 40px;
    background:radial-gradient(ellipse at 12% 0%,rgba(255,215,106,.12) 0%,transparent 52%),
      radial-gradient(ellipse at 88% 6%,rgba(232,199,122,.09) 0%,transparent 50%),var(--bg);}
  .top{width:100%;max-width:820px;display:flex;justify-content:flex-start;margin-bottom:16px;}
  .back{display:inline-flex;align-items:center;gap:6px;padding:9px 16px;border-radius:8px;text-decoration:none;
    background:rgba(33,41,62,.85);border:1px solid #2c3650;color:var(--sub);font-size:13.5px;transition:.2s;min-height:44px;}
  .back:hover{background:rgba(232,199,122,.12);border-color:var(--gold);color:var(--gold);}
  .head{text-align:center;margin:6px 0 6px;}
  .head h1{font-family:"STKaiti","KaiTi","楷体",serif;font-size:36px;letter-spacing:8px;margin-bottom:8px;
    background:linear-gradient(135deg,#ffe08f,#ffd76a 50%,#fff3c4);-webkit-background-clip:text;background-clip:text;-webkit-text-fill-color:transparent;}
  .head p{color:var(--sub);font-size:13.5px;letter-spacing:1px;line-height:1.8;}
  .overview{width:100%;max-width:820px;display:grid;grid-template-columns:repeat(4,1fr);gap:10px;margin:18px 0 22px;}
  .ov{padding:16px 12px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,215,106,.18);text-align:center;}
  .ov .n{font-size:26px;font-weight:bold;color:var(--gold);font-family:"STKaiti","KaiTi",serif;}
  .ov .l{color:var(--sub);font-size:12.5px;margin-top:5px;letter-spacing:1px;}
  .sect{width:100%;max-width:820px;margin-bottom:24px;}
  .sect h2{font-size:17px;letter-spacing:3px;color:var(--txt);margin-bottom:12px;display:flex;align-items:center;gap:10px;
    font-family:"STKaiti","KaiTi",serif;}
  .sect h2::before{content:'';width:4px;height:18px;background:var(--gold);border-radius:2px;}
  .grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;}
  .item{padding:15px 16px;border-radius:12px;background:rgba(255,255,255,.03);border:1px solid rgba(255,255,255,.08);transition:.2s;}
  .item:hover{border-color:rgba(255,215,106,.4);transform:translateY(-2px);}
  .item .nm{font-size:14.5px;color:var(--txt);font-weight:600;}
  .item .dt{font-size:12.5px;color:#566079;margin-top:3px;}
  .item .v{font-size:17px;color:var(--gold);margin-top:7px;font-variant-numeric:tabular-nums;}
  .item .v.none{color:#566079;font-size:13px;}
  .rank{width:100%;max-width:820px;display:flex;flex-direction:column;gap:7px;}
  .rrow{display:flex;align-items:center;gap:12px;padding:12px 16px;border-radius:11px;
    background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.08);}
  .rrow .no{width:26px;height:26px;border-radius:50%;background:rgba(255,215,106,.15);color:var(--gold);
    display:flex;align-items:center;justify-content:center;font-size:13px;font-weight:600;flex-shrink:0;}
  .rrow .no.top{background:var(--gold);color:#12141c;}
  .rrow .who{flex:1;font-size:15px;}
  .rrow .sc{color:var(--gold);font-size:15px;font-weight:600;}
  .foot{margin-top:10px;color:#566079;font-size:12px;letter-spacing:2px;text-align:center;}
  @media (max-width:600px){.head h1{font-size:29px;letter-spacing:5px;}.overview{grid-template-columns:repeat(2,1fr);}.grid{grid-template-columns:1fr;}}
</style>
</head>
<body>
  <div class="top"><a class="back" href="index.html">← 返回首页</a></div>
  <div class="head">
    <h1>成就 · 排行榜</h1>
    <p>本站所有小游戏最佳成绩汇总 —— 数据存于本地浏览器，换设备会重新开始</p>
  </div>

  <div class="overview">
    <div class="ov"><div class="n" id="oGames">—</div><div class="l">已收录玩法</div></div>
    <div class="ov"><div class="n" id="oRecords">—</div><div class="l">有成绩记录</div></div>
    <div class="ov"><div class="n" id="oWins">—</div><div class="l">对弈总胜场</div></div>
    <div class="ov"><div class="n" id="oRead">—</div><div class="l">阅读分钟</div></div>
  </div>

  <div class="sect"><h2>棋院 · 对弈战绩</h2><div class="grid" id="secChess"></div></div>
  <div class="sect"><h2>棋盘棋 · 最佳</h2><div class="grid" id="secBoard"></div></div>
  <div class="sect"><h2>益智 · 最佳</h2><div class="grid" id="secPuzzle"></div></div>
  <div class="sect"><h2>经典 · 最佳</h2><div class="grid" id="secClassic"></div></div>
  <div class="sect"><h2>街机 · 最佳</h2><div class="grid" id="secArcade"></div></div>
  <div class="sect"><h2>腾蛇 · 玩家排行</h2><div class="rank" id="snakeRank"></div></div>
  <div class="sect"><h2>墨渊阁 · 阅读统计</h2><div class="grid" id="secRead"></div></div>

  <div class="foot">妙搭小站 · 成就总览 · 纯本地</div>

<script>
(function(){
  'use strict';
  var $=function(id){return document.getElementById(id);};
  function get(key){try{return JSON.parse(localStorage.getItem(key)||'null');}catch(e){return null;}}
  function raw(key){try{return localStorage.getItem(key);}catch(e){return null;}}
  function fmtTime(s){if(s==null||isNaN(s))return null;var m=Math.floor(s/60),sec=s%60;return m+':'+(sec<10?'0':'')+sec;}
  function fmtNum(v){return v==null?'—':String(v);}

  function itemEl(name,desc,val){
    var d=document.createElement('div');d.className='item';
    d.innerHTML='<div class="nm">'+name+'</div><div class="dt">'+desc+'</div><div class="v">'+val+'</div>';
    return d;
  }
  function noneVal(){return '<span class="v none">还没有记录</span>';}
  function valOrNone(v){return v==null||v===''?noneVal():'<span class="v">'+v+'</span>';}

  function mapBest(key,subs){
    var m=get(key);
    if(!m||typeof m!=='object')return null;
    var parts=[];
    subs.forEach(function(s){
      var v=m[s.k];
      if(v!=null)parts.push(s.t(s.k,v));
    });
    return parts.length?parts.join(' · '):null;
  }

  function wld(key,label,href){
    var r=get(key)||{};
    var w=r.w||0,l=r.l||0,d=r.d||0,tot=w+l+d;
    var wr=tot?Math.round(w/tot*100)+'%':'—';
    var val=(w||0)+' 胜 / '+(l||0)+' 负 / '+(d||0)+' 和 · 胜率 '+wr;
    var el=itemEl(label,'对局统计',(tot||w||l||d)?'<span class="v">'+val+'</span>':noneVal());
    return el;
  }

  // ===== 棋院 =====
  var secChess=$('secChess');
  secChess.appendChild(wld('go_record','围棋 · 对弈','go.html'));
  secChess.appendChild(wld('xq_record','中国象棋 · 对弈','xiangqi.html'));
  secChess.appendChild(wld('ic_record','国际象棋 · 对弈','intchess.html'));
  secChess.appendChild(wld('gomoku_record','五子棋 · 对弈','gomoku.html'));
  secChess.appendChild(wld('shogi_record','将棋 · 对弈','shogi.html'));
  secChess.appendChild(wld('draughts_record','国际跳棋 · 对弈','draughts.html'));

  // ===== 棋盘棋 =====
  var secBoard=$('secBoard');
  secBoard.appendChild(itemEl('黑白棋（奥赛罗）','AI 对弈最大领先子数',valOrNone(raw('miaodaReversiBestV45'))));
  var ck=mapBest('miaodaCheckersBestV45',[{k:'2p',t:function(k,v){return '双人 '+v+' 步';}},{k:'3p',t:function(k,v){return '三人 '+v+' 步';}}]);
  secBoard.appendChild(itemEl('跳棋（波子棋）','最少步数',ck?('<span class="v">'+ck+'</span>'):noneVal()));
  secBoard.appendChild(itemEl('军棋 · 暗棋','最高连胜',valOrNone(raw('miaodaJunqiBestV45'))));
  secBoard.appendChild(itemEl('斗兽棋','最高连胜',valOrNone(raw('miaodaAnimalsBestV45'))));

  // ===== 益智 =====
  var secPuzzle=$('secPuzzle');
  var hrd=mapBest('miaodaHrdBestV42',[{k:'横刀立马',t:function(k,v){return '横刀立马 '+v+' 步';}},{k:'其他',t:function(k,v){return v+' 步';}}]);
  // 华容道按布局，动态取键
  var hrdMap=get('miaodaHrdBestV42');
  var hrdParts=[];
  if(hrdMap&&typeof hrdMap==='object'){
    var order=['横刀立马','层层设防','峰回路转','兵分三路','四面楚歌','齐头并进'];
    order.forEach(function(name){if(hrdMap[name]!=null)hrdParts.push(name+' '+hrdMap[name]+' 步');});
    Object.keys(hrdMap).forEach(function(k){if(order.indexOf(k)<0&&hrdMap[k]!=null)hrdParts.push(k+' '+hrdMap[k]+' 步');});
  }
  secPuzzle.appendChild(itemEl('华容道','各布局最少步数',hrdParts.length?('<span class="v">'+hrdParts.slice(0,4).join(' · ')+(hrdParts.length>4?' …':'')+'</span>'):noneVal()));
  var su=mapBest('miaodaSudokuBestV42',[{k:'easy',t:function(){return '简单';}},{k:'medium',t:function(){return '中等';}},{k:'hard',t:function(){return '困难';}}]);
  // 数独按难度秒数
  var suMap=get('miaodaSudokuBestV42'),suParts=[];
  if(suMap&&typeof suMap==='object'){
    [['easy','简单'],['medium','中等'],['hard','困难']].forEach(function(p){if(suMap[p[0]]!=null)suParts.push(p[1]+' '+fmtTime(suMap[p[0]]));});
  }
  secPuzzle.appendChild(itemEl('数独','各难度最快用时',suParts.length?('<span class="v">'+suParts.join(' · ')+'</span>'):noneVal()));
  var nn=mapBest('miaodaNonogramBestV46',[{k:5,t:function(){return '5路';}},{k:8,t:function(){return '8路';}},{k:10,t:function(){return '10路';}},{k:15,t:function(){return '15路';}}]);
  var nnMap=get('miaodaNonogramBestV46'),nnParts=[];
  if(nnMap&&typeof nnMap==='object'){[5,8,10,15].forEach(function(s){if(nnMap[s]!=null)nnParts.push(s+'路 '+fmtTime(nnMap[s]));});}
  secPuzzle.appendChild(itemEl('数织（Nonogram）','各尺寸最快用时',nnParts.length?('<span class="v">'+nnParts.join(' · ')+'</span>'):noneVal()));
  var sl=mapBest('miaodaSlitherBestV46',[{k:'5-0.55',t:function(){return '5';}},{k:'8-0.35',t:function(){return '8';}}]);
  var slMap=get('miaodaSlitherBestV46'),slParts=[];
  if(slMap&&typeof slMap==='object'){
    var cnt=0;
    Object.keys(slMap).forEach(function(k){
      if(slMap[k]!=null&&cnt<3){slParts.push(k.replace('-','×')+' '+fmtTime(slMap[k]));cnt++;}
    });
  }
  secPuzzle.appendChild(itemEl('数回（Slitherlink）','各尺寸最快用时',slParts.length?('<span class="v">'+slParts.join(' · ')+'</span>'):noneVal()));
  var c24=get('miaodaCalc24BestV46');
  secPuzzle.appendChild(itemEl('24 点','最高连对',c24&&c24.s!=null?('<span class="v">'+c24.s+' 连对</span>'):noneVal()));
  var gn=mapBest('miaodaGuessNumBestV46',[{k:3,t:function(){return '3位';}},{k:4,t:function(){return '4位';}},{k:5,t:function(){return '5位';}}]);
  var gnMap=get('miaodaGuessNumBestV46'),gnParts=[];
  if(gnMap&&typeof gnMap==='object'){[3,4,5].forEach(function(s){if(gnMap[s]!=null)gnParts.push(s+'位 '+gnMap[s]+' 次');});}
  secPuzzle.appendChild(itemEl('猜数字','各位数最少次数',gnParts.length?('<span class="v">'+gnParts.join(' · ')+'</span>'):noneVal()));
  var hashi=mapBest('miaodaHashiBestV47',[{k:'6-0.5',t:function(){return '6×6';}},{k:'8-0.65',t:function(){return '8×8';}}]);
  var hsMap=get('miaodaHashiBestV47'),hsParts=[];
  if(hsMap&&typeof hsMap==='object'){var hcnt=0;Object.keys(hsMap).forEach(function(k){if(hsMap[k]!=null&&hcnt<3){hsParts.push(k.replace('-','×')+' '+fmtTime(hsMap[k]));hcnt++;}});}
  secPuzzle.appendChild(itemEl('数桥（Hashi）','各规格最快用时',hsParts.length?('<span class="v">'+hsParts.join(' · ')+'</span>'):noneVal()));
  var nuri=mapBest('miaodaNurikabeBestV47',[{k:'5-easy',t:function(){return '5×5';}},{k:'7-easy',t:function(){return '7×7';}}]);
  var nrMap=get('miaodaNurikabeBestV47'),nrParts=[];
  if(nrMap&&typeof nrMap==='object'){var ncnt=0;Object.keys(nrMap).forEach(function(k){if(nrMap[k]!=null&&ncnt<3){nrParts.push(k.split('-')[0]+'×'+k.split('-')[0]+' '+fmtTime(nrMap[k]));ncnt++;}});}
  secPuzzle.appendChild(itemEl('数墙（Nurikabe）','各规格最快用时',nrParts.length?('<span class="v">'+nrParts.join(' · ')+'</span>'):noneVal()));
  var ak=mapBest('miaodaAkariBestV47',[{k:'5-0.15',t:function(){return '5×5';}},{k:'7-0.25',t:function(){return '7×7';}}]);
  var akMap=get('miaodaAkariBestV47'),akParts=[];
  if(akMap&&typeof akMap==='object'){var acnt=0;Object.keys(akMap).forEach(function(k){if(akMap[k]!=null&&acnt<3){akParts.push(k.replace('-','×')+' '+fmtTime(akMap[k]));acnt++;}});}
  secPuzzle.appendChild(itemEl('美术馆（Akari）','各规格最快用时',akParts.length?('<span class="v">'+akParts.join(' · ')+'</span>'):noneVal()));

  // ===== 经典 =====
  var secClassic=$('secClassic');
  var so=mapBest('miaodaSokobanBestV43',[{k:1,t:function(){return '第1关';}}]);
  var soMap=get('miaodaSokobanBestV43'),soParts=[];
  if(soMap&&typeof soMap==='object'){var keys=Object.keys(soMap).sort(function(a,b){return a-b;});keys.slice(0,3).forEach(function(k){soParts.push('第'+k+'关 '+soMap[k]+' 步');});if(keys.length>3)soParts.push('…共'+keys.length+'关');}
  secClassic.appendChild(itemEl('推箱子','各关最少步数',soParts.length?('<span class="v">'+soParts.join(' · ')+'</span>'):noneVal()));
  secClassic.appendChild(itemEl('2048','最高分',valOrNone(raw('miaoda2048BestV43'))));
  var mi=mapBest('miaodaMineBestV43',[{k:'easy',t:function(){return '简单';}},{k:'medium',t:function(){return '中等';}},{k:'hard',t:function(){return '困难';}}]);
  var miMap=get('miaodaMineBestV43'),miParts=[];
  if(miMap&&typeof miMap==='object'){[['easy','简单'],['medium','中等'],['hard','困难']].forEach(function(p){if(miMap[p[0]]!=null)miParts.push(p[1]+' '+fmtTime(miMap[p[0]]));});}
  secClassic.appendChild(itemEl('扫雷','各难度最快',miParts.length?('<span class="v">'+miParts.join(' · ')+'</span>'):noneVal()));
  secClassic.appendChild(itemEl('跳一跳','最高分',valOrNone(raw('miaodaJumpBestV43'))));
  var ll=mapBest('miaodaLianlianBestV47',[{k:'4x4',t:function(){return '4×4';}},{k:'6x6',t:function(){return '6×6';}},{k:'8x8',t:function(){return '8×8';}}]);
  var llMap=get('miaodaLianlianBestV47'),llParts=[];
  if(llMap&&typeof llMap==='object'){Object.keys(llMap).forEach(function(k){if(llMap[k]!=null)llParts.push(k.replace('x','×')+' '+fmtTime(llMap[k]));});}
  secClassic.appendChild(itemEl('连连看','各规格最快用时',llParts.length?('<span class="v">'+llParts.join(' · ')+'</span>'):noneVal()));
  var p15=get('miaodaP15BestV47');
  secClassic.appendChild(itemEl('数字华容道','最快用时',p15&&p15['15p']!=null?('<span class="v">'+fmtTime(p15['15p'])+'</span>'):noneVal()));

  // ===== 街机 =====
  var secArcade=$('secArcade');
  secArcade.appendChild(itemEl('俄罗斯方块','最高分',valOrNone(raw('miaodaTetrisBestV44'))));
  secArcade.appendChild(itemEl('打砖块','最高分',valOrNone(raw('miaodaBreakoutBestV44'))));
  var me=mapBest('miaodaMemoryBestV44',[{k:8,t:function(){return '8张';}},{k:12,t:function(){return '12张';}},{k:16,t:function(){return '16张';}},{k:20,t:function(){return '20张';}}]);
  var meMap=get('miaodaMemoryBestV44'),meParts=[];
  if(meMap&&typeof meMap==='object'){Object.keys(meMap).slice(0,4).forEach(function(k){meParts.push(k+'张 '+meMap[k]+' 步');});}
  secArcade.appendChild(itemEl('记忆翻牌','各牌数最少步数',meParts.length?('<span class="v">'+meParts.join(' · ')+'</span>'):noneVal()));
  secArcade.appendChild(itemEl('打地鼠','最高分',valOrNone(raw('miaodaMoleBestV44'))));
  secArcade.appendChild(itemEl('恐龙跑酷','最高分',valOrNone(raw('miaodaDinoBestV44'))));
  secArcade.appendChild(itemEl('乒乓球','最高分',valOrNone(raw('miaodaPongBestV44'))));

  // ===== 腾蛇排行 =====
  var users=get('neonSnakeUsers')||[];
  var rank=$('snakeRank');
  var cur=raw('neonSnakeCurrentUser');
  if(!users.length){
    rank.innerHTML='<div class="rrow" style="justify-content:center;color:var(--sub)">还没有玩家数据，先去玩一局腾蛇</div>';
  }else{
    var list=users.map(function(u){
      var sc=0;
      try{sc=parseInt(localStorage.getItem('neonSnakeHighScore_'+u.username)||'0',10)||0;}catch(e){}
      return {name:u.username,sc:sc};
    }).sort(function(a,b){return b.sc-a.sc;});
    list.slice(0,10).forEach(function(u,i){
      var row=document.createElement('div');row.className='rrow';
      var no=document.createElement('div');no.className='no'+(i<3?' top':'');no.textContent=i+1;
      var who=document.createElement('div');who.className='who';
      who.textContent=(u.name===cur?'★ ':'')+u.name;
      var sc=document.createElement('div');sc.className='sc';sc.textContent=String(u.sc);
      row.appendChild(no);row.appendChild(who);row.appendChild(sc);
      rank.appendChild(row);
    });
  }

  // ===== 墨渊阁 =====
  var secRead=$('secRead');
  var secs=parseInt(raw('biquge_read_seconds')||'0',10)||0;
  secRead.appendChild(itemEl('累计阅读','墨渊阁阅读时长',secs?('<span class="v">'+Math.floor(secs/60)+' 分 '+secs%60+' 秒</span>'):noneVal()));
  var shelf=get('biquge_shelf')||[];
  secRead.appendChild(itemEl('书架藏书','已加入书架',shelf.length?('<span class="v">'+shelf.length+' 本</span>'):noneVal()));
  var fav=get('biquge_favorites')||[];
  secRead.appendChild(itemEl('收藏','收藏的书',fav.length?('<span class="v">'+fav.length+' 本</span>'):noneVal()));
  var pomo=get('miaodaPomodoroStatsV46')||{};
  secRead.appendChild(itemEl('番茄钟','累计完成（全部）',(pomo.total!=null&&pomo.total>0)?('<span class="v">'+pomo.total+' 个</span>'):noneVal()));

  // ===== 总览 =====
  $('oGames').textContent=11+10+12+10;
  var recCount=0;
  var allKeys=['go_record','xq_record','ic_record','gomoku_record','miaodaReversiBestV45','miaodaCheckersBestV45','miaodaJunqiBestV45','miaodaAnimalsBestV45','miaodaHrdBestV42','miaodaSudokuBestV42','miaodaNonogramBestV46','miaodaSlitherBestV46','miaodaCalc24BestV46','miaodaGuessNumBestV46','miaodaSokobanBestV43','miaoda2048BestV43','miaodaMineBestV43','miaodaJumpBestV43','miaodaTetrisBestV44','miaodaBreakoutBestV44','miaodaMemoryBestV44','miaodaMoleBestV44','miaodaDinoBestV44','miaodaPongBestV44','biquge_read_seconds','miaodaPomodoroStatsV46','shogi_record','draughts_record','miaodaHashiBestV47','miaodaNurikabeBestV47','miaodaAkariBestV47','miaodaLianlianBestV47','miaodaP15BestV47'];
  allKeys.forEach(function(k){
    var v=raw(k);
    if(v&&v!=='0'&&v!=='{}'&&v!=='[]'&&v!=='null')recCount++;
  });
  $('oRecords').textContent=recCount;
  var totW=0;
  ['go_record','xq_record','ic_record','gomoku_record'].forEach(function(k){var r=get(k)||{};totW+=(r.w||0);});
  $('oWins').textContent=totW;
  $('oRead').textContent=Math.floor(secs/60);
})();
</script>
<script>
if ('serviceWorker' in navigator && location.protocol.startsWith('http')) {
  window.addEventListener('load', function(){ navigator.serviceWorker.register('sw.js').catch(function(){}); });
}
</script>
</body>
</html>
